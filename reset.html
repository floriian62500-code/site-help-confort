<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Page de réinitialisation du cache navigateur (Service Worker, IndexedDB, caches HTTP, localStorage) pour HELP! Confort Saint-Omer.">
<link rel="canonical" href="https://www.depan59-62.fr/reset.html">
<title>Reset cache navigateur — HELP! Confort Saint-Omer</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:560px;margin:60px auto;padding:32px;background:#F7FBFD;color:#0A1428}
h1{font-size:1.5rem;font-weight:800;margin:0 0 8px}
p{line-height:1.55;color:#475569}
.step{padding:14px 18px;background:#fff;border-left:4px solid #0DA0CF;border-radius:8px;margin:14px 0;box-shadow:0 2px 8px rgba(10,20,40,.04)}
.step strong{color:#0DA0CF;display:block;margin-bottom:4px}
.ok{border-left-color:#22A06B;background:linear-gradient(135deg,#ECFDF5,#fff);color:#065F46}
.err{border-left-color:#E11D48;background:linear-gradient(135deg,#FEF2F2,#fff);color:#9F1239}
.btn{display:inline-block;padding:13px 24px;background:#0DA0CF;color:#fff;text-decoration:none;border-radius:10px;font-weight:700;margin-top:18px}
code{background:#E5EDF3;padding:2px 6px;border-radius:4px;font-size:.86em}
</style>
</head>
<body>

<h1>🔄 Reset cache navigateur</h1>
<p>Cette page force la suppression de tout le cache local (Service Worker, IndexedDB, caches HTTP) pour que tu vois la dernière version du site.</p>

<div id="status" class="step">⏳ Réinitialisation en cours…</div>

<div id="log" style="font-family:monospace;font-size:.82rem;background:#0A1428;color:#9CD7F0;padding:14px 18px;border-radius:8px;margin-top:18px;white-space:pre-wrap"></div>

<a href="/" class="btn" id="back" style="display:none">→ Retourner sur depan59-62.fr</a>

<script>
(async function reset(){
  var log = document.getElementById('log');
  var status = document.getElementById('status');
  function plog(msg){ log.textContent += msg + '\n'; }

  plog('[1/4] Désinscription des Service Workers…');
  if ('serviceWorker' in navigator) {
    try {
      var regs = await navigator.serviceWorker.getRegistrations();
      plog('  → ' + regs.length + ' SW trouvé(s)');
      for (var r of regs) {
        await r.unregister();
        plog('  ✓ unregister ' + (r.scope || '/'));
      }
    } catch(e){ plog('  ✗ ' + e.message); }
  } else { plog('  → API serviceWorker indisponible'); }

  plog('[2/4] Vidage des caches HTTP…');
  if ('caches' in window) {
    try {
      var keys = await caches.keys();
      plog('  → ' + keys.length + ' cache(s)');
      for (var k of keys) {
        await caches.delete(k);
        plog('  ✓ delete ' + k);
      }
    } catch(e){ plog('  ✗ ' + e.message); }
  }

  plog('[3/4] Vidage localStorage + sessionStorage…');
  try {
    localStorage.clear();
    sessionStorage.clear();
    plog('  ✓ Storage purgé');
  } catch(e){ plog('  ✗ ' + e.message); }

  plog('[4/4] Vidage IndexedDB…');
  if (indexedDB && indexedDB.databases) {
    try {
      var dbs = await indexedDB.databases();
      plog('  → ' + dbs.length + ' DB');
      for (var db of dbs) {
        if (db.name) { indexedDB.deleteDatabase(db.name); plog('  ✓ delete ' + db.name); }
      }
    } catch(e){ plog('  ✗ ' + e.message); }
  }

  status.className = 'step ok';
  status.innerHTML = '<strong>✓ Reset terminé</strong>Tu peux maintenant retourner sur le site.';
  document.getElementById('back').style.display = 'inline-block';
  plog('\n→ Reset terminé à ' + new Date().toLocaleTimeString());
})();
</script>

</body>
</html>
