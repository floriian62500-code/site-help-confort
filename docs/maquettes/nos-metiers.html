<!doctype html>
<html lang="fr">
<head>

<title>Maquette — Nos métiers | HELP Confort</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap">
<style>
  :root{--bleu:#0DA0CF;--encre:#0A6C8F;--marine:#0A1428;--orange:#B83E0A;--fond:#F3F5F8;--tint:#E8F5FA;--bord:#E3E8EF;--gris:#6B7A90;--texte:#46566E}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0D1520;color:var(--marine);-webkit-font-smoothing:antialiased}
  .bar{position:sticky;top:0;z-index:50;background:#0D1520;border-bottom:1px solid #22314a;padding:14px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .bar h1{margin:0;font-size:15px;font-weight:800;color:#fff;letter-spacing:-.2px;margin-right:auto}
  .bar h1 span{display:block;font-size:11.5px;font-weight:500;color:#8FA3BF;letter-spacing:0}
  .onglet{appearance:none;border:1px solid #2C3D59;background:#16223a;color:#CBD9EC;font:inherit;font-size:13px;font-weight:700;padding:10px 14px;border-radius:10px;cursor:pointer;min-height:44px}
  .onglet[aria-selected="true"]{background:var(--bleu);border-color:var(--bleu);color:#fff}
  .scene{padding:26px 20px 60px;display:flex;justify-content:center}
  .cadre{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .cadre.desk{width:1440px;transform-origin:top center}
  .cadre.mob{width:390px;border-radius:26px;border:8px solid #16223a}
  .legende{max-width:760px;margin:0 auto 22px;color:#9FB3CC;font-size:13.5px;line-height:1.6;text-align:center}
  .legende b{color:#fff}
  a{text-decoration:none}
  /* ——— page ——— */
  .top{height:76px;background:#fff;border-bottom:1px solid var(--bord);display:flex;align-items:center;padding:0 56px;gap:28px}
  .logo{width:46px;height:46px;border-radius:10px;background:var(--bleu);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px}
  .nav{flex:1;display:flex;justify-content:center;gap:30px;font-size:14.5px;font-weight:600;color:var(--texte)}
  .nav .on{color:var(--encre);border-bottom:2px solid var(--bleu);padding-bottom:5px}
  .tel{display:flex;align-items:center;gap:9px;height:44px;padding:0 20px;border-radius:999px;background:var(--marine);color:#fff;font-size:14.5px;font-weight:700}
  .hero{background:var(--marine);padding:52px 56px 46px;display:flex;align-items:flex-end;justify-content:space-between;gap:48px}
  .kicker{font-size:12px;font-weight:700;letter-spacing:2.2px;color:#1FC4F0}
  .hero h1{margin:14px 0 0;font-size:54px;line-height:1.08;font-weight:800;color:#fff;letter-spacing:-1.4px}
  .ital{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;color:#7FDCF7}
  .hero p{margin:14px 0 0;font-size:17px;line-height:1.6;color:#C3CEDE;max-width:640px}
  .stat{width:168px;padding:16px 18px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
  .stat b{display:block;font-size:26px;font-weight:800;color:#fff;letter-spacing:-.8px}
  .stat span{font-size:12.5px;font-weight:600;color:#9FB0C6}
  .corps{background:var(--fond);padding:44px 56px}
  .duo{display:flex;gap:28px;align-items:flex-start}
  .carte{background:#fff;border:1px solid var(--bord);border-radius:22px;box-shadow:0 10px 30px rgba(10,20,40,.06)}
  .hot{cursor:pointer}
  .hot:hover circle{stroke:var(--orange);stroke-width:3}
  .panneau{width:488px;flex-shrink:0;padding:30px}
  .presta{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border:1px solid var(--bord);border-radius:12px;background:#FAFBFD;margin-bottom:9px}
  .presta b{font-size:14px;font-weight:600}
  .presta i{font-style:normal;font-size:14px;font-weight:800;color:var(--encre);white-space:nowrap}
  .cta{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:14px;font-size:16px;font-weight:700;margin-bottom:10px}
  .cta.achat{background:var(--orange);color:#fff}
  .cta.devis{background:#fff;border:2px solid var(--marine);color:var(--marine)}
  .grille{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}
  .tuile{display:flex;flex-direction:column;gap:9px;padding:20px;background:#fff;border:1px solid var(--bord);border-radius:16px}
  .pastille{width:38px;height:38px;border-radius:10px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--encre)}
  /* ——— mobile ——— */
  .m-top{height:60px;background:#fff;border-bottom:1px solid var(--bord);display:flex;align-items:center;padding:0 16px;gap:10px}
  .m-hero{background:var(--marine);padding:26px 16px 24px}
  .m-hero h1{margin:8px 0 0;font-size:29px;line-height:1.14;font-weight:800;color:#fff;letter-spacing:-.9px}
  .m-hero p{margin:10px 0 0;font-size:14.5px;line-height:1.55;color:#C3CEDE}
  .m-pad{padding:16px 16px 0}
  .m-grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .m-tuile{display:flex;flex-direction:column;gap:5px;padding:13px;background:#fff;border:1px solid var(--bord);border-radius:13px;min-height:44px}
  .m-cta{display:flex;align-items:center;justify-content:center;gap:9px;height:52px;border-radius:13px;font-size:15.5px;font-weight:700;margin-top:10px}
  /* ——— accueil ——— */
  .acc{padding:58px 56px;display:flex;gap:46px;align-items:center;background:#fff}
  .acc h2{margin:10px 0 0;font-size:42px;line-height:1.1;font-weight:800;letter-spacing:-1.2px}
  .acc .ital{color:var(--encre)}
  .puces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:620px}
  .puce{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border:1px solid var(--bord);border-radius:13px;background:#fff;font-size:14.5px;font-weight:700;color:var(--marine)}
  .puce em{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--encre)}
  .m-acc{padding:30px 16px;background:#fff}
  .m-acc h2{margin:8px 0 0;font-size:29px;line-height:1.12;font-weight:800;letter-spacing:-.9px}
</style>
</head>

  + '<div><h2 style="margin:0;font-size:21px;font-weight:800;letter-spacing:-.5px">'+m.nom+'</h2><div style="font-size:11.5px;font-weight:600;color:var(--gris)">'+m.piece+'</div></div></div>'
  + '<p style="font-size:14px;line-height:1.6;color:var(--texte)">'+m.desc+'</p>'
  + m.p.map(p=>'<div class="presta"><b style="font-size:13px">'+p[0]+'</b><i style="font-size:13px">'+p[1]+'</i></div>').join('')
  + (m.achat?'<a class="m-cta" style="background:var(--orange);color:#fff" href="#">'+ICO_PANIER+'Réserver en ligne</a>':'')
  + '<a class="m-cta" style="background:#fff;border:2px solid var(--marine);color:var(--marine)" href="#">'+ICO_DEVIS+'Demander un devis</a>'
  + '<div style="font-size:12px;color:var(--gris);text-align:center;margin-top:10px">'+(m.achat?'Prix TTC annoncé avant intervention.':"Pas de tarif public : la demande passe par le devis.")+'</div></div></div>'
  + '<div style="padding:18px 16px 24px"><h2 style="margin:0 0 12px;font-size:18px;font-weight:800">Les neuf métiers</h2><div class="m-grille">'
  + M.map(x=>'<a class="m-tuile" href="#"><b style="font-size:14.5px">'+x.nom+'</b><span style="font-size:11.5px;font-weight:700;color:'+(x.achat?'var(--orange)':'var(--encre)')+'">'+(x.achat?'Réservable en ligne':'Sur devis')+'</span></a>').join('')
  + '</div></div>';
}
function accDesk(){
  return '<div class="acc"><div style="width:620px;flex-shrink:0;background:var(--fond);border:1px solid var(--bord);border-radius:22px;padding:18px">'+maison(false,19)+'</div>'
  + '<div style="flex:1"><div class="kicker" style="color:var(--encre)">NOS MÉTIERS</div>'
  + '<h2>Neuf métiers,<br><span class="ital">une seule équipe salariée.</span></h2>'
  + '<p style="font-size:16.5px;line-height:1.6;color:var(--texte);max-width:560px">De la fuite d\'eau au monte-escalier, nous intervenons sur toute la maison. Pas de sous-traitance : nos techniciens sont chez nous.</p>'
  + '<div class="puces">'+M.map(m=>'<a class="puce" href="#"><em>'+m.n+'</em>'+m.nom+'</a>').join('')+'</div>'
  + '<div style="display:flex;gap:14px;margin-top:22px"><a href="#" style="display:flex;align-items:center;gap:10px;height:58px;padding:0 30px;border-radius:15px;background:var(--orange);color:#fff;font-size:16.5px;font-weight:700">Découvrir nos métiers'+ICO_FLECHE+'</a>'
  + '<a href="#" style="display:flex;align-items:center;height:58px;padding:0 26px;border-radius:15px;border:2px solid var(--marine);color:var(--marine);font-size:16.5px;font-weight:700">Voir les tarifs</a></div></div></div>';
}
function accMob(){
  return '<div class="m-acc"><div class="kicker" style="color:var(--encre);font-size:10.5px">NOS MÉTIERS</div>'
  + '<h2>Neuf métiers,<br><span class="ital">une seule équipe.</span></h2>'
  + '<p style="font-size:14.5px;line-height:1.55;color:var(--texte)">De la fuite d\'eau au monte-escalier, nous intervenons sur toute la maison. Pas de sous-traitance.</p>'
  + '<div style="background:var(--fond);border:1px solid var(--bord);border-radius:16px;padding:10px;margin:18px 0">'+maison(false,24)+'</div>'
  + '<div class="m-grille">'+M.map(m=>'<a class="puce" style="height:46px;font-size:13px" href="#"><em style="width:22px;height:22px;font-size:11px">'+m.n+'</em>'+m.nom+'</a>').join('')+'</div>'
  + '<a href="#" style="display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:14px;background:var(--orange);color:#fff;font-size:16px;font-weight:700;margin-top:18px">Découvrir nos métiers'+ICO_FLECHE+'</a></div>';
}
const LEG = {
 'page-desk':"<b>La page « Nos métiers », version ordinateur.</b> Cliquez une pièce de la maison : le panneau de droite change. Deux boutons maximum — « Réserver en ligne » n'apparaît que pour les cinq métiers qui ont un vrai tarif public.",
 'page-mob':"<b>La même page sur téléphone.</b> La maison reste pour comprendre, mais la liste en deux colonnes devient la navigation principale : viser une zone d'un dessin sur 390 px n'est pas fiable.",
 'acc-desk':"<b>Le bloc sur la page d'accueil, version ordinateur.</b> Une vue d'ensemble qui envoie vers la page Métiers — il ne recrée pas un troisième hub.",
 'acc-mob':"<b>Le bloc d'accueil sur téléphone.</b> Même logique, empilée."
};
function rendre(){
  const c = document.getElementById('cadre');
  const mob = vue.endsWith('mob');
  c.className = 'cadre ' + (mob ? 'mob' : 'desk');
  c.innerHTML = vue==='page-desk'?pageDesk():vue==='page-mob'?pageMob():vue==='acc-desk'?accDesk():accMob();
  document.getElementById('legende').innerHTML = LEG[vue];
  if(!mob){ const e=(window.innerWidth-56)/1440; c.style.transform = e<1 ? 'scale('+e.toFixed(3)+')' : 'none'; c.style.marginBottom = e<1 ? (-(1-e)*c.offsetHeight)+'px' : '0'; }
  else c.style.transform='none';
  c.querySelectorAll('.hot').forEach(g=>{
    const go=()=>{ sel=+g.dataset.i; rendre(); };
    g.addEventListener('click',go);
    g.addEventListener('keydown',ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); go(); }});
  });
}
document.querySelectorAll('.onglet').forEach(b=>b.addEventListener('click',()=>{
  vue=b.dataset.vue;
  document.querySelectorAll('.onglet').forEach(x=>x.setAttribute('aria-selected', x===b?'true':'false'));
  rendre();
}));
window.addEventListener('resize',rendre);
rendre();
</script>
</body>
</html>
