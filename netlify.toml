# Build trigger: 2026-05-14 05:51:37 — FORCE redeploy + RLS migration
# ═══════════════════════════════════════════════════════════════════
# Netlify Configuration — HELP! Confort Saint-Omer
# Documentation : https://docs.netlify.com/configure-builds/file-based-configuration/
# ═══════════════════════════════════════════════════════════════════

[build]
  # Pas de build process — site statique HTML
  publish = "."
  command = ""
  # Ignore les commits qui ne modifient que les fichiers d'audit / docs / scripts (pas de redéploiement nécessaire)
  ignore = "git diff --quiet HEAD^ HEAD -- ':(exclude)admin-pro/audits/*' ':(exclude)admin-pro/AGENT_TODO.md' ':(exclude)admin-pro/MEMOIRE_IA_MAINTENANCE.md' ':(exclude)admin-pro/TARIFS_REFERENCE.md' ':(exclude).autopush/*' ':(exclude)scripts/*' ':(exclude)docs/*' ':(exclude)*.md'"

# ═══════════════════════════════════════════════════════════════════
# Pretty URLs : /plombier-saint-omer → /plombier-saint-omer.html
# ═══════════════════════════════════════════════════════════════════
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# ═══════════════════════════════════════════════════════════════════
# Headers de sécurité (en complément du fichier _headers)
# ═══════════════════════════════════════════════════════════════════
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy — Adaptée au site (Supabase, BAN, Fonts, iframes FB/Maps)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://api-adresse.data.gouv.fr https://api.anthropic.com https://www.google-analytics.com https://*.tile.openstreetmap.org; frame-src https://www.facebook.com https://www.google.com https://www.google.com/maps/ https://www.youtube.com; frame-ancestors 'self'; form-action 'self' mailto:; base-uri 'self'; upgrade-insecure-requests"
    # COOP/COEP relax pour permettre les iframes Facebook
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Cache long pour assets statiques (images, fonts, css, js)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML : cache court pour permettre les mises à jour rapides
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service Worker : NEVER cache pour permettre la mise à jour immédiate
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# ═══════════════════════════════════════════════════════════════════
# Redirections (en complément du fichier _redirects)
# Pretty URLs automatiques + 404 fallback
# ═══════════════════════════════════════════════════════════════════
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin-pro"
  to = "/admin-pro/"
  status = 301

# RFC 9116 : alias /security.txt vers /.well-known/security.txt
[[redirects]]
  from = "/security.txt"
  to = "/.well-known/security.txt"
  status = 301

# Custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
