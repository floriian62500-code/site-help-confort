# Build trigger: 2026-05-14 05:51:37 — FORCE redeploy + RLS migration
# ═══════════════════════════════════════════════════════════════════
# Netlify Configuration — HELP Confort Saint-Omer
# Documentation : https://docs.netlify.com/configure-builds/file-based-configuration/
# ═══════════════════════════════════════════════════════════════════

[build]
  # Pas de build process — site statique HTML
  publish = "."
  command = ""
  # Ignore les commits qui ne touchent QUE des fichiers non-publiés en prod.
  # Retourne 0 (skip build) si le diff HEAD^..HEAD est entièrement contenu dans les paths exclus.
  # → admin-pro/audits/ (rapports IA), .md (docs), .autopush/, scripts/, content/, supabase/, logs, _backup
  ignore = "git diff --quiet HEAD^ HEAD -- . ':!admin-pro/audits/' ':!admin-pro/AGENT_TODO.md' ':!admin-pro/MEMOIRE_IA_MAINTENANCE.md' ':!admin-pro/TARIFS_REFERENCE.md' ':!admin-pro/URGENT.md' ':!admin-pro/DEPLOY.md' ':!.autopush/' ':!scripts/' ':!docs/' ':!logs/' ':!images/_backup_png/' ':!**/*.md' ':!**/*.log'"

# ═══════════════════════════════════════════════════════════════════
# Pretty URLs : /plombier-saint-omer → /plombier-saint-omer.html
# ═══════════════════════════════════════════════════════════════════
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# ═══════════════════════════════════════════════════════════════════
# Headers de sécurité (en complément du fichier _headers)
# ═══════════════════════════════════════════════════════════════════
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy — Adaptée au site (Supabase, BAN, Fonts, iframes FB/Maps)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: https://scontent.xx.fbcdn.net https://scontent-cdg2-1.xx.fbcdn.net; connect-src 'self' https://*.supabase.co https://api-adresse.data.gouv.fr https://api.anthropic.com https://www.google-analytics.com https://*.tile.openstreetmap.org https://graph.facebook.com https://*.fbcdn.net https://googleapis.com https://*.googleapis.com; frame-src https://www.facebook.com https://www.google.com https://www.google.com/maps/ https://www.youtube.com; frame-ancestors 'self'; form-action 'self' mailto:; base-uri 'self'; upgrade-insecure-requests"
    # COOP/COEP relax pour permettre les iframes Facebook
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Cache long pour assets statiques (images, fonts, css, js)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML : cache court pour permettre les mises à jour rapides
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service Worker : NEVER cache pour permettre la mise à jour immédiate
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# ═══════════════════════════════════════════════════════════════════
# Redirections (en complément du fichier _redirects)
# Pretty URLs automatiques + 404 fallback
# ═══════════════════════════════════════════════════════════════════
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin-pro"
  to = "/admin-pro/"
  status = 301

# RFC 9116 : alias /security.txt vers /.well-known/security.txt
[[redirects]]
  from = "/security.txt"
  to = "/.well-known/security.txt"
  status = 301

# Custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
