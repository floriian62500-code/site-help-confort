name: Supabase — Auto deploy SQL migrations

# Déclenchement automatique :
# - À chaque push sur main qui modifie un fichier dans supabase/migrations/
# - Manuellement via "Run workflow" sur GitHub
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**.sql'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

# Empêche 2 déploiements en parallèle (file d'attente FIFO sur main)
concurrency:
  group: supabase-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: btcbjwqiivhpwoszomhg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify secrets are configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret manquant. À configurer dans Settings → Secrets → Actions."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret manquant. À configurer dans Settings → Secrets → Actions."
            exit 1
          fi
          echo "✓ Secrets présents"

      - name: Link project
        run: supabase link --project-ref $PROJECT_REF
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # ─────────────────────────────────────────────────────────────────────────────────
      # Déploiement des fonctions edge : liste blanche explicite (directive 5796732231 §1).
      #
      # AVANT : la boucle déployait TOUT supabase/functions/*/. Un simple dossier dans le dépôt
      # partait donc en production au premier merge, sans décision — et un merge recette → main
      # aurait créé 10 fonctions jamais décidées.
      #
      # MAINTENANT : seules les fonctions en état « current » dans supabase/functions/DEPLOIEMENT.json
      # sont déployées. « pending » (non déployée) et « quarantine » (déployée, sous surveillance)
      # ne le sont JAMAIS automatiquement. Un dossier absent du fichier fait échouer l'étape :
      # ajouter une fonction à la production est une modification visible de ce fichier, donc un acte.
      # ─────────────────────────────────────────────────────────────────────────────────
      - name: Contrôle de la liste blanche de déploiement
        run: node scripts/tests/deploy-allowlist.test.mjs

      - name: Deploy Edge Functions (liste blanche « current » uniquement)
        if: ${{ hashFiles('supabase/functions/**') != '' }}
        run: |
          set -euo pipefail
          LISTE=$(node -e "const r=require('./supabase/functions/DEPLOIEMENT.json');console.log(Object.entries(r.fonctions).filter(([,v])=>v.etat==='current').map(([k])=>k).join(' '))")
          if [ -z "$LISTE" ]; then
            echo "::error::Liste blanche vide : aucune fonction à déployer. Arrêt."
            exit 1
          fi
          echo "Fonctions autorisées : $(echo "$LISTE" | wc -w)"
          ECHECS=""
          for name in $LISTE; do
            if [ ! -f "supabase/functions/$name/index.ts" ]; then
              echo "::error::$name est en « current » mais n'a pas de source. Arrêt avant tout déploiement."
              exit 1
            fi
            echo "→ Deploy $name"
            supabase functions deploy "$name" --project-ref $PROJECT_REF || ECHECS="$ECHECS $name"
          done
          if [ -n "$ECHECS" ]; then
            echo "::error::Échec de déploiement :$ECHECS"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Récap
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "Déploiement Supabase terminé"
          echo "Projet : $PROJECT_REF"
          echo "Migrations dans supabase/migrations/ :"
          ls -1 supabase/migrations/ 2>/dev/null | sed 's/^/  - /'
          echo "═══════════════════════════════════════════════════════════"
