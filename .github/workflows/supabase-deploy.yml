name: Supabase — Auto deploy SQL migrations

# Déclenchement automatique :
# - À chaque push sur main qui modifie un fichier dans supabase/migrations/
# - Manuellement via "Run workflow" sur GitHub
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**.sql'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

# Empêche 2 déploiements en parallèle (file d'attente FIFO sur main)
concurrency:
  group: supabase-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: btcbjwqiivhpwoszomhg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify secrets are configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret manquant. À configurer dans Settings → Secrets → Actions."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret manquant. À configurer dans Settings → Secrets → Actions."
            exit 1
          fi
          echo "✓ Secrets présents"

      - name: Link project
        run: supabase link --project-ref $PROJECT_REF
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions (si modifiées)
        if: ${{ hashFiles('supabase/functions/**') != '' }}
        continue-on-error: true
        run: |
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            # On skip les dossiers d'utilitaires (_shared, etc.)
            if [[ "$name" == _* ]]; then continue; fi
            echo "→ Deploy $name"
            supabase functions deploy "$name" --project-ref $PROJECT_REF || echo "::warning::Échec deploy $name"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Récap
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "Déploiement Supabase terminé"
          echo "Projet : $PROJECT_REF"
          echo "Migrations dans supabase/migrations/ :"
          ls -1 supabase/migrations/ 2>/dev/null | sed 's/^/  - /'
          echo "═══════════════════════════════════════════════════════════"
