<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" role="img" aria-label="Kinedo — douche, bain, spa">
  <!-- Wordmark Kinedo (style cursif manuscrit) -->
  <text x="170" y="78" text-anchor="middle"
        font-family="'Brush Script MT', 'Lucida Handwriting', cursive"
        font-size="74" font-style="italic" font-weight="400" fill="#0A0A0A"
        letter-spacing="-2">Kinedo</text>

  <!-- Trait séparateur fin -->
  <line x1="135" y1="105" x2="205" y2="105" stroke="#0A0A0A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Baseline : douche · bain · spa -->
  <text x="170" y="135" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="300" fill="#0A0A0A" letter-spacing="2">
    douche <tspan font-weight="500"> · </tspan> bain <tspan font-weight="500"> · </tspan> spa
  </text>

  <!-- Drapeau français vertical, sous le texte -->
  <g transform="translate(150,156)">
    <rect x="0"  y="0" width="14" height="34" fill="#0055A4"/>
    <rect x="20" y="0" width="14" height="34" fill="#EF4135"/>
  </g>
</svg>
