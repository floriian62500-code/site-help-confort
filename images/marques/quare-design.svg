<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" role="img" aria-label="Quare Design — mobilier salle de bain">
  <!-- Wordmark Quare en sans-serif large -->
  <text x="180" y="58" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="48" font-weight="700" fill="#1a1a1a"
        letter-spacing="3">QUARE</text>

  <!-- Trait fin sous le wordmark -->
  <line x1="80" y1="74" x2="280" y2="74" stroke="#C29762" stroke-width="1.2"/>

  <!-- Baseline Design en italique copper -->
  <text x="180" y="100" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="300" font-style="italic" fill="#C29762"
        letter-spacing="6">design</text>

  <!-- Petit accent géométrique : carré au-dessus du Q -->
  <rect x="106" y="22" width="8" height="8" fill="#C29762"/>
</svg>
