<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Demandes clients · Back-Office HELP! Confort</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
.leads-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px;padding:12px;background:#fff;border:1px solid var(--ink-100);border-radius:14px;box-shadow:0 1px 2px rgba(11,18,32,.04)}
.leads-toolbar .toolbar-search{flex:1 1 240px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--ink-50);border:1px solid var(--ink-100);border-radius:10px}
.leads-toolbar .toolbar-search input{flex:1;border:none;background:transparent;outline:none;font:inherit;color:var(--ink-900);font-size:.88rem}
.leads-toolbar .toolbar-search svg{width:16px;height:16px;color:var(--ink-400)}
.leads-toolbar select{padding:8px 32px 8px 12px;border:1px solid var(--ink-100);border-radius:10px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>") right 10px center/14px no-repeat;font:inherit;font-size:.86rem;color:var(--ink-900);appearance:none;cursor:pointer;font-weight:500}

.leads-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.stat-pill{background:#fff;border:1px solid var(--ink-100);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.18s}
.stat-pill:hover{border-color:var(--hc-primary);transform:translateY(-1px)}
.stat-pill.is-active{border-color:var(--hc-primary);background:rgba(13,160,207,.04)}
.stat-pill .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-500);font-weight:700;margin-bottom:4px}
.stat-pill .val{font-size:1.5rem;font-weight:800;color:var(--ink-900);line-height:1}
.stat-pill.nouveau .val{color:#d92d20}
.stat-pill.en_cours .val{color:#FFB400}
.stat-pill.gagne .val{color:#00aa50}

.lead-card{background:#fff;border:1px solid var(--ink-100);border-radius:12px;padding:14px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;transition:.18s;cursor:pointer}
.lead-card:hover{border-color:var(--ink-200);box-shadow:0 4px 12px rgba(11,18,32,.06)}
.lead-status{padding:3px 9px;border-radius:6px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;display:inline-flex;align-items:center;gap:5px}
.lead-status::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.lead-status.nouveau{background:rgba(217,45,32,.10);color:#a51919}
.lead-status.en_cours{background:rgba(255,184,0,.14);color:#7a4c00}
.lead-status.qualifie{background:rgba(13,160,207,.10);color:#0a7fa8}
.lead-status.devis_envoye{background:rgba(124,58,237,.10);color:#5b21b6}
.lead-status.gagne{background:rgba(0,170,80,.12);color:#007033}
.lead-status.perdu{background:var(--ink-50);color:var(--ink-500)}
.lead-status.archive{background:var(--ink-50);color:var(--ink-400)}
.lead-body{min-width:0}
.lead-body h3{font-size:.94rem;font-weight:700;color:var(--ink-900);margin:0 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead-body .meta{font-size:.78rem;color:var(--ink-500);display:flex;gap:12px;flex-wrap:wrap}
.lead-meta-cell{font-size:.78rem;color:var(--ink-700);font-weight:600;text-align:right}
.lead-meta-cell .when{color:var(--ink-400);font-weight:400;font-size:.74rem}
.lead-actions{display:flex;gap:6px}

.modal-backdrop{position:fixed;inset:0;background:rgba(11,18,32,.50);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.modal-backdrop.is-open{display:flex}
.modal-panel{background:#fff;border-radius:16px;width:100%;max-width:720px;box-shadow:0 24px 60px rgba(11,18,32,.30)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--ink-100);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:1.05rem;font-weight:800;margin:0}
.modal-close{border:none;background:var(--ink-50);width:34px;height:34px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-500)}
.modal-body{padding:22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--ink-100);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;background:var(--ink-50);border-bottom-left-radius:16px;border-bottom-right-radius:16px}
.lead-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.lead-info-cell{padding:10px 12px;background:var(--ink-50);border-radius:10px}
.lead-info-cell .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-500);font-weight:700;margin-bottom:4px}
.lead-info-cell .val{font-size:.92rem;color:var(--ink-900);font-weight:600;word-break:break-word}
.lead-info-cell .val a{color:var(--hc-primary);text-decoration:none}
.lead-info-cell.full{grid-column:1/-1}
.lead-info-cell.full .val{font-weight:400;white-space:pre-wrap;line-height:1.5}
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-400);background:#fff;border:1px dashed var(--ink-200);border-radius:14px}
.empty-state svg{width:48px;height:48px;color:var(--ink-300);margin-bottom:10px}
.toast-stack{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:2000;pointer-events:none}
.toast{background:#fff;border:1px solid var(--ink-100);border-radius:10px;padding:11px 14px;box-shadow:0 8px 24px rgba(11,18,32,.16);font-size:.86rem;font-weight:600;color:var(--ink-900);pointer-events:auto;min-width:240px}
.toast.ok{border-left:3px solid #00aa50}
.toast.err{border-left:3px solid #d92d20}
</style>
</head>
<body>
<div class="admin-overlay"></div>
<div class="admin-shell">
  <aside class="admin-sidebar"></aside>
  <main class="admin-main">
    <header class="admin-topbar"></header>
    <div class="admin-content">
      <div class="breadcrumb">
        <a href="index.html">Dashboard</a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
        <strong>Demandes clients</strong>
      </div>
      <div class="admin-page-head">
        <div><h1>Demandes clients</h1><p>Capture des prospects depuis les formulaires du site et les appels.</p></div>
        <button class="btn" id="btnExport">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exporter CSV
        </button>
      </div>

      <div class="leads-stats" id="leadsStats"></div>

      <div class="leads-toolbar">
        <div class="toolbar-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" placeholder="Nom, email, téléphone, ville…">
        </div>
        <select id="filterStatus">
          <option value="">Tous statuts</option>
          <option value="nouveau">Nouveau</option>
          <option value="en_cours">En cours</option>
          <option value="qualifie">Qualifié</option>
          <option value="devis_envoye">Devis envoyé</option>
          <option value="gagne">Gagné</option>
          <option value="perdu">Perdu</option>
          <option value="archive">Archivé</option>
        </select>
        <select id="filterMetier">
          <option value="">Tous métiers</option>
          <option value="plomberie">Plomberie</option>
          <option value="chauffage">Chauffage</option>
          <option value="electricite">Électricité</option>
          <option value="serrurerie">Serrurerie</option>
          <option value="vitrerie">Vitrerie</option>
          <option value="renovation">Rénovation</option>
          <option value="autre">Autre</option>
        </select>
      </div>

      <div id="leadsList"></div>
    </div>
  </main>
</div>

<!-- Modale détail lead -->
<div class="modal-backdrop" id="leadModal">
  <div class="modal-panel">
    <div class="modal-head">
      <h2 id="leadTitle">Demande</h2>
      <button class="modal-close" id="leadClose">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="leadBody"></div>
    <div class="modal-foot" id="leadFoot"></div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="assets/supabase.js"></script>
<script src="assets/admin.js"></script>
<script src="assets/layout.js"></script>
<script>
function toast(msg,type='ok',d=2400){
  const stack=document.getElementById('toastStack');
  const t=document.createElement('div'); t.className='toast '+type;
  t.textContent=msg;
  stack.appendChild(t); setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),200)},d);
}

const STATUS_LABELS = {
  nouveau:'Nouveau', en_cours:'En cours', qualifie:'Qualifié',
  devis_envoye:'Devis envoyé', gagne:'Gagné', perdu:'Perdu', archive:'Archivé'
};
const METIER_LABELS = { plomberie:'Plomberie',chauffage:'Chauffage',electricite:'Électricité',serrurerie:'Serrurerie',vitrerie:'Vitrerie',renovation:'Rénovation',menuiserie:'Menuiserie',volets:'Volets',pmr:'Adaptation PMR',multiservice:'Multi-services',autre:'Autre' };

let _all = [];
let _filterStatusOverride = null;

(async function(){
  await HCSupabase.init();
  const session = await HCAdmin.requireAuth();
  if (!session) return;
  await HCLayout.mount('leads', 'Demandes clients');

  const c = await HCSupabase.init();

  async function load(){
    const { data, error } = await c.from('leads').select('*').order('created_at',{ascending:false});
    if (error) {
      if (error.code === '42P01') toast('Table leads absente — exécutez setup_leads.sql','err',6000);
      else toast('Erreur : '+error.message,'err');
      return;
    }
    _all = data || [];
    renderStats();
    renderList();
  }

  function renderStats(){
    const counts = {};
    Object.keys(STATUS_LABELS).forEach(s => counts[s] = 0);
    _all.forEach(l => counts[l.status] = (counts[l.status]||0) + 1);
    const stats = [
      { key:'all', lbl:'Tous', val:_all.length },
      { key:'nouveau', lbl:'Nouveaux', val:counts.nouveau, cls:'nouveau' },
      { key:'en_cours', lbl:'En cours', val:counts.en_cours, cls:'en_cours' },
      { key:'devis_envoye', lbl:'Devis envoyés', val:counts.devis_envoye },
      { key:'gagne', lbl:'Gagnés', val:counts.gagne, cls:'gagne' }
    ];
    document.getElementById('leadsStats').innerHTML = stats.map(s => `
      <div class="stat-pill ${s.cls||''} ${_filterStatusOverride === s.key ? 'is-active' : ''}" data-statkey="${s.key}">
        <div class="lbl">${s.lbl}</div>
        <div class="val">${s.val}</div>
      </div>
    `).join('');
    document.querySelectorAll('.stat-pill').forEach(p => {
      p.addEventListener('click', () => {
        const k = p.dataset.statkey;
        _filterStatusOverride = (_filterStatusOverride === k) ? null : k;
        if (_filterStatusOverride === 'all') _filterStatusOverride = null;
        renderStats();
        renderList();
      });
    });
  }

  // Filtre commun, réutilisé par renderList ET l'export CSV
  function getFilteredLeads(){
    const q = (document.getElementById('search').value || '').toLowerCase().trim();
    const sFilter = document.getElementById('filterStatus').value || _filterStatusOverride;
    const mFilter = document.getElementById('filterMetier').value;
    return _all.filter(l => {
      if (sFilter && sFilter !== 'all' && l.status !== sFilter) return false;
      if (mFilter && l.metier !== mFilter) return false;
      if (q){
        const hay = [l.nom,l.email,l.telephone,l.ville,l.message,l.metier].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function renderList(){
    const filtered = getFilteredLeads();

    const list = document.getElementById('leadsList');
    if (!filtered.length){
      const m = _all.length
        ? { ic:'🔎', h:'Aucun résultat', p:'Modifie tes filtres pour voir tes demandes.' }
        : { ic:'📥', h:'Pas encore de demandes', p:'Les demandes envoyées via les formulaires du site arrivent ici automatiquement, en temps réel.' };
      list.innerHTML = `<div class="hc-empty"><div class="hc-empty-icon">${m.ic}</div><h3>${m.h}</h3><p>${m.p}</p></div>`;
      return;
    }
    list.innerHTML = filtered.map(l => {
      const when = timeAgo(l.created_at);
      const phoneIcon = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';

      // Détecte le type de demande pour badge coloré
      const isSouscription = l.source === 'souscription' || (l.type_demande && /contrat|souscription/i.test(l.type_demande));
      const isUrgent = l.priority === 'urgente' || (l.type_demande && /urgence|fuite|panne/i.test(l.type_demande));
      const isDevis = !isSouscription && !isUrgent && (l.type_demande === 'devis' || !l.type_demande);

      let typeBadge = '';
      if (isUrgent) {
        typeBadge = `<span style="background:#FEE2E2;color:#B91C1C;font-size:.68rem;padding:2px 8px;border-radius:4px;font-weight:800;letter-spacing:.04em">🔥 URGENCE</span>`;
      } else if (isSouscription) {
        typeBadge = `<span style="background:#DBEAFE;color:#1E40AF;font-size:.68rem;padding:2px 8px;border-radius:4px;font-weight:800;letter-spacing:.04em">📄 SOUSCRIPTION</span>`;
      } else if (isDevis) {
        typeBadge = `<span style="background:#F1F5F9;color:#475569;font-size:.68rem;padding:2px 8px;border-radius:4px;font-weight:800;letter-spacing:.04em">💬 DEVIS</span>`;
      } else {
        typeBadge = `<span style="background:#F1F5F9;color:#475569;font-size:.68rem;padding:2px 8px;border-radius:4px;font-weight:700;letter-spacing:.04em">${escapeHtml((l.type_demande||'').toUpperCase())}</span>`;
      }

      // Adresse compacte
      const cityLine = [l.ville, l.code_postal].filter(Boolean).join(' · ') || '';
      // Métier en titre
      const metierStr = l.metier ? ' — ' + (METIER_LABELS[l.metier] || l.metier) : '';
      // Valeur si présente
      const valueStr = l.estimated_value ? ` · 💶 ${Number(l.estimated_value).toFixed(0)} €` : (l.budget ? ` · 💶 ${escapeHtml(l.budget)}` : '');

      // Message en preview (140 chars max)
      const msgPreview = l.message ? escapeHtml(l.message.slice(0,140)) + (l.message.length>140?'…':'') : '';

      return `
        <div class="lead-card" data-id="${l.id}">
          <span class="lead-status ${l.status}">${STATUS_LABELS[l.status] || l.status}</span>
          <div class="lead-body">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap">
              ${typeBadge}
              <h3 style="margin:0;display:inline">${escapeHtml(l.nom)}${metierStr}</h3>
            </div>
            <div class="meta">
              ${cityLine ? '📍 ' + escapeHtml(cityLine) : ''}
              ${l.email ? '· <a href="mailto:'+escapeHtml(l.email)+'" style="color:inherit;text-decoration:none" onclick="event.stopPropagation()">' + escapeHtml(l.email) + '</a>' : ''}
              ${l.telephone ? '· <a href="tel:'+escapeHtml(l.telephone)+'" style="color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:3px" onclick="event.stopPropagation()">' + phoneIcon + ' ' + escapeHtml(l.telephone) + '</a>' : ''}
              ${valueStr}
            </div>
            ${msgPreview ? '<div style="margin-top:6px;font-size:.78rem;color:var(--ink-500);font-style:italic;line-height:1.4;max-width:62ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">« ' + msgPreview + ' »</div>' : ''}
          </div>
          <div class="lead-meta-cell">
            ${l.priority === 'urgente' ? '<div style="color:#B91C1C;font-weight:700">🔥 Urgent</div>' : '<div>&nbsp;</div>'}
            <div class="when">${when}</div>
            ${l.assigned_to ? '<div style="font-size:.7rem;color:var(--ink-400);margin-top:2px">👤 ' + escapeHtml(l.assigned_to) + '</div>' : ''}
          </div>
          <div class="lead-actions" style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
            ${l.telephone ? `<a href="tel:${escapeHtml(l.telephone)}" onclick="event.stopPropagation()" title="Appeler ${escapeHtml(l.telephone)}" style="display:inline-flex;align-items:center;gap:5px;padding:6px 11px;background:linear-gradient(135deg,#22A06B,#16a34a);color:#fff;text-decoration:none;border-radius:8px;font-size:.74rem;font-weight:700;box-shadow:0 2px 6px rgba(34,160,107,.25)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Appeler</a>` : ''}
            <div style="display:flex;gap:4px">
              ${l.telephone ? `<a href="sms:${escapeHtml(l.telephone)}" onclick="event.stopPropagation()" title="SMS" style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:#F1F5F9;color:#475569;text-decoration:none;border-radius:7px;border:1px solid var(--ink-100)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></a>` : ''}
              ${l.email ? `<a href="mailto:${escapeHtml(l.email)}" onclick="event.stopPropagation()" title="Email" style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;background:#F1F5F9;color:#475569;text-decoration:none;border-radius:7px;border:1px solid var(--ink-100)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></a>` : ''}
              <button class="btn" data-open="${l.id}" style="padding:6px 12px;font-size:.76rem">Détails →</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
    list.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openLead(b.dataset.open); }));
    list.querySelectorAll('.lead-card').forEach(c => c.addEventListener('click', e => { if (!e.target.closest('[data-open]')) openLead(c.dataset.id); }));
  }

  async function openLead(id){
    const l = _all.find(x => x.id === id);
    if (!l) return;
    document.getElementById('leadTitle').textContent = 'Demande de ' + l.nom;

    const phoneVal = l.telephone ? `<a href="tel:${l.telephone}">${escapeHtml(l.telephone)}</a>` : '—';
    const emailVal = l.email ? `<a href="mailto:${l.email}">${escapeHtml(l.email)}</a>` : '—';

    // ─── Si c'est une souscription, on cherche le contract joint pour les détails ───
    let contract = null, photos = [];
    if (l.source === 'souscription' || (l.type_demande && l.type_demande.includes('contrat'))) {
      try {
        if (l.email) {
          const { data } = await c.from('contracts')
            .select('*')
            .eq('client_email', l.email)
            .order('created_at', { ascending: false })
            .limit(1);
          if (data && data[0]) contract = data[0];
        }
      } catch(e) { /* table contracts peut être inaccessible */ }
    }

    // ─── Si lead lié à une réalisation, charger les photos ───
    if (l.realisation_id) {
      try {
        const { data } = await c.from('realisations')
          .select('id,title,image_before,image_after,photos')
          .eq('id', l.realisation_id)
          .single();
        if (data) {
          if (data.image_before) photos.push({ url: data.image_before, label: 'Avant' });
          if (data.image_after)  photos.push({ url: data.image_after,  label: 'Après' });
          if (Array.isArray(data.photos)) data.photos.slice(0,6).forEach((p,i) => photos.push({ url: p.url || p, label: `Photo ${i+1}` }));
        }
      } catch(e) {}
    }

    // ─── Photos uploadées par le client lui-même (formulaire wizard) ───
    if (Array.isArray(l.photos) && l.photos.length > 0) {
      l.photos.forEach((p, i) => {
        const url = typeof p === 'string' ? p : p.url;
        const label = (typeof p === 'object' ? p.label : null) || `Client ${i+1}`;
        if (url) photos.push({ url, label, fromClient: true });
      });
    }
    // ─── Photos dans metadata (souscriptions) ──────────────────────
    const mPhotos = contract?.metadata?.photos || l.utm?.photos;
    if (Array.isArray(mPhotos)) {
      mPhotos.slice(0,8).forEach((p, i) => {
        const url = typeof p === 'string' ? p : p.url;
        if (url) photos.push({ url, label: `Équipement ${i+1}`, fromClient: true });
      });
    }

    const m = contract?.metadata || {};
    const utm = l.utm || {};
    const hasUtm = utm && Object.keys(utm).length > 0;

    const addressLine = [l.adresse, l.code_postal, l.ville].filter(Boolean).join(' · ') || '—';

    const contractBlock = contract ? `
      <div style="margin-top:18px;padding:14px;background:linear-gradient(135deg,rgba(13,160,207,.05),rgba(13,160,207,.02));border:1px solid rgba(13,160,207,.20);border-radius:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap">
          <h4 style="margin:0;font-size:.96rem;font-weight:800;color:#0A1428;display:flex;align-items:center;gap:8px">
            📄 Souscription contrat
            <span style="background:#0DA0CF;color:#fff;font-size:.66rem;padding:2px 8px;border-radius:999px;font-weight:800;letter-spacing:.04em">${escapeHtml((contract.type||'').toUpperCase())}</span>
            ${contract.imported_to_crm_at ? '<span style="background:#DCFCE7;color:#15803D;font-size:.66rem;padding:2px 8px;border-radius:999px;font-weight:800">✓ CRM</span>' : '<span style="background:#FFF7ED;color:#C2410C;font-size:.66rem;padding:2px 8px;border-radius:999px;font-weight:800">📥 À IMPORTER</span>'}
          </h4>
          <a href="contracts.html?import=${contract.id}" style="font-size:.78rem;color:var(--hc-primary);font-weight:700;text-decoration:none">Voir dans Contrats →</a>
        </div>
        <div class="lead-info-grid" style="margin-bottom:0">
          <div class="lead-info-cell"><div class="lbl">Énergie</div><div class="val">${escapeHtml(m.energie || contract.metier || '—').charAt(0).toUpperCase() + escapeHtml(m.energie || contract.metier || '—').slice(1)}</div></div>
          <div class="lead-info-cell"><div class="lbl">Montant mensuel</div><div class="val">${Number(contract.monthly_amount||0).toFixed(2)} €<span style="font-size:.74rem;color:var(--ink-500);font-weight:500"> /mois</span></div></div>
          ${m.type_logement ? `<div class="lead-info-cell"><div class="lbl">Logement</div><div class="val">${escapeHtml(m.type_logement)}${m.statut_logement ? ' · ' + escapeHtml(m.statut_logement) : ''}</div></div>` : ''}
          ${m.date_debut_souhaitee ? `<div class="lead-info-cell"><div class="lbl">Début souhaité</div><div class="val">${new Date(m.date_debut_souhaitee).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})}</div></div>` : ''}
          ${m.marque ? `<div class="lead-info-cell full"><div class="lbl">Équipement</div><div class="val">${escapeHtml(m.marque)}${m.modele ? ' ' + escapeHtml(m.modele) : ''}${m.annee ? ' (' + escapeHtml(String(m.annee)) + ')' : ''}${m.dernier_entretien ? ' · Dernier entretien : ' + escapeHtml(m.dernier_entretien) : ''}</div></div>` : ''}
          ${m.commentaire ? `<div class="lead-info-cell full"><div class="lbl">Commentaire client</div><div class="val" style="font-weight:400;line-height:1.5">${escapeHtml(m.commentaire)}</div></div>` : ''}
          ${m.cgv_accepted_at ? `<div class="lead-info-cell full"><div class="lbl">CGV acceptées</div><div class="val" style="font-weight:400;font-size:.78rem;color:#15803D">✓ Le ${new Date(m.cgv_accepted_at).toLocaleString('fr-FR')}</div></div>` : ''}
        </div>
      </div>
    ` : '';

    const photosBlock = photos.length > 0 ? `
      <div style="margin-top:18px">
        <h4 style="margin:0 0 10px 0;font-size:.96rem;font-weight:800;color:#0A1428;display:flex;align-items:center;gap:8px">
          📸 Photos liées
          <span style="font-size:.74rem;font-weight:600;color:var(--ink-500)">(${photos.length})</span>
        </h4>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px">
          ${photos.map(p => `
            <a href="${p.url}" target="_blank" rel="noopener" style="display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#f5f7fa;position:relative;border:1px solid var(--ink-100);text-decoration:none">
              <img src="${p.url}" alt="${escapeHtml(p.label)}" style="width:100%;height:100%;object-fit:cover;display:block">
              <div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;padding:14px 8px 6px;font-size:.72rem;font-weight:700">${escapeHtml(p.label)}</div>
            </a>
          `).join('')}
        </div>
      </div>
    ` : '';

    const utmBlock = hasUtm ? `
      <div style="margin-top:14px;padding:10px 12px;background:#FAFCFD;border:1px solid var(--ink-100);border-radius:10px;font-size:.78rem">
        <div style="font-weight:700;color:var(--ink-700);margin-bottom:4px">📊 Tracking UTM</div>
        <div style="color:var(--ink-500)">${Object.entries(utm).map(([k,v]) => `<strong>${escapeHtml(k)}</strong>: ${escapeHtml(String(v))}`).join(' · ')}</div>
      </div>
    ` : '';

    document.getElementById('leadBody').innerHTML = `
      <div class="lead-info-grid">
        <div class="lead-info-cell"><div class="lbl">Nom complet</div><div class="val">${escapeHtml(l.nom)}</div></div>
        <div class="lead-info-cell"><div class="lbl">Statut</div><div class="val"><span class="lead-status ${l.status}">${STATUS_LABELS[l.status]}</span>${l.priority && l.priority !== 'normale' ? ` <span style="background:#FFEDD5;color:#C2410C;font-size:.66rem;padding:1px 6px;border-radius:4px;font-weight:800;margin-left:4px">${escapeHtml(l.priority.toUpperCase())}</span>` : ''}</div></div>
        <div class="lead-info-cell"><div class="lbl">Téléphone</div><div class="val">${phoneVal}</div></div>
        <div class="lead-info-cell"><div class="lbl">Email</div><div class="val">${emailVal}</div></div>
        <div class="lead-info-cell full"><div class="lbl">Adresse complète</div><div class="val">${escapeHtml(addressLine)}</div></div>
        <div class="lead-info-cell"><div class="lbl">Métier / domaine</div><div class="val">${METIER_LABELS[l.metier] || l.metier || '—'}</div></div>
        <div class="lead-info-cell"><div class="lbl">Type de demande</div><div class="val">${escapeHtml(l.type_demande || '—')}</div></div>
        ${l.budget ? `<div class="lead-info-cell"><div class="lbl">Budget estimé</div><div class="val">${escapeHtml(l.budget)}</div></div>` : ''}
        ${l.estimated_value ? `<div class="lead-info-cell"><div class="lbl">Valeur estimée</div><div class="val">${Number(l.estimated_value).toFixed(0)} €</div></div>` : ''}
        ${l.message ? `<div class="lead-info-cell full"><div class="lbl">Message client</div><div class="val" style="font-weight:400;line-height:1.5;padding:8px 10px;background:#FAFCFD;border-radius:8px;border:1px solid var(--ink-100)">${escapeHtml(l.message)}</div></div>` : ''}
      </div>

      ${contractBlock}
      ${photosBlock}

      <div style="margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;font-size:.78rem;color:var(--ink-500)">
        <div><strong style="color:var(--ink-700)">Source :</strong> ${escapeHtml(l.source || '—')}</div>
        ${l.source_page ? `<div><strong style="color:var(--ink-700)">Page :</strong> <span style="word-break:break-all">${escapeHtml(l.source_page)}</span></div>` : ''}
        ${l.source_referer ? `<div><strong style="color:var(--ink-700)">Referer :</strong> <span style="word-break:break-all">${escapeHtml(l.source_referer)}</span></div>` : ''}
        <div><strong style="color:var(--ink-700)">Reçu :</strong> ${new Date(l.created_at).toLocaleString('fr-FR')}</div>
        ${l.last_contact_at ? `<div><strong style="color:var(--ink-700)">Dernier contact :</strong> ${new Date(l.last_contact_at).toLocaleString('fr-FR')}</div>` : ''}
        ${l.next_action_at ? `<div><strong style="color:var(--ink-700)">Prochaine action :</strong> ${new Date(l.next_action_at).toLocaleString('fr-FR')}${l.next_action_desc ? ' — ' + escapeHtml(l.next_action_desc) : ''}</div>` : ''}
        ${l.assigned_to ? `<div><strong style="color:var(--ink-700)">Assigné à :</strong> ${escapeHtml(l.assigned_to)}</div>` : ''}
      </div>

      ${utmBlock}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        ${l.telephone ? `<a class="btn btn-primary" href="tel:${l.telephone}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg> Appeler</a>` : ''}
        ${l.email ? `<a class="btn" href="mailto:${l.email}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> Email</a>` : ''}
      </div>
      <div style="display:grid;gap:10px">
        <label style="font-size:.78rem;font-weight:700;color:var(--ink-700)">Changer le statut</label>
        <select id="newStatus" style="padding:9px 11px;border:1px solid var(--ink-100);border-radius:10px;font:inherit;font-size:.88rem">
          ${Object.entries(STATUS_LABELS).map(([k,v]) => `<option value="${k}" ${k===l.status?'selected':''}>${v}</option>`).join('')}
        </select>
        <label style="font-size:.78rem;font-weight:700;color:var(--ink-700);margin-top:8px">Notes internes</label>
        <textarea id="newNotes" rows="3" style="padding:9px 11px;border:1px solid var(--ink-100);border-radius:10px;font:inherit;font-size:.88rem;resize:vertical">${escapeHtml(l.notes_internes || '')}</textarea>
      </div>
    `;
    document.getElementById('leadFoot').innerHTML = `
      <button class="btn" style="margin-right:auto" id="btnDeleteLead" data-id="${l.id}">Supprimer</button>
      <button class="btn" id="btnCancelLead">Annuler</button>
      <button class="btn btn-primary" id="btnSaveLead" data-id="${l.id}">Enregistrer</button>
    `;
    document.getElementById('btnCancelLead').onclick = closeLead;
    document.getElementById('btnSaveLead').onclick = async () => {
      const newStatus = document.getElementById('newStatus').value;
      const newNotes = document.getElementById('newNotes').value.trim() || null;
      const update = { status: newStatus, notes_internes: newNotes };
      if (newStatus === 'gagne' || newStatus === 'perdu' || newStatus === 'archive') update.closed_at = new Date().toISOString();
      const { error } = await c.from('leads').update(update).eq('id', l.id);
      if (error) { toast('Erreur : '+error.message,'err',3500); return; }
      toast('Demande mise à jour');
      closeLead();
      await load();
    };
    document.getElementById('btnDeleteLead').onclick = async () => {
      if (!confirm('Supprimer définitivement cette demande ?')) return;
      const { error } = await c.from('leads').delete().eq('id', l.id);
      if (error) { toast('Erreur : '+error.message,'err',3500); return; }
      toast('Demande supprimée');
      closeLead();
      await load();
    };
    document.getElementById('leadModal').classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }

  function closeLead(){
    document.getElementById('leadModal').classList.remove('is-open');
    document.body.style.overflow = '';
  }

  document.getElementById('leadClose').onclick = closeLead;
  document.getElementById('leadModal').onclick = e => { if (e.target.id === 'leadModal') closeLead(); };
  document.getElementById('search').addEventListener('input', renderList);
  document.getElementById('filterStatus').addEventListener('change', renderList);
  document.getElementById('filterMetier').addEventListener('change', renderList);

  // Export CSV — exporte la sélection filtrée (recherche + statut + métier).
  // Si aucun filtre actif, exporte tout. Encoding UTF-8 BOM compatible Excel FR.
  document.getElementById('btnExport').onclick = () => {
    const filtered = getFilteredLeads();
    const rows = filtered.length ? filtered : _all;
    if (!rows.length){
      toast('Aucun lead à exporter', 'err', 3000);
      return;
    }
    const headers = ['Date','Nom','Email','Téléphone','Ville','CP','Métier','Type','Statut','Source','Priorité','Valeur estimée (€)','Message'];
    const csvRows = rows.map(l => [
      l.created_at ? new Date(l.created_at).toLocaleString('fr-FR', { dateStyle:'short', timeStyle:'short' }) : '',
      l.nom || '', l.email || '', l.telephone || '',
      l.ville || '', l.code_postal || '',
      METIER_LABELS[l.metier] || l.metier || '',
      l.type_demande || '',
      STATUS_LABELS[l.status] || l.status || '',
      l.source || '',
      l.priority || '',
      l.estimated_value || '',
      (l.message || '').replace(/[\r\n\t]+/g,' / ')
    ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(';'));
    // Séparateur ';' (Excel FR) + BOM UTF-8
    const csv = [headers.join(';'), ...csvRows].join('\r\n');
    const blob = new Blob([new Uint8Array([0xEF,0xBB,0xBF]), csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    const isFiltered = filtered.length !== _all.length;
    link.download = 'leads-help-confort-' + (isFiltered ? 'filtre-' : '') + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(`${rows.length} lead${rows.length>1?'s':''} exporté${rows.length>1?'s':''}${isFiltered?' (filtre)':''}`, 'ok', 2500);
  };

  function timeAgo(d){
    const ms = Date.now() - new Date(d).getTime();
    const min = Math.floor(ms / 60000);
    if (min < 1) return 'à l\'instant';
    if (min < 60) return 'il y a ' + min + ' min';
    const h = Math.floor(min / 60);
    if (h < 24) return 'il y a ' + h + ' h';
    const day = Math.floor(h / 24);
    if (day < 30) return 'il y a ' + day + ' j';
    return 'il y a ' + Math.floor(day / 30) + ' mois';
  }
  function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  await load();
})();
</script>
</body>
</html>
