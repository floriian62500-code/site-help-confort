<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
.tp-hero{background:linear-gradient(135deg,#0DA0CF 0%,#5fc7e5 60%,#FFB400 130%);color:#fff;border-radius:18px;padding:28px 30px;margin-bottom:22px;box-shadow:0 14px 40px rgba(13,160,207,.25)}
.tp-hero h1{font-size:1.62rem;font-weight:800;margin:0 0 6px 0;line-height:1.2}
.tp-hero p{font-size:.96rem;opacity:.96;margin:0;line-height:1.5;max-width:680px}

.tp-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.tp-toolbar h2{font-size:1.04rem;font-weight:800;color:var(--ink-900);margin:0;flex:1}
.tp-search{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border:1px solid var(--ink-100);border-radius:10px}
.tp-search svg{width:16px;height:16px;color:var(--ink-400)}
.tp-search input{flex:1;border:none;background:transparent;outline:none;font:inherit;font-size:.88rem}

/* === GRID === */
.tp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}

/* === CARD : mockup post réaliste === */
.tp-card{background:#fff;border:1px solid var(--ink-100);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.22s;box-shadow:0 1px 2px rgba(11,18,32,.04);position:relative}
.tp-card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(11,18,32,.10);border-color:var(--metier-color,var(--hc-primary))}

/* Bande métier en haut */
.tp-metier-band{height:5px;background:var(--metier-color,#94a3b8)}

/* Header card */
.tp-card-head{padding:13px 14px 8px 14px;display:flex;align-items:flex-start;gap:11px}
.tp-card-head .emoji-box{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.45rem;background:var(--metier-color-soft,rgba(100,116,139,.10))}
.tp-card-head .title-block{flex:1;min-width:0}
.tp-card-head h3{font-size:.95rem;font-weight:800;color:var(--ink-900);margin:0;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tp-card-head .desc{font-size:.74rem;color:var(--ink-500);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tp-card-head .cat-pill{font-size:.62rem;font-weight:800;color:#fff;background:var(--metier-color,#64748b);padding:3px 7px;border-radius:5px;flex-shrink:0;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}

/* Post preview (mockup IG/FB) */
.tp-post{margin:4px 14px 12px 14px;padding:12px 13px 0 13px;background:#F7F9FC;border:1px solid #E5EBF1;border-radius:10px;position:relative;overflow:hidden;flex:1;min-height:140px;max-height:185px;display:flex;flex-direction:column;gap:8px}
.tp-post .pp-mock-head{display:flex;align-items:center;gap:8px;padding-bottom:7px;border-bottom:1px solid #E5EBF1}
.tp-post .pp-avatar{width:26px;height:26px;border-radius:50%;background:var(--metier-color,#0DA0CF);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:900;flex-shrink:0;letter-spacing:.02em}
.tp-post .pp-meta{font-size:.72rem;font-weight:700;color:var(--ink-800);line-height:1.2}
.tp-post .pp-meta .sub{display:block;font-weight:500;color:var(--ink-400);font-size:.62rem;margin-top:1px}
.tp-post .pp-text{font-size:.76rem;color:var(--ink-800);line-height:1.55;white-space:pre-line;margin:0;flex:1;overflow:hidden}
.tp-post .pp-fade{position:absolute;left:0;right:0;bottom:0;height:42px;pointer-events:none;background:linear-gradient(to bottom,rgba(247,249,252,0),rgba(247,249,252,1) 92%)}

/* Tags row */
.tp-tags-row{padding:0 14px 11px 14px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tp-tags-row .metier-chip{font-size:.64rem;font-weight:800;color:var(--metier-color,#64748b);background:var(--metier-color-soft,rgba(100,116,139,.10));padding:3px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em}
.tp-tags-row .tag{font-size:.68rem;color:var(--ink-600);background:var(--ink-50);padding:2px 7px;border-radius:5px;font-weight:600}
.tp-tags-row .tag-more{font-size:.68rem;color:var(--ink-400);font-weight:700;margin-left:2px}

/* Footer */
.tp-card-foot{padding:10px 14px 12px 14px;display:flex;gap:6px;border-top:1px solid var(--ink-50);background:#FAFCFD}
.tp-card-foot .btn{flex:1;padding:9px 12px;border-radius:9px;font-size:.82rem;font-weight:700;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
.tp-card-foot .btn-use{background:var(--hc-primary);color:#fff;flex:2}
.tp-card-foot .btn-use:hover{background:#0a8db6}
.tp-card-foot .btn-edit{background:#fff;color:var(--ink-700);border:1px solid var(--ink-100)}
.tp-card-foot .btn-edit:hover{border-color:var(--hc-primary);color:var(--hc-primary)}
.tp-card-foot .btn-del{background:#fff;color:#d92d20;border:1px solid var(--ink-100);width:36px;padding:9px;flex:0 0 36px}
.tp-card-foot .btn-del:hover{background:#d92d20;color:#fff;border-color:#d92d20}
.tp-card-foot .btn svg{width:13px;height:13px}

/* Modale */
.tp-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,20,40,.55);backdrop-filter:blur(4px)}
.tp-modal.open{display:flex}
.tp-modal-sheet{background:#fff;border-radius:16px;width:100%;max-width:600px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(0,0,0,.32);overflow:hidden}
.tp-modal-head{padding:18px 22px 14px 22px;border-bottom:1px solid var(--ink-100);display:flex;align-items:center;gap:12px}
.tp-modal-head h2{font-size:1.05rem;font-weight:800;color:var(--ink-900);margin:0;flex:1}
.tp-modal-head .close{width:30px;height:30px;border-radius:50%;background:var(--ink-50);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-500)}
.tp-modal-body{padding:18px 22px;overflow-y:auto;flex:1;display:grid;gap:14px}
.tp-modal-body label{font-size:.78rem;font-weight:700;color:var(--ink-700);display:block;margin-bottom:5px;letter-spacing:.02em}
.tp-modal-body input, .tp-modal-body select, .tp-modal-body textarea{width:100%;padding:10px 12px;border:1px solid var(--ink-100);border-radius:10px;font:inherit;font-size:.88rem;color:var(--ink-900);background:#fff}
.tp-modal-body textarea{min-height:90px;resize:vertical}
.tp-modal-foot{padding:14px 22px;border-top:1px solid var(--ink-100);background:#FAFCFD;display:flex;gap:10px}
.tp-modal-foot .right{margin-left:auto;display:flex;gap:8px}

/* Color presets */
.tp-color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.tp-color-grid button{width:100%;aspect-ratio:1;border-radius:9px;border:2px solid transparent;cursor:pointer}
.tp-color-grid button.selected{border-color:var(--ink-900);box-shadow:0 0 0 2px #fff}

/* Filtres par catégorie */
.tp-filter{padding:7px 14px;border-radius:999px;border:1px solid var(--ink-100);background:#fff;color:var(--ink-700);font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tp-filter:hover{border-color:var(--hc-primary);color:var(--hc-primary)}
.tp-filter.active{background:var(--hc-primary);color:#fff;border-color:var(--hc-primary);box-shadow:0 4px 12px rgba(13,160,207,.25)}
.tp-filter .cnt{font-size:.68rem;font-weight:800;background:var(--ink-50);color:var(--ink-500);padding:1px 7px;border-radius:9px;min-width:18px;text-align:center}
.tp-filter.active .cnt{background:rgba(255,255,255,.22);color:#fff}
.tp-filter .cnt:empty{display:none}

/* (Le bloc hover-preview a été remplacé par .tp-post visible en permanence) */

.toast-stack{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:2000;pointer-events:none}
.toast{background:#fff;border:1px solid var(--ink-100);border-radius:10px;padding:11px 14px;box-shadow:0 8px 24px rgba(11,18,32,.16);font-size:.86rem;font-weight:600;color:var(--ink-900);pointer-events:auto;min-width:240px}
.toast.ok{border-left:3px solid #00aa50}
.toast.err{border-left:3px solid #d92d20}
</style>
</head>

            <option value="info">Information</option>
            <option value="autre">Autre</option>
          </select>
        </div>
        <div>
          <label>Icône emoji</label>
          <input id="ed_icon" type="text" maxlength="3" placeholder="🎁">
        </div>
      </div>
      <div>
        <label>Description courte (pour le catalogue)</label>
        <input id="ed_desc" type="text" maxlength="120" placeholder="Ex : Promo de printemps sur les fenêtres double vitrage">
      </div>
      <div>
        <label>Titre du chantier (pré-rempli) *</label>
        <input id="ed_title" type="text" placeholder="Ex : Profitez du printemps pour rénover vos fenêtres">
      </div>
      <div>
        <label>Texte de la publication (pré-rempli)</label>
        <textarea id="ed_content" rows="5" placeholder="Ex : 🌸 Le printemps est arrivé ! C'est le moment idéal pour rénover vos fenêtres avec du double vitrage performant. Help Confort vous accompagne…"></textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <label>Métier par défaut</label>
          <select id="ed_metier">

            <option value="pmr">Adaptation PMR</option>
            <option value="volets">Volets</option>

          </select>
        </div>
        <div>
          <label>Hashtags</label>
          <input id="ed_hashtags" type="text" placeholder="#promo #printemps #helpconfort">
        </div>
      </div>
    </div>
    <div class="tp-modal-foot">
      <button class="btn" id="editCancel">Annuler</button>
      <div class="right">
        <button class="btn btn-primary" id="editSave">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<script>
function toast(msg, type='ok', d=2400){
  const stack = document.getElementById('toastStack');
  const t = document.createElement('div'); t.className='toast '+type;
  t.textContent = msg;
  stack.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),200); }, d);
}

// Pré-init avec les 13 defaults : ils s'affichent INSTANTANÉMENT
// sans attendre Supabase/auth/layout (sinon, si l'un de ces awaits hang
// ou si app_settings.templates contient une structure cassée, on perdait
// l'affichage complet du catalogue).
let _templates = [...DEFAULT_TEMPLATES];
let activeCat = '';

(async function(){
  await HCSupabase.init();
  const session = await HCAdmin.requireAuth();
  if (!session) return;
  await HCLayout.mount('templates', 'Templates de posts');
  const c = await HCSupabase.init();

  // Render immédiat : on garantit l'affichage des 13 modèles
  // de base AVANT toute requête réseau.
  render();

  // Puis on hydrate avec les templates user en arrière-plan.
  try {
    const { data } = await c.from('app_settings').select('value').eq('key', 'templates').single();
    const raw = data?.value?.list;
    const userTemplates = Array.isArray(raw) ? raw : [];
    if (userTemplates.length) {
      _templates = [...DEFAULT_TEMPLATES, ...userTemplates];
      render(document.getElementById('searchInput').value);
    }
  } catch(e) {
    // On garde les defaults — déjà affichés.
  }

  function render(filter = '') {
    const grid = document.getElementById('tpGrid');
    const q = filter.toLowerCase();
    const filtered = _templates.filter(t => {
      const okQ = !q || (t.name + ' ' + t.desc + ' ' + t.content + ' ' + (t.hashtags || '')).toLowerCase().includes(q);
      const okCat = !activeCat || t.category === activeCat;
      return okQ && okCat;
    });
    document.getElementById('tpCount').textContent = filtered.length + ' modèle' + (filtered.length>1?'s':'') + ' disponible' + (filtered.length>1?'s':'');

    // Palette métier HC (synchro charte couleurs officielle)
    const METIER = {
      plomberie:    { color: '#0DA0CF', soft: 'rgba(13,160,207,.10)',  label: 'Plomberie' },
      chauffage:    { color: '#FF6B1A', soft: 'rgba(255,107,26,.10)',  label: 'Chauffage' },
      electricite:  { color: '#FFB400', soft: 'rgba(255,180,0,.14)',   label: 'Électricité' },
      serrurerie:   { color: '#7C3AED', soft: 'rgba(124,58,237,.10)',  label: 'Serrurerie' },
      vitrerie:     { color: '#22C55E', soft: 'rgba(34,197,94,.10)',   label: 'Vitrerie' },
      renovation:   { color: '#E11D48', soft: 'rgba(225,29,72,.08)',   label: 'Rénovation' },
      menuiserie:   { color: '#92501A', soft: 'rgba(146,80,26,.10)',   label: 'Menuiserie' },
      volets:       { color: '#6366F1', soft: 'rgba(99,102,241,.10)',  label: 'Volets' },
      pmr:          { color: '#14B8A6', soft: 'rgba(20,184,166,.10)',  label: 'PMR' },
      multiservice: { color: '#64748b', soft: 'rgba(100,116,139,.12)', label: 'Multi-services' }
    };
    const CAT_LABELS = {
      promo: 'Promo', recrutement: 'Recrutement', alerte: 'Alerte',
      ferie: 'Férié', metier: 'Métier', info: 'Info', autre: 'Autre',
      temoignage: 'Témoignage'
    };

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="hc-empty" style="grid-column:1/-1">
        <div class="hc-empty-icon">🔍</div>
        <h3>Aucun template ne matche</h3>
        <p>Essaie de modifier ta recherche ou ton filtre catégorie.</p>
      </div>`;
    } else {
      grid.innerHTML = filtered.map(t => {
        const isDefault = t.id && t.id.startsWith('default-');
        const m = METIER[t.metier] || METIER.multiservice;
        const cssVars = `--metier-color:${m.color};--metier-color-soft:${m.soft};`;
        const previewText = (t.content || t.title || '').slice(0, 360);
        const tags = (t.hashtags || '').split(' ').filter(Boolean);
        const visibleTags = tags.slice(0, 3);
        const moreTags = tags.length - visibleTags.length;
        return `
          <div class="tp-card" data-id="${t.id}" style="${cssVars}">
            <div class="tp-metier-band"></div>
            <div class="tp-card-head">
              <div class="emoji-box">${t.icon || '📋'}</div>
              <div class="title-block">
                <h3>${escapeHtml(t.name)}</h3>
                ${t.desc ? `<div class="desc">${escapeHtml(t.desc)}</div>` : ''}
              </div>
              <span class="cat-pill">${CAT_LABELS[t.category] || t.category}</span>
            </div>
            <div class="tp-post">
              <div class="pp-mock-head">
                <div class="pp-avatar">HC</div>
                <div class="pp-meta">Help Confort<span class="sub">Saint-Omer · Dunkerque</span></div>
              </div>
              <div class="pp-text">${escapeHtml(previewText)}</div>
              <div class="pp-fade"></div>
            </div>
            <div class="tp-tags-row">
              <span class="metier-chip">${m.label}</span>
              ${visibleTags.map(h => '<span class="tag">' + escapeHtml(h) + '</span>').join('')}
              ${moreTags > 0 ? `<span class="tag-more">+${moreTags}</span>` : ''}
            </div>
            <div class="tp-card-foot">
              <button class="btn btn-use" data-use="${t.id}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                Utiliser
              </button>
              ${!isDefault ? `<button class="btn btn-edit" data-edit="${t.id}" title="Éditer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>` : ''}
              ${!isDefault ? `<button class="btn btn-del" data-del="${t.id}" title="Supprimer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg></button>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    grid.querySelectorAll('[data-use]').forEach(b => b.onclick = () => useTemplate(b.dataset.use));
    grid.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(b.dataset.edit));
    grid.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteTemplate(b.dataset.del));
  }

  function useTemplate(id) {
    const t = _templates.find(x => x.id === id);
    if (!t) return;
    // Stocker temporairement dans localStorage et ouvrir la modale création express via le FAB
    sessionStorage.setItem('hcq-template', JSON.stringify({
      title: t.title,
      desc: t.content,
      metier: t.metier,
      hashtags: t.hashtags
    }));
    toast('Template chargé — ouverture de la création express…', 'ok', 1800);
    setTimeout(() => {
      if (window.HCLayout && window.HCLayout.openQuickModal) {
        window.HCLayout.openQuickModal();
        // Pré-remplir les champs
        setTimeout(() => {
          const data = JSON.parse(sessionStorage.getItem('hcq-template') || '{}');
          if (data.title && document.getElementById('hcqTitle')) document.getElementById('hcqTitle').value = data.title;
          if (data.desc && document.getElementById('hcqDesc')) document.getElementById('hcqDesc').value = data.desc;
          if (data.metier && document.getElementById('hcqMetier')) document.getElementById('hcqMetier').value = data.metier;
          sessionStorage.removeItem('hcq-template');
        }, 80);
      }
    }, 100);
  }

  function openEdit(id) {
    const t = id ? _templates.find(x => x.id === id) : null;
    document.getElementById('editTitle').textContent = t ? 'Éditer le template' : 'Nouveau template';
    document.getElementById('editModal').dataset.id = id || '';
    document.getElementById('ed_name').value = t?.name || '';
    document.getElementById('ed_category').value = t?.category || 'promo';
    document.getElementById('ed_icon').value = t?.icon || '🎁';
    document.getElementById('ed_desc').value = t?.desc || '';
    document.getElementById('ed_title').value = t?.title || '';
    document.getElementById('ed_content').value = t?.content || '';
    document.getElementById('ed_metier').value = t?.metier || '';
    document.getElementById('ed_hashtags').value = t?.hashtags || '';
    document.getElementById('editModal').classList.add('open');
  }

  document.getElementById('btnNew').onclick = () => openEdit();
  document.getElementById('editClose').onclick = () => document.getElementById('editModal').classList.remove('open');
  document.getElementById('editCancel').onclick = () => document.getElementById('editModal').classList.remove('open');

  document.getElementById('editSave').onclick = async () => {
    const name = document.getElementById('ed_name').value.trim();
    const title = document.getElementById('ed_title').value.trim();
    if (!name || !title) { toast('Nom et titre obligatoires', 'err'); return; }
    const id = document.getElementById('editModal').dataset.id || 'user-' + Date.now();
    const t = {
      id,
      name,
      category: document.getElementById('ed_category').value,
      icon: document.getElementById('ed_icon').value.trim() || '📋',
      desc: document.getElementById('ed_desc').value.trim(),
      title,
      content: document.getElementById('ed_content').value.trim(),
      metier: document.getElementById('ed_metier').value,
      hashtags: document.getElementById('ed_hashtags').value.trim()
    };

    // Mettre à jour la liste user (sans les defaults)
    const userList = _templates.filter(x => !x.id.startsWith('default-') && x.id !== id);
    userList.push(t);

    try {
      const { error } = await c.from('app_settings').upsert({
        key: 'templates',
        value: { list: userList },
        updated_by: session.email
      }, { onConflict: 'key' });
      if (error) throw error;
      _templates = [...DEFAULT_TEMPLATES, ...userList];
      toast('Template enregistré');
      document.getElementById('editModal').classList.remove('open');
      render(document.getElementById('searchInput').value);
    } catch (e) {
      toast('Erreur : ' + e.message, 'err', 4500);
    }
  };

  async function deleteTemplate(id) {
    if (!confirm('Supprimer ce template ?')) return;
    const userList = _templates.filter(x => !x.id.startsWith('default-') && x.id !== id);
    try {
      const { error } = await c.from('app_settings').upsert({
        key: 'templates',
        value: { list: userList },
        updated_by: session.email
      }, { onConflict: 'key' });
      if (error) throw error;
      _templates = [...DEFAULT_TEMPLATES, ...userList];
      toast('Template supprimé');
      render(document.getElementById('searchInput').value);
    } catch (e) {
      toast('Erreur : ' + e.message, 'err', 4500);
    }
  }

  document.getElementById('searchInput').oninput = (e) => render(e.target.value);

  // Filtres par catégorie
  document.querySelectorAll('.tp-filter').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tp-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCat = btn.dataset.cat;
      render(document.getElementById('searchInput').value);
    };
  });

  function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
})();
</script>
</body>
</html>
