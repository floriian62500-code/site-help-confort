<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Assistant IA · Back-Office HELP! Confort</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
.ai-card{background:#fff;border:1px solid var(--ink-100);border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(11,18,32,.04)}
.ai-card h3{font-size:1rem;font-weight:800;color:var(--ink-900);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.ai-card h3 svg{width:18px;height:18px;color:#7C3AED}
.ai-card p{font-size:.88rem;color:var(--ink-500);line-height:1.5;margin:0 0 14px}
.ai-status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.ai-status.ok{background:rgba(0,170,80,.12);color:#007033}
.ai-status.off{background:var(--ink-50);color:var(--ink-500)}
.ai-status::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.ai-empty{text-align:center;padding:50px 20px;color:var(--ink-400)}
.ai-empty svg{width:48px;height:48px;color:var(--ink-300);margin-bottom:12px}
.ai-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.ai-feature{padding:14px;background:linear-gradient(135deg,rgba(124,58,237,.04),#fff);border:1px solid rgba(124,58,237,.15);border-radius:12px}
.ai-feature strong{display:block;color:var(--ink-900);font-size:.92rem;margin-bottom:4px}
.ai-feature span{font-size:.82rem;color:var(--ink-500);line-height:1.5}
.usage-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ink-100);font-size:.86rem}
.usage-row:last-child{border-bottom:none}
.usage-row span:first-child{color:var(--ink-500)}
.usage-row span:last-child{color:var(--ink-900);font-weight:700}
</style>
<link rel="manifest" href="/admin-pro/manifest.webmanifest"><meta name="theme-color" content="#0DA0CF"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="HC Admin"><link rel="apple-touch-icon" href="/logo-help-confort.png">
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("/admin-pro/sw.js").catch(()=>{});});}</script>
</head>
<body>
<div class="admin-overlay"></div>
<div class="admin-shell">
  <aside class="admin-sidebar"></aside>
  <main class="admin-main">
    <header class="admin-topbar"></header>
    <div class="admin-content">
      <div class="breadcrumb">
        <a href="index.html">Dashboard</a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
        <strong>Assistant IA</strong>
      </div>
      <div class="admin-page-head">
        <div><h1>Assistant IA</h1><p>Génération automatique de contenu avec Claude (Anthropic).</p></div>
      </div>

      <div id="aiContent"></div>
    </div>
  </main>
</div>

<script src="assets/supabase.js"></script>
<script src="assets/admin.js"></script>
<script src="assets/layout.js"></script>
<script>
(async function(){
  await HCSupabase.init();
  const session = await HCAdmin.requireAuth();
  if (!session) return;
  await HCLayout.mount('ai', 'Assistant IA');

  const c = await HCSupabase.init();
  const { data: settings } = await c.from('app_settings').select('value').eq('key','anthropic').single();
  const configured = !!(settings?.value?.api_key);

  // Stats utilisation IA
  const { data: aiUsed } = await c.from('realisations').select('id,ai_generated').not('ai_generated', 'is', null);
  const generated = (aiUsed || []).filter(r => r.ai_generated?.generated_at).length;

  const content = document.getElementById('aiContent');
  if (!configured) {
    content.innerHTML = `
      <div class="ai-card">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          Claude IA <span class="ai-status off">Non configuré</span>
        </h3>
        <p>Configurez votre clé API Anthropic pour activer la génération automatique de titres, descriptions et hashtags pour vos chantiers.</p>
        <div class="ai-features">
          <div class="ai-feature"><strong>📝 Titres optimisés</strong><span>Phrases accrocheuses optimisées pour le SEO local (métier + ville).</span></div>
          <div class="ai-feature"><strong>📄 Descriptions</strong><span>Courtes pour les feeds, longues pour les pages détail.</span></div>
          <div class="ai-feature"><strong>#️⃣ Hashtags</strong><span>Mix générique + local, prêts pour Facebook/Instagram.</span></div>
          <div class="ai-feature"><strong>🔍 SEO meta</strong><span>Title + description meta pour les moteurs de recherche.</span></div>
        </div>
        <div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap">
          <a href="../guides/anthropic.md" target="_blank" class="btn">📖 Guide (5 min)</a>
          <a href="settings.html#section-anthropic" class="btn btn-primary">Configurer maintenant →</a>
        </div>
      </div>
    `;
  } else {
    content.innerHTML = `
      <div class="ai-card">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          Claude IA <span class="ai-status ok">Connecté</span>
        </h3>
        <p>Vous pouvez générer du contenu directement depuis chaque chantier dans <a href="realisations.html" style="color:var(--hc-primary);font-weight:600">Réalisations</a>.</p>

        <div style="background:var(--ink-50);border-radius:10px;padding:14px;margin-top:14px">
          <div class="usage-row"><span>Modèle actif</span><span>${settings.value.model || 'claude-haiku-4-5'}</span></div>
          <div class="usage-row"><span>Chantiers générés</span><span>${generated}</span></div>
          <div class="usage-row"><span>Coût estimé total</span><span>~${(generated * 0.003).toFixed(2)} €</span></div>
        </div>

        <div class="ai-features">
          <div class="ai-feature"><strong>📝 Titres optimisés</strong><span>Phrases accrocheuses optimisées pour le SEO local.</span></div>
          <div class="ai-feature"><strong>📄 Descriptions</strong><span>Courtes pour les feeds, longues pour les pages.</span></div>
          <div class="ai-feature"><strong>#️⃣ Hashtags</strong><span>Mix générique + local pour les RS.</span></div>
          <div class="ai-feature"><strong>🔍 SEO meta</strong><span>Title + meta description pour Google.</span></div>
        </div>

        <div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap">
          <a href="realisations.html?action=new" class="btn btn-primary">+ Nouveau chantier avec IA</a>
          <a href="settings.html#section-anthropic" class="btn">Modifier la config</a>
        </div>
      </div>

      <div class="ai-card">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          Pages IA disponibles
        </h3>
        <p>L'IA Claude est utilisable sur plusieurs pages du back-office :</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
          <a href="magic.html" class="card" style="padding:14px;text-decoration:none;border:1px solid rgba(124,58,237,.20);background:linear-gradient(135deg,rgba(124,58,237,.04),#fff);border-radius:10px">
            <strong style="display:block;color:var(--ink-900);margin-bottom:4px">🎨 Studio IA</strong>
            <span style="font-size:.82rem;color:var(--ink-500)">Photos → publication auto sur site + Facebook</span>
          </a>
          <a href="visuel.html" class="card" style="padding:14px;text-decoration:none;border:1px solid rgba(255,180,0,.20);background:linear-gradient(135deg,rgba(255,180,0,.04),#fff);border-radius:10px">
            <strong style="display:block;color:var(--ink-900);margin-bottom:4px">🖼️ Générateur visuel</strong>
            <span style="font-size:.82rem;color:var(--ink-500)">Composition avant/après prête à publier</span>
          </a>
          <a href="templates.html" class="card" style="padding:14px;text-decoration:none;border:1px solid rgba(13,160,207,.20);background:linear-gradient(135deg,rgba(13,160,207,.04),#fff);border-radius:10px">
            <strong style="display:block;color:var(--ink-900);margin-bottom:4px">📋 Modèles de posts</strong>
            <span style="font-size:.82rem;color:var(--ink-500)">Templates promo, recrutement, alertes…</span>
          </a>
          <a href="realisations.html?action=new" class="card" style="padding:14px;text-decoration:none;border:1px solid rgba(0,170,80,.20);background:linear-gradient(135deg,rgba(0,170,80,.04),#fff);border-radius:10px">
            <strong style="display:block;color:var(--ink-900);margin-bottom:4px">➕ Nouveau chantier</strong>
            <span style="font-size:.82rem;color:var(--ink-500)">Création avec génération IA intégrée</span>
          </a>
        </div>
      </div>
    `;
  }
})();
</script>
</body>
</html>
