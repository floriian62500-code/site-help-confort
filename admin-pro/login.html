<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Connexion · Back-Office HELP Confort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body class="login-page">

<div class="login-card">
  <div class="login-brand">
    <div class="login-brand-logo">H!</div>
    <div class="login-brand-text">
      <strong>HELP Confort</strong>
      <span>Back-Office Pro</span>
    </div>
  </div>

  <span class="login-mfa-pill">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    Accès sécurisé · 2FA disponible
  </span>

  <h1>Connexion</h1>
  <p class="lead">Entrez vos identifiants pour accéder au centre de pilotage HELP Confort.</p>

  <form class="login-form" id="loginForm">
    <div class="field">
      <label class="field-label">Email</label>
      <input type="email" class="input" name="email" required autocomplete="email" placeholder="vous@helpconfort.com" autofocus>
    </div>
    <div class="field">
      <label class="field-label">Mot de passe</label>
      <input type="password" class="input" name="password" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; font-size: .82rem; margin-top: -4px;">
      <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink-500);">
        <input type="checkbox" name="remember"> Se souvenir de moi
      </label>
      <a href="#" style="color: var(--hc-primary); font-weight: 600;">Mot de passe oublié ?</a>
    </div>
    <button type="submit" class="btn btn-primary" style="margin-top: 6px;">
      Se connecter
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
    <div id="loginError" class="alert danger" style="display: none; margin-top: 4px;">
      <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>Email ou mot de passe incorrect.</span>
    </div>
  </form>

  <div class="login-footer">
    Centre de pilotage <strong style="color: var(--ink-900);">HELP Confort Saint-Omer / Dunkerque</strong><br>
    <small>Auth sécurisée via <strong style="color: var(--hc-primary);">Supabase</strong></small>
  </div>
</div>

<script src="assets/supabase.js"></script>
<script src="assets/admin.js"></script>
<script>
// Init Supabase au chargement
(async function() {
  await HCSupabase.init();

  // Si déjà connecté → redirige direct
  const session = await HCAdmin.isAuthenticated();
  if (session) {
    window.location.href = 'index.html';
  }
})();

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const form = e.target;
  const email = form.email.value.trim();
  const password = form.password.value;
  const errorEl = document.getElementById('loginError');
  const submitBtn = form.querySelector('button[type="submit"]');

  submitBtn.disabled = true;
  submitBtn.innerHTML = 'Connexion en cours…';

  const result = await HCAdmin.login(email, password);

  if (result.ok) {
    submitBtn.innerHTML = '✓ Connecté · redirection…';
    setTimeout(() => window.location.href = 'index.html', 400);
  } else {
    submitBtn.disabled = false;
    submitBtn.innerHTML = 'Se connecter <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
    errorEl.querySelector('span').textContent = result.error || 'Email ou mot de passe incorrect.';
    errorEl.style.display = 'flex';
    setTimeout(() => errorEl.style.display = 'none', 5000);
  }
});
</script>

</body>
</html>
