<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SEO &amp; Analytics · Back-Office HELP! Confort</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
.an-card{background:#fff;border:1px solid var(--ink-100);border-radius:14px;padding:22px;margin-bottom:14px}
.an-card h3{font-size:1rem;font-weight:800;color:var(--ink-900);margin:0 0 14px;display:flex;align-items:center;gap:8px}
.an-card h3 svg{width:18px;height:18px;color:var(--hc-primary)}
.an-empty{text-align:center;padding:50px 20px;color:var(--ink-500);background:#fff;border:1px dashed var(--ink-200);border-radius:14px}
.an-empty svg{width:48px;height:48px;color:var(--ink-300);margin-bottom:12px}
.distrib-list{display:flex;flex-direction:column;gap:6px}
.distrib-row{display:flex;align-items:center;gap:12px}
.distrib-row .label{flex:0 0 130px;font-size:.86rem;color:var(--ink-700);font-weight:600}
.distrib-row .bar-wrap{flex:1;height:8px;background:var(--ink-50);border-radius:999px;overflow:hidden}
.distrib-row .bar{height:100%;background:linear-gradient(to right,#0DA0CF,#0a7fa8);border-radius:999px}
.distrib-row .count{flex:0 0 40px;text-align:right;font-size:.82rem;color:var(--ink-900);font-weight:700}
</style>
<link rel="manifest" href="/admin-pro/manifest.webmanifest"><meta name="theme-color" content="#0DA0CF"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="HC Admin"><link rel="apple-touch-icon" href="/logo-help-confort.png">
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("/admin-pro/sw.js").catch(()=>{});});}</script>
</head>
<body>
<div class="admin-overlay"></div>
<div class="admin-shell">
  <aside class="admin-sidebar"></aside>
  <main class="admin-main">
    <header class="admin-topbar"></header>
    <div class="admin-content">
      <div class="breadcrumb">
        <a href="index.html">Dashboard</a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
        <strong>SEO &amp; Analytics</strong>
      </div>
      <div class="admin-page-head">
        <div><h1>SEO &amp; Analytics</h1><p>Performance du contenu et trafic visiteurs.</p></div>
      </div>

      <div id="anContent"></div>
    </div>
  </main>
</div>

<script src="assets/supabase.js"></script>
<script src="assets/admin.js"></script>
<script src="assets/layout.js"></script>
<script>
(async function(){
  await HCSupabase.init();
  const session = await HCAdmin.requireAuth();
  if (!session) return;
  await HCLayout.mount('analytics', 'SEO & Analytics');

  const c = await HCSupabase.init();

  // Stats Supabase — chaque fetch wrappé dans .catch pour éviter qu'une erreur bloque tout
  const safe = (p) => p.then(r => r).catch(e => { console.warn('[analytics] fetch err:', e && e.message); return { data: [], error: e }; });
  const [realsRes, leadsRes, contractsRes, ordersRes] = await Promise.all([
    safe(c.from('realisations').select('metier,ville,status,seo_title,seo_description,description,description_long')),
    safe(c.from('leads').select('metier,ville,status,created_at')),
    safe(c.from('contracts').select('metier,client_city,client_postal_code,monthly_amount,created_at,status')),
    safe(c.from('service_orders').select('service_name,city,postal_code,price_ttc,created_at,status'))
  ]);

  const reals = realsRes.data || [];
  const leads = leadsRes.data || [];
  const contracts = contractsRes.data || [];
  const orders = (ordersRes.data) || [];

  // Répartition métiers : combine réalisations + leads (les 2 sources les plus parlantes)
  const byMetier = {};
  const byVille = {};
  reals.forEach(r => {
    if (r.metier) byMetier[r.metier] = (byMetier[r.metier] || 0) + 1;
    if (r.ville)  byVille[r.ville]   = (byVille[r.ville] || 0)   + 1;
  });
  leads.forEach(l => {
    if (l.metier) byMetier[l.metier] = (byMetier[l.metier] || 0) + 1;
    if (l.ville)  byVille[l.ville]   = (byVille[l.ville] || 0)   + 1;
  });
  contracts.forEach(ct => {
    if (ct.metier) byMetier[ct.metier] = (byMetier[ct.metier] || 0) + 1;
    if (ct.client_city) byVille[ct.client_city] = (byVille[ct.client_city] || 0) + 1;
  });

  const totalSEO = reals.filter(r => r.seo_title && r.seo_description).length;
  const totalLongDesc = reals.filter(r => r.description_long && r.description_long.length > 200).length;
  const total = reals.length;

  const { data: settings } = await c.from('app_settings').select('value').eq('key','ga4').single();
  const ga4Ready = !!(settings?.value?.property_id);

  // ─── Tentative d'appel à l'Edge Function ga4-stats pour les vraies données GA4 ──
  let ga4Stats = null;
  if (ga4Ready) {
    try {
      const { data, error } = await c.functions.invoke('ga4-stats', { body: { period: '30d' } });
      if (!error && data && data.success && data.kpi) {
        ga4Stats = data.kpi;
      } else if (!error && data) {
        ga4Stats = data;
      }
    } catch (e) { /* GA4 stats indispo, on affichera juste "configuré ✓" */ }
  }

  function distrib(obj, max=10) {
    const sorted = Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,max);
    const top = sorted[0]?.[1] || 1;
    return sorted.map(([k,v]) => `
      <div class="distrib-row">
        <div class="label">${escapeHtml(k || '—')}</div>
        <div class="bar-wrap"><div class="bar" style="width:${(v/top*100).toFixed(1)}%"></div></div>
        <div class="count">${v}</div>
      </div>
    `).join('');
  }
  function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  document.getElementById('anContent').innerHTML = `
    <div class="an-card">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> Trafic visiteurs (GA4) — 30 derniers jours</h3>
      ${!ga4Ready ?
        `<div class="an-empty" style="padding:24px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <p style="margin:0 0 12px;color:var(--ink-700)">GA4 non configuré</p>
          <div style="display:flex;gap:8px;justify-content:center"><a href="../guides/ga4.md" target="_blank" class="btn">📖 Guide</a><a href="settings.html#section-ga4" class="btn btn-primary">Configurer →</a></div>
        </div>`
        : ga4Stats ?
        `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px">
          <div style="padding:13px;background:#FAFCFD;border:1px solid var(--ink-100);border-radius:10px">
            <div style="font-size:.7rem;color:var(--ink-500);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">👥 Visiteurs uniques</div>
            <div style="font-size:1.5rem;font-weight:800;color:#0A1428;line-height:1.1">${(ga4Stats.users||ga4Stats.totalUsers||0).toLocaleString('fr-FR')}</div>
          </div>
          <div style="padding:13px;background:#FAFCFD;border:1px solid var(--ink-100);border-radius:10px">
            <div style="font-size:.7rem;color:var(--ink-500);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">📊 Sessions</div>
            <div style="font-size:1.5rem;font-weight:800;color:#0A1428;line-height:1.1">${(ga4Stats.sessions||0).toLocaleString('fr-FR')}</div>
          </div>
          <div style="padding:13px;background:#FAFCFD;border:1px solid var(--ink-100);border-radius:10px">
            <div style="font-size:.7rem;color:var(--ink-500);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">📄 Pages vues</div>
            <div style="font-size:1.5rem;font-weight:800;color:#0A1428;line-height:1.1">${(ga4Stats.page_views||ga4Stats.screenPageViews||0).toLocaleString('fr-FR')}</div>
          </div>
          <div style="padding:13px;background:#FAFCFD;border:1px solid var(--ink-100);border-radius:10px">
            <div style="font-size:.7rem;color:var(--ink-500);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">⏱ Durée moyenne</div>
            <div style="font-size:1.5rem;font-weight:800;color:#0A1428;line-height:1.1">${ga4Stats.avg_duration_sec ? Math.floor(ga4Stats.avg_duration_sec/60)+':'+String(ga4Stats.avg_duration_sec%60).padStart(2,'0') : '—'}</div>
          </div>
        </div>
        <p style="margin-top:14px;font-size:.78rem;color:var(--ink-400)">Données récupérées via l'Edge Function ga4-stats · property ${escapeHtml(settings?.value?.property_id||'')}</p>`
        :
        `<div style="padding:18px;background:#FAFCFD;border:1px dashed var(--ink-100);border-radius:10px">
          <p style="margin:0;font-size:.88rem;color:var(--ink-700)"><strong>GA4 configuré ✓</strong></p>
          <p style="margin:6px 0 0;font-size:.82rem;color:var(--ink-500)">L'Edge Function <code>ga4-stats</code> n'a pas répondu (Service Account Google probablement en attente de propagation — délai 4-6h après création). Re-déploiement non requis, attends que Google active le SA puis recharge cette page.</p>
        </div>`
      }
    </div>

    <div class="grid grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="an-card" style="margin-bottom:0">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77"/></svg> Couverture SEO</h3>
        <div class="distrib-list">
          <div class="distrib-row"><div class="label">SEO meta complet</div><div class="bar-wrap"><div class="bar" style="width:${total?(totalSEO/total*100).toFixed(0):0}%"></div></div><div class="count">${totalSEO}/${total}</div></div>
          <div class="distrib-row"><div class="label">Desc longue 200+</div><div class="bar-wrap"><div class="bar" style="width:${total?(totalLongDesc/total*100).toFixed(0):0}%"></div></div><div class="count">${totalLongDesc}/${total}</div></div>
        </div>
        <p style="font-size:.78rem;color:var(--ink-400);margin:14px 0 0">Améliorez votre référencement en complétant les chantiers manquants.</p>
      </div>

      <div class="an-card" style="margin-bottom:0">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/></svg> Répartition métiers</h3>
        <div class="distrib-list">${distrib(byMetier, 8)}</div>
      </div>
    </div>

    <div class="an-card">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Répartition villes</h3>
      <div class="distrib-list">${distrib(byVille, 12)}</div>
    </div>
  `;
})();
</script>
</body>
</html>
