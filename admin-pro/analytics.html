<div class="admin-shell">

  <main class="admin-main">
    <header class="admin-topbar"></header>
    <div class="admin-content">
      <div class="breadcrumb">
        <a href="index.html">Dashboard</a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
        <strong>SEO &amp; Analytics</strong>
      </div>
      <div class="admin-page-head">
        <div><h1>SEO &amp; Analytics</h1><p>Performance du contenu et trafic visiteurs.</p></div>
      </div>

      <div id="anContent"></div>
    </div>
  </main>
</div>

<script src="assets/supabase.js"></script>
<script src="assets/admin.js"></script>
<script src="assets/layout.js"></script>
<script>
(async function(){
  await HCSupabase.init();
  const session = await HCAdmin.requireAuth();
  if (!session) return;
  await HCLayout.mount('analytics', 'SEO & Analytics');

  const c = await HCSupabase.init();

  // Stats Supabase — chaque fetch wrappé dans .catch pour éviter qu'une erreur bloque tout
  const safe = (p) => p.then(r => r).catch(e => { console.warn('[analytics] fetch err:', e && e.message); return { data: [], error: e }; });
  const [realsRes, leadsRes, contractsRes, ordersRes] = await Promise.all([
    safe(c.from('realisations').select('metier,ville,status,seo_title,seo_description,description,description_long')),
    safe(c.from('leads').select('metier,ville,status,created_at')),
    safe(c.from('contracts').select('metier,client_city,client_postal_code,monthly_amount,created_at,status')),
    safe(c.from('service_orders').select('service_name,city,postal_code,price_ttc,created_at,status'))
  ]);

  const reals = realsRes.data || [];
  const leads = leadsRes.data || [];
  const contracts = contractsRes.data || [];
  const orders = (ordersRes.data) || [];

  // Répartition métiers : combine réalisations + leads (les 2 sources les plus parlantes)
  const byMetier = {};
  const byVille = {};
  reals.forEach(r => {
    if (r.metier) byMetier[r.metier] = (byMetier[r.metier] || 0) + 1;
    if (r.ville)  byVille[r.ville]   = (byVille[r.ville] || 0)   + 1;
  });
  leads.forEach(l => {
    if (l.metier) byMetier[l.metier] = (byMetier[l.metier] || 0) + 1;
    if (l.ville)  byVille[l.ville]   = (byVille[l.ville] || 0)   + 1;
  });
  contracts.forEach(ct => {
    if (ct.metier) byMetier[ct.metier] = (byMetier[ct.metier] || 0) + 1;
    if (ct.client_city) byVille[ct.client_city] = (byVille[ct.client_city] || 0) + 1;
  });

  const totalSEO = reals.filter(r => r.seo_title && r.seo_description).length;
  const totalLongDesc = reals.filter(r => r.description_long && r.description_long.length > 200).length;
  const total = reals.length;

  const { data: settings } = await c.from('app_settings').select('value').eq('key','ga4').single();
  const ga4Ready = !!(settings?.value?.property_id);
  const saJsonStr = settings?.value?.service_account_json;

  // ─── Sélecteur de période (lu depuis ?period=7d|30d|90d|365d) ──
  const PERIOD = (new URL(location.href).searchParams.get('period') || '30d');
  const PERIOD_MAP = {
    '7d':  { start:'7daysAgo',   end:'today',    prevStart:'14daysAgo', prevEnd:'8daysAgo',   label:'7 derniers jours' },
    '30d': { start:'30daysAgo',  end:'today',    prevStart:'60daysAgo', prevEnd:'31daysAgo',  label:'30 derniers jours' },
    '90d': { start:'90daysAgo',  end:'today',    prevStart:'180daysAgo',prevEnd:'91daysAgo',  label:'90 derniers jours' },
    '365d':{ start:'365daysAgo', end:'today',    prevStart:'730daysAgo',prevEnd:'366daysAgo', label:'12 derniers mois' }
  };
  const PERIOD_CFG = PERIOD_MAP[PERIOD] || PERIOD_MAP['30d'];

  // ─── Appel CLIENT-SIDE direct à GA4 (plus de dépendance Edge Function) ──
  let ga4Stats = null;
  let ga4Error = null;
  let topSources = [];
  let topPages = [];
  let ga4DailyEvolution = [];
  let ga4Previous = null;
  let ga4TopCities = [];
  let ga4Devices = [];
  let ga4Heatmap = []; // [{ day:0-6, hour:0-23, sessions:N }]

  // Helpers crypto pour JWT RS256
  function pemToArrayBuffer(pem){
    const b64 = String(pem||'').replace(/-----BEGIN PRIVATE KEY-----/g,'').replace(/-----END PRIVATE KEY-----/g,'').replace(/\s+/g,'');
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }
  function b64u(s){ return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function b64uBuf(buf){
    const b = new Uint8Array(buf); let s=''; for (let i=0;i<b.byteLength;i++) s += String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  async function ga4SignAndCall(sa, body){
    const now = Math.floor(Date.now()/1000);
    const header = { alg:'RS256', typ:'JWT', kid: sa.private_key_id };
    const payload = { iss: sa.client_email, scope:'https://www.googleapis.com/auth/analytics.readonly',
      aud: sa.token_uri || 'https://oauth2.googleapis.com/token', exp: now+3600, iat: now };
    const data = b64u(JSON.stringify(header)) + '.' + b64u(JSON.stringify(payload));
    const key = await crypto.subtle.importKey('pkcs8', pemToArrayBuffer(sa.private_key),
      { name:'RSASSA-PKCS1-v1_5', hash:'SHA-256' }, false, ['sign']);
    const sig = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(data));
    const jwt = data + '.' + b64uBuf(sig);
    const tokenRes = await fetch('https://oauth2.googleapis.com/token', {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({ grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: jwt }).toString()
    });
    const tokenJson = await tokenRes.json();
    if (!tokenJson.access_token) throw new Error('OAuth : ' + (tokenJson.error_description || tokenJson.error || 'token error'));
    const r = await fetch(`https://analyticsdata.googleapis.com/v1beta/properties/${settings.value.property_id}:runReport`, {
      method:'POST', headers:{ 'Authorization':'Bearer '+tokenJson.access_token, 'Content-Type':'application/json' },
      body: JSON.stringify(body)
    });
    const j = await r.json();
    if (j.error) throw new Error('GA4 : ' + j.error.message);
    return j;
  }

  // ─── Plan B : si on a un OAuth refresh_token GA4 (config ga4_oauth) → on l'utilise en PRIORITÉ ──
  // (sinon fallback sur service account)
  let ga4OauthRefresh = null;
  try {
    const { data: oauthData } = await c.from('app_settings').select('value').eq('key','ga4_oauth').maybeSingle();
    if (oauthData?.value?.refresh_token && oauthData?.value?.client_id && oauthData?.value?.client_secret) {
      ga4OauthRefresh = oauthData.value;
    }
  } catch(_){}

  if (ga4Ready && ga4OauthRefresh) {
    try {
      // Échange refresh_token → access_token
      const rt = await fetch('https://oauth2.googleapis.com/token', {
        method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body: new URLSearchParams({
          client_id: ga4OauthRefresh.client_id,
          client_secret: ga4OauthRefresh.client_secret,
          refresh_token: ga4OauthRefresh.refresh_token,
          grant_type:'refresh_token'
        }).toString()
      });
      const tj = await rt.json();
      if (!tj.access_token) throw new Error(tj.error_description || tj.error || 'oauth refresh failed');
      // Appel GA4 directement
      const ga4OauthCall = async (body) => {
        const r = await fetch(`https://analyticsdata.googleapis.com/v1beta/properties/${settings.value.property_id}:runReport`, {
          method:'POST', headers:{Authorization:'Bearer '+tj.access_token,'Content-Type':'application/json'},
          body: JSON.stringify(body)
        });
        const j = await r.json();
        if (j.error) throw new Error('GA4: '+j.error.message);
        return j;
      };
      const main = await ga4OauthCall({
        dateRanges:[{startDate:PERIOD_CFG.start,endDate:PERIOD_CFG.end}],
        metrics:[{name:'sessions'},{name:'totalUsers'},{name:'newUsers'},{name:'screenPageViews'},{name:'averageSessionDuration'},{name:'engagementRate'}]
      });
      const row = main.rows?.[0]?.metricValues || [];
      ga4Stats = {
        sessions: Number(row[0]?.value||0), users: Number(row[1]?.value||0),
        newUsers: Number(row[2]?.value||0), page_views: Number(row[3]?.value||0),
        avg_duration_sec: Math.round(Number(row[4]?.value||0)), engagement_rate: Number(row[5]?.value||0)
      };
      // Top sources + pages
      try {
        const s = await ga4OauthCall({ dateRanges:[{startDate:PERIOD_CFG.start,endDate:PERIOD_CFG.end}], dimensions:[{name:'sessionSourceMedium'}], metrics:[{name:'sessions'},{name:'totalUsers'}], limit:8, orderBys:[{metric:{metricName:'sessions'},desc:true}] });
        topSources = (s.rows||[]).map(r => ({ source:r.dimensionValues[0]?.value||'(direct)', sessions:Number(r.metricValues[0]?.value||0), users:Number(r.metricValues[1]?.value||0) }));
      } catch(_){}
      try {
        const p = await ga4OauthCall({ dateRanges:[{startDate:PERIOD_CFG.start,endDate:PERIOD_CFG.end}], dimensions:[{name:'pagePath'}], metrics:[{name:'screenPageViews'},{name:'totalUsers'}], limit:10, orderBys:[{metric:{metricName:'screenPageViews'},desc:true}] });
        topPages = (p.rows||[]).map(r => ({ path:r.dimensionValues[0]?.value||'/', views:Number(r.metricValues[0]?.value||0), users:Number(r.metricValues[1]?.value||0) }));
      } catch(_){}
      // Évolution quotidienne 30j (pour graphique)
      try {
        const d = await ga4OauthCall({
          dateRanges:[{startDate:PERIOD_CFG.start,endDate:PERIOD_CFG.end}],
          dimensions:[{name:'date'}],
          metrics:[{name:'sessions'},{name:'totalUsers'},{name:'screenPageViews'}],
          orderBys:[{dimension:{dimensionName:'date'}}]
        });
        ga4DailyEvolution = (d.rows||[]).map(r => ({
          date: r.dimensionValues[0]?.value || '',
          sessions: Number(r.metricValues[0]?.value||0),
          users: Number(r.metricValues[1]?.value||0),
          views: Number(r.metricValues[2]?.value||0)
        }));
      } catch(_){}
      // Comparaison 30j précédents (J-60 à J-30)
      try {
        const prev = await ga4OauthCall({
          dateRanges:[{startDate:PERIOD_CFG.prevStart,endDate:PERIOD_CFG.prevEnd}],
          metrics:[{name:'sessions'},{name:'totalUsers'},{name:'screenPageViews'}]
        });
        const r2 = prev.rows?.[0]?.metricValues || [];
        ga4Previous = {
          sessions: Number(r2[0]?.value||0),
          users: Number(r2[1]?.value||0),
          views: Number(r2[2]?.value||0)
        };
      } catch(_){}
      // Top villes
      try {
        const ct = await ga4OauthCall({
          dateRanges:[{startDate:PERIOD_CFG.start,endDate:PERIOD_CFG.end}],
          dimensions:[{name:'city'}],
          metrics:[{name:'sessions'}],
          limit: 8, orderBys:[{metric:{metricName:'sessions'},desc:true}]
        });
        ga4TopCities = (ct.rows||[]).map(r => ({
          city: r.dimensionValues[0]?.value || '(inconnu)',
          sessions: Number(r.metricValues[0]?.value||0)
        }));
      } catch(_){}
      // Devices
      try {
        const dv = await ga4OauthCall({
          dateRanges:[{startDate:PERIOD_CFG.start,endDate:PERIOD_CFG.end}],
          dimensions:[{name:'deviceCategory'}],
          metrics:[{name:'sessions'}]
        });
        ga4Devices = (dv.rows||[]).map(r => ({
          device: r.dimensionValues[0]?.value || 'unknown',
          sessions: Number(r.metricValues[0]?.value||0)
        }));
      } catch(_){}
      console.info('[analytics] GA4 via OAuth user — OK');
    } catch(e) {
      ga4Error = '[OAuth] ' + (e.message || 'erreur');
      console.warn('[analytics] OAuth fail, fallback SA :', ga4Error);
    }
  }

  if (!ga4Stats && ga4Ready && saJsonStr) {
    try {
      const sa = typeof saJsonStr === 'string' ? JSON.parse(saJsonStr) : saJsonStr;
      if (!sa.client_email || !sa.private_key || !String(sa.private_key).includes('BEGIN PRIVATE KEY')) {
        throw new Error('Service Account JSON incomplet (manque client_email ou private_key valide)');
      }
      // KPI principaux 30j
      const main = await ga4SignAndCall(sa, {
        dateRanges:[{startDate:PERIOD_CFG.start,endDate:PERIOD_CFG.end}],
        metrics:[{name:'sessions'},{name:'totalUsers'},{name:'newUsers'},{name:'screenPageViews'},{name:'averageSessionDuration'},{name:'engagementRate'}]
      });
      const row = main.rows?.[0]?.metricValues || [];
      ga4Stats = {
        sessions: Number(row[0]?.value||0),
        users: Number(row[1]?.value||0),
        newUsers: Number(row[2]?.value||0),
        page_views: Number(row[3]?.value||0),
        avg_duration_sec: Math.round(Number(row[4]?.value||0)),
        engagement_rate: Number(row[5]?.value||0)
      };
      // Top sources 30j
      try {
        const s = await ga4SignAndCall(sa, {
          dateRanges:[{startDate:PERIOD_CFG.start,endDate:PERIOD_CFG.end}],
          dimensions:[{name:'sessionSourceMedium'}],
          metrics:[{name:'sessions'},{name:'totalUsers'}],
          limit: 8, orderBys:[{metric:{metricName:'sessions'},desc:true}]
        });
        topSources = (s.rows||[]).map(r => ({
          source: r.dimensionValues[0]?.value || '(direct)',
          sessions: Number(r.metricValues[0]?.value||0),
          users: Number(r.metricValues[1]?.value||0)
        }));
      } catch(_){}
      // Top pages 30j
      try {
        const p = await ga4SignAndCall(sa, {
          dateRanges:[{startDate:PERIOD_CFG.start,endDate:PERIOD_CFG.end}],
          dimensions:[{name:'pagePath'}],
          metrics:[{name:'screenPageViews'},{name:'totalUsers'}],
          limit: 10, orderBys:[{metric:{metricName:'screenPageViews'},desc:true}]
        });
        topPages = (p.rows||[]).map(r => ({
          path: r.dimensionValues[0]?.value || '/',
          views: Number(r.metricValues[0]?.value||0),
          users: Number(r.metricValues[1]?.value||0)
        }));
      } catch(_){}
    } catch (e) {
      ga4Error = e.message || 'Erreur inconnue';
      console.warn('[analytics] GA4 client-side fail:', ga4Error);
    }
  }

  function distrib(obj, max=10) {
    const sorted = Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,max);
    const top = sorted[0]?.[1] || 1;
    return sorted.map(([k,v]) => `
      <div class="distrib-row">
        <div class="label">${escapeHtml(k || '—')}</div>
        <div class="bar-wrap"><div class="bar" style="width:${(v/top*100).toFixed(1)}%"></div></div>
        <div class="count">${v}</div>
      </div>
    `).join('');
  }
  function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  // ─── Helpers UI pour la refonte ──────────────────────────
  function variation(curr, prev){
    if (!prev || prev === 0) return curr > 0 ? { v: '+100%', cls: 'up', icon: '↗' } : { v: '0%', cls: 'flat', icon: '—' };
    const pct = Math.round(((curr - prev) / prev) * 100);
    if (pct > 0) return { v: '+' + pct + '%', cls: 'up', icon: '↗' };
    if (pct < 0) return { v: pct + '%', cls: 'down', icon: '↘' };
    return { v: '0%', cls: 'flat', icon: '—' };
  }
  function sourceIcon(src){
    const s = (src || '').toLowerCase();
    if (s.includes('google') && s.includes('organic')) return { ico:'🔍', bg:'#4285F4', label:'Google Search' };
    if (s.includes('google') && (s.includes('cpc')||s.includes('ads'))) return { ico:'💰', bg:'#34A853', label:'Google Ads' };
    if (s.includes('google')) return { ico:'G', bg:'#4285F4', label:'Google' };
    if (s.includes('facebook') || s.includes('fb')) return { ico:'f', bg:'#1877F2', label:'Facebook' };
    if (s.includes('instagram') || s.includes('ig.')) return { ico:'📷', bg:'#E1306C', label:'Instagram' };
    if (s.includes('linkedin')) return { ico:'in', bg:'#0A66C2', label:'LinkedIn' };
    if (s.includes('bing')) return { ico:'B', bg:'#008373', label:'Bing' };
    if (s.includes('direct')) return { ico:'⌨', bg:'#64748b', label:'Direct (saisie URL)' };
    if (s.includes('referral')) return { ico:'🔗', bg:'#A78BFA', label:'Referral' };
    if (s.includes('email') || s.includes('mail')) return { ico:'📧', bg:'#FFB400', label:'Email' };
    if (s === '(not set)' || s.includes('not set')) return { ico:'?', bg:'#94a3b8', label:'Non catégorisé' };
    return { ico:'🌐', bg:'#0DA0CF', label: src };
  }
  function pageMetier(path){
    const p = (path || '').toLowerCase();
    if (/plomb/.test(p)) return { ico:'💧', label:'Plomberie', color:'#0DA0CF' };
    if (/chauff/.test(p)) return { ico:'🔥', label:'Chauffage', color:'#FF6B1A' };
    if (/electric/.test(p)) return { ico:'⚡', label:'Électricité', color:'#FFB400' };
    if (/serrur/.test(p)) return { ico:'🔒', label:'Serrurerie', color:'#7C3AED' };
    if (/vitr/.test(p)) return { ico:'🪟', label:'Vitrerie', color:'#22C55E' };
    if (/menuis|porte|volet/.test(p)) return { ico:'🚪', label:'Menuiserie', color:'#A78BFA' };
    if (/pmr|adaptation/.test(p)) return { ico:'♿', label:'PMR', color:'#15803D' };
    if (/contrat|entretien/.test(p)) return { ico:'📋', label:'Contrats', color:'#0884AE' };
    if (/contact|devis/.test(p)) return { ico:'✉️', label:'Contact', color:'#C2410C' };
    if (/realisation/.test(p)) return { ico:'🛠', label:'Réalisation', color:'#0A1428' };
    if (/actualite|blog/.test(p)) return { ico:'📰', label:'Actu', color:'#FFB400' };
    if (/zone|saint-omer|dunkerque/.test(p)) return { ico:'📍', label:'Zone', color:'#0DA0CF' };
    if (/guide/.test(p)) return { ico:'📖', label:'Guide', color:'#A78BFA' };
    if (p === '/' || p === '/index.html') return { ico:'🏠', label:'Accueil', color:'#0DA0CF' };
    return { ico:'📄', label:'Page', color:'#64748b' };
  }
  function deviceIcon(d){
    const v = (d || '').toLowerCase();
    if (v === 'mobile') return { ico:'📱', label:'Mobile' };
    if (v === 'tablet') return { ico:'📱', label:'Tablette' };
    if (v === 'desktop') return { ico:'🖥', label:'Desktop' };
    return { ico:'❓', label: d };
  }

  document.getElementById('anContent').innerHTML = `
    <div class="an-card" style="padding:0;overflow:hidden;border:none;background:transparent;box-shadow:none">
      ${!ga4Ready ?
        `<div class="an-empty" style="padding:32px;background:#fff;border:1px solid var(--ink-100);border-radius:14px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <p style="margin:0 0 12px;color:var(--ink-700)">GA4 non configuré</p>
          <div style="display:flex;gap:8px;justify-content:center"><a href="../guides/ga4.md" target="_blank" class="btn">📖 Guide</a><a href="settings.html#section-ga4" class="btn btn-primary">Configurer →</a></div>
        </div>`
        : ga4Stats ?
        (() => {
          const prev = ga4Previous || { sessions:0, users:0, views:0 };
          const v1 = variation(ga4Stats.users, prev.users);
          const v2 = variation(ga4Stats.sessions, prev.sessions);
          const v3 = variation(ga4Stats.page_views, prev.views);
          const min = Math.floor((ga4Stats.avg_duration_sec||0)/60);
          const sec = (ga4Stats.avg_duration_sec||0)%60;
          // Sparkline data pour graphique
          const evolJSON = JSON.stringify(ga4DailyEvolution);
          return `
          <!-- HEADER PROPERTY -->
          <div style="padding:16px 20px;background:linear-gradient(135deg,#0A1428,#0DA0CF);color:#fff;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
            <div>

              <a href="oauth-ga4.html" style="padding:7px 12px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;border-radius:7px;font-size:.78rem;font-weight:700">🔁 Reconnecter</a>

          </div>

          <!-- KPI HERO -->
          <div style="background:#fff;padding:22px 20px;border-left:1px solid var(--ink-100);border-right:1px solid var(--ink-100)">
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px">
              <div style="padding:18px;background:linear-gradient(135deg,#EFF6FF,#fff);border:1px solid rgba(13,160,207,.20);border-radius:12px">

                  <div style="font-size:.7rem;color:#0884AE;font-weight:800;text-transform:uppercase;letter-spacing:.04em">Visiteurs</div>

                <div style="margin-top:6px;font-size:.78rem;display:flex;align-items:center;gap:6px">
                  <span style="font-weight:800;color:${v2.cls==='up'?'#15803d':v2.cls==='down'?'#B91C1C':'#64748b'}">${v2.icon} ${v2.v}</span>

              <div style="padding:18px;background:linear-gradient(135deg,#F0FDF4,#fff);border:1px solid rgba(34,197,94,.20);border-radius:12px">

              </div>
            </div>
          </div>

          <!-- GRAPHIQUE ÉVOLUTION 30 JOURS -->
          ${ga4DailyEvolution.length ? `
          <div style="background:#fff;padding:22px 20px;border-left:1px solid var(--ink-100);border-right:1px solid var(--ink-100);border-top:1px solid var(--ink-100)">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px">
              <h3 style="margin:0;font-size:1rem;font-weight:800;color:#0A1428">📈 Évolution du trafic (${PERIOD_CFG.label})</h3>
              <div style="display:flex;gap:14px;font-size:.78rem">
                <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:#0DA0CF"></span>Sessions</span>
                <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:#FF6B1A"></span>Visiteurs</span>
                <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:#7C3AED"></span>Pages vues</span>
              </div>
            </div>
            <div style="position:relative;height:260px"><canvas id="ga4EvolutionChart" data-evol='${evolJSON.replace(/'/g, "&#39;")}'></canvas></div>
          </div>` : ''}

          <!-- 2 COLONNES : Top sources + Top pages -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;background:#fff;border:1px solid var(--ink-100);border-top:none;border-radius:0 0 14px 14px;padding:0">
            <!-- COL 1 : TOP SOURCES -->
            <div style="padding:22px 20px;border-right:1px solid var(--ink-100)">
              <h3 style="margin:0 0 14px;font-size:1rem;font-weight:800;color:#0A1428">🔗 Top sources de trafic</h3>
              ${topSources.length ? `<div style="display:flex;flex-direction:column;gap:10px">
                ${topSources.map(s => {
                  const ic = sourceIcon(s.source);
                  const pct = topSources[0]?.sessions ? (s.sessions / topSources[0].sessions * 100).toFixed(0) : 0;
                  return `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--ink-50)">
                    <div style="width:36px;height:36px;border-radius:9px;background:${ic.bg};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.92rem;flex-shrink:0">${ic.ico}</div>
                    <div style="flex:1;min-width:0">
                      <div style="font-weight:700;color:#0A1428;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(ic.label)}</div>
                      <div style="position:relative;height:6px;background:#f1f5f9;border-radius:3px;margin-top:5px;overflow:hidden">
                        <div style="position:absolute;left:0;top:0;bottom:0;width:${pct}%;background:linear-gradient(90deg,${ic.bg},${ic.bg}cc);border-radius:3px"></div>
                      </div>
                    </div>
                    <div style="text-align:right;flex-shrink:0">
                      <div style="font-weight:900;color:#0A1428;font-size:1rem">${s.sessions}</div>
                      <div style="font-size:.7rem;color:#64748b">${s.users} visiteurs</div>
                    </div>
                  </div>`;
                }).join('')}
              </div>` : '<p style="color:#64748b;font-size:.86rem">Pas encore de données sources.</p>'}
            </div>

            <!-- COL 2 : TOP PAGES -->
            <div style="padding:22px 20px">
              <h3 style="margin:0 0 14px;font-size:1rem;font-weight:800;color:#0A1428">📄 Top pages visitées</h3>
              ${topPages.length ? `<div style="display:flex;flex-direction:column;gap:10px">
                ${topPages.map(p => {
                  const m = pageMetier(p.path);
                  const pct = topPages[0]?.views ? (p.views / topPages[0].views * 100).toFixed(0) : 0;
                  const url = p.path.startsWith('/') ? 'https://depan59-62.fr' + p.path : '#';
                  return `<a href="${escapeHtml(url)}" target="_blank" style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--ink-50);text-decoration:none;color:inherit">
                    <div style="width:36px;height:36px;border-radius:9px;background:${m.color}1f;color:${m.color};display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0">${m.ico}</div>
                    <div style="flex:1;min-width:0">
                      <div style="font-weight:700;color:#0A1428;font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Menlo,Monaco,monospace">${escapeHtml(p.path.length>40?p.path.slice(0,37)+'…':p.path)}</div>
                      <div style="position:relative;height:6px;background:#f1f5f9;border-radius:3px;margin-top:5px;overflow:hidden">
                        <div style="position:absolute;left:0;top:0;bottom:0;width:${pct}%;background:linear-gradient(90deg,${m.color},${m.color}aa);border-radius:3px"></div>
                      </div>
                    </div>
                    <div style="text-align:right;flex-shrink:0">
                      <div style="font-weight:900;color:#0A1428;font-size:1rem">${p.views}</div>
                      <div style="font-size:.7rem;color:#64748b">${p.users} uniq.</div>
                    </div>
                  </a>`;
                }).join('')}
              </div>` : '<p style="color:#64748b;font-size:.86rem">Pas encore de données pages.</p>'}
            </div>
          </div>

          <!-- 3ème ROW : Devices + Top villes -->
          ${(ga4Devices.length || ga4TopCities.length) ? `
          <div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px">
            ${ga4Devices.length ? `<div style="padding:18px;background:#fff;border:1px solid var(--ink-100);border-radius:12px">
              <h3 style="margin:0 0 12px;font-size:.96rem;font-weight:800;color:#0A1428">📱 Devices</h3>
              <div style="display:flex;flex-direction:column;gap:8px">
                ${ga4Devices.map(d => {
                  const ic = deviceIcon(d.device);
                  const total = ga4Devices.reduce((s,x)=>s+x.sessions,0);
                  const pct = total ? (d.sessions/total*100).toFixed(0) : 0;
                  return `<div style="display:flex;align-items:center;gap:10px">
                    <div style="font-size:1.2rem">${ic.ico}</div>
                    <div style="flex:1">
                      <div style="display:flex;justify-content:space-between;font-size:.84rem;font-weight:700">
                        <span>${escapeHtml(ic.label)}</span>
                        <span>${d.sessions} <small style="color:#64748b;font-weight:400">(${pct}%)</small></span>
                      </div>
                      <div style="position:relative;height:4px;background:#f1f5f9;border-radius:2px;margin-top:4px;overflow:hidden">
                        <div style="position:absolute;left:0;top:0;bottom:0;width:${pct}%;background:#0DA0CF;border-radius:2px"></div>
                      </div>
                    </div>
                  </div>`;
                }).join('')}
              </div>
            </div>` : ''}
            ${ga4TopCities.length ? `<div style="padding:18px;background:#fff;border:1px solid var(--ink-100);border-radius:12px">
              <h3 style="margin:0 0 12px;font-size:.96rem;font-weight:800;color:#0A1428">📍 Top villes</h3>
              <div style="display:flex;flex-direction:column;gap:8px">
                ${ga4TopCities.slice(0,6).map(ct => {
                  const total = ga4TopCities[0]?.sessions || 1;
                  const pct = (ct.sessions/total*100).toFixed(0);
                  return `<div style="display:flex;align-items:center;gap:10px">
                    <div style="flex:1">
                      <div style="display:flex;justify-content:space-between;font-size:.84rem;font-weight:700">
                        <span>${escapeHtml(ct.city)}</span>
                        <span>${ct.sessions}</span>
                      </div>
                      <div style="position:relative;height:4px;background:#f1f5f9;border-radius:2px;margin-top:4px;overflow:hidden">
                        <div style="position:absolute;left:0;top:0;bottom:0;width:${pct}%;background:#FF6B1A;border-radius:2px"></div>
                      </div>
                    </div>
                  </div>`;
                }).join('')}
              </div>
            </div>` : ''}
          </div>` : ''}
          `;
        })()
        :
        `<div style="padding:18px;background:linear-gradient(135deg,#FEF2F2,#fff);border:1px solid rgba(220,38,38,.30);border-radius:10px">
          <p style="margin:0;font-size:.92rem;color:#991B1B;font-weight:700">⚠ GA4 ne renvoie pas de données${ga4Error ? ' — '+escapeHtml(ga4Error) : ''}</p>
          <p style="margin:8px 0 0;font-size:.82rem;color:#7f1d1d;line-height:1.55">
            Causes probables :<br>
            • <strong>Service Account JSON tronqué/incomplet</strong> (ex: contient des "..." au lieu de la vraie private_key)<br>
            • Le service account <code>ga4-reader@help-confort-back-office.iam.gserviceaccount.com</code> n'a pas accès à la property GA4 (vérifie sur <a href="https://analytics.google.com" target="_blank" style="color:#0DA0CF">analytics.google.com → Admin → Property Access Management</a>)<br>
            • L'API <code>analyticsdata.googleapis.com</code> n'est pas activée sur le projet <code>help-confort-back-office</code>
          </p>
          <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
            <a href="oauth-ga4.html" class="btn btn-primary" style="background:linear-gradient(135deg,#4285F4,#34A853);color:#fff;text-decoration:none;padding:9px 16px;border-radius:8px;font-weight:800;font-size:.86rem">🔐 Plan B : connexion OAuth Google</a>
            <a href="finalize-config.html" class="btn" style="padding:9px 16px;border-radius:8px;font-weight:700;font-size:.86rem;text-decoration:none;background:#fff;border:1px solid #e2e8f0;color:#0A1428">🔧 Re-coller le JSON</a>
            <a href="sync-ga4.html" class="btn" style="padding:9px 16px;border-radius:8px;font-weight:700;font-size:.86rem;text-decoration:none;background:#fff;border:1px solid #e2e8f0;color:#0A1428">🧪 Test détaillé</a>
            <a href="https://console.cloud.google.com/apis/library/analyticsdata.googleapis.com?project=help-confort-back-office" target="_blank" class="btn" style="padding:9px 16px;border-radius:8px;font-weight:700;font-size:.86rem;text-decoration:none;background:#fff;border:1px solid #e2e8f0;color:#0A1428">✅ Activer API</a>
          </div>
        </div>`
      }
    </div>

    <div class="grid grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="an-card" style="margin-bottom:0">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77"/></svg> Couverture SEO</h3>
        <div class="distrib-list">
          <div class="distrib-row"><div class="label">SEO meta complet</div><div class="bar-wrap"><div class="bar" style="width:${total?(totalSEO/total*100).toFixed(0):0}%"></div></div><div class="count">${totalSEO}/${total}</div></div>
          <div class="distrib-row"><div class="label">Desc longue 200+</div><div class="bar-wrap"><div class="bar" style="width:${total?(totalLongDesc/total*100).toFixed(0):0}%"></div></div><div class="count">${totalLongDesc}/${total}</div></div>
        </div>
        <p style="font-size:.78rem;color:var(--ink-400);margin:14px 0 0">Améliorez votre référencement en complétant les chantiers manquants.</p>
      </div>

      <div class="an-card" style="margin-bottom:0">
        <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/></svg> Répartition métiers</h3>
        <div class="distrib-list">${distrib(byMetier, 8)}</div>
      </div>
    </div>

    <div class="an-card">
      <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Répartition villes</h3>
      <div class="distrib-list">${distrib(byVille, 12)}</div>
    </div>
  `;

  // ─── Init du graphique d'évolution GA4 (si Chart.js dispo + data présente) ───
  const chartCanvas = document.getElementById('ga4EvolutionChart');
  if (chartCanvas) {
    const loadChart = () => {
      if (typeof Chart === 'undefined') { setTimeout(loadChart, 300); return; }
      try {
        const evol = JSON.parse(chartCanvas.dataset.evol || '[]');
        if (!evol.length) return;
        const labels = evol.map(d => {
          const s = d.date || '';
          if (s.length === 8) return s.slice(6,8) + '/' + s.slice(4,6); // YYYYMMDD → DD/MM
          return s;
        });
        new Chart(chartCanvas, {
          type: 'line',
          data: {
            labels,
            datasets: [
              { label:'Sessions', data: evol.map(d=>d.sessions), borderColor:'#0DA0CF', backgroundColor:'rgba(13,160,207,.12)', tension:.35, fill:true, pointRadius:2, pointHoverRadius:5, borderWidth:2 },
              { label:'Visiteurs', data: evol.map(d=>d.users), borderColor:'#FF6B1A', backgroundColor:'rgba(255,107,26,.10)', tension:.35, fill:false, pointRadius:2, pointHoverRadius:5, borderWidth:2 },
              { label:'Pages vues', data: evol.map(d=>d.views), borderColor:'#7C3AED', backgroundColor:'rgba(124,58,237,.08)', tension:.35, fill:false, pointRadius:2, pointHoverRadius:5, borderWidth:2, borderDash:[4,3] }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction:{ mode:'index', intersect:false },
            plugins:{ legend:{ display:false }, tooltip:{ backgroundColor:'#0A1428', titleColor:'#fff', bodyColor:'#fff', padding:10, cornerRadius:8 } },
            scales:{ x:{ grid:{ display:false }, ticks:{ font:{ size:10 } } }, y:{ beginAtZero:true, grid:{ color:'#f1f5f9' }, ticks:{ font:{ size:10 } } } }
          }
        });
      } catch(e) { console.warn('[analytics] Chart init:', e.message); }
    };
    // Charger Chart.js si pas déjà chargé
    if (typeof Chart === 'undefined') {
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
      sc.onload = loadChart;
      document.head.appendChild(sc);
    } else loadChart();
  }
})();
</script>
