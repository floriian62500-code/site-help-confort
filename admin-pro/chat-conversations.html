<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Conversations chatbot · Back-Office HELP! Confort</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
.cv-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px;padding:12px;background:#fff;border:1px solid var(--ink-100);border-radius:14px;box-shadow:0 1px 2px rgba(11,18,32,.04)}
.cv-toolbar .toolbar-search{flex:1 1 240px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--ink-50);border:1px solid var(--ink-100);border-radius:10px}
.cv-toolbar .toolbar-search input{flex:1;border:none;background:transparent;outline:none;font:inherit;color:var(--ink-900);font-size:.88rem}
.cv-toolbar .toolbar-search svg{width:16px;height:16px;color:var(--ink-400)}
.cv-toolbar select{padding:8px 32px 8px 12px;border:1px solid var(--ink-100);border-radius:10px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>") right 10px center/14px no-repeat;font:inherit;font-size:.86rem;color:var(--ink-900);appearance:none;cursor:pointer;font-weight:500}

.cv-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.stat-pill{background:#fff;border:1px solid var(--ink-100);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.18s}
.stat-pill:hover{border-color:var(--hc-primary);transform:translateY(-1px)}
.stat-pill.is-active{border-color:var(--hc-primary);background:rgba(13,160,207,.04)}
.stat-pill .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-500);font-weight:700;margin-bottom:4px}
.stat-pill .val{font-size:1.5rem;font-weight:800;color:var(--ink-900);line-height:1}
.stat-pill.leads .val{color:#00aa50}
.stat-pill.urgences .val{color:#d92d20}

.cv-card{background:#fff;border:1px solid var(--ink-100);border-radius:12px;padding:14px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;transition:.18s;cursor:pointer}
.cv-card:hover{border-color:var(--ink-200);box-shadow:0 4px 12px rgba(11,18,32,.06)}
.cv-card.is-lead{border-left:3px solid #00aa50}
.cv-card.is-urgent{border-left:3px solid #d92d20}
.cv-status{padding:3px 9px;border-radius:6px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;display:inline-flex;align-items:center;gap:5px}
.cv-status::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.cv-status.open{background:rgba(13,160,207,.10);color:#0a7fa8}
.cv-status.closed{background:var(--ink-50);color:var(--ink-500)}
.cv-status.escalated{background:rgba(217,45,32,.10);color:#a51919}
.cv-body{min-width:0}
.cv-body h3{font-size:.94rem;font-weight:700;color:var(--ink-900);margin:0 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-body .meta{font-size:.78rem;color:var(--ink-500);display:flex;gap:12px;flex-wrap:wrap}
.cv-body .chip{display:inline-block;padding:2px 7px;border-radius:5px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--ink-50);color:var(--ink-700)}
.cv-body .chip.metier{background:rgba(13,160,207,.10);color:#0a7fa8}
.cv-body .chip.topic{background:rgba(255,107,26,.10);color:#a8430e}
.cv-meta-cell{font-size:.78rem;color:var(--ink-700);font-weight:600;text-align:right}
.cv-meta-cell .when{color:var(--ink-400);font-weight:400;font-size:.74rem}
.cv-rating{display:flex;gap:1px}
.cv-rating .star{font-size:.85rem;color:var(--ink-300)}
.cv-rating .star.on{color:#FFB400}

.modal-backdrop{position:fixed;inset:0;background:rgba(11,18,32,.50);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.modal-backdrop.is-open{display:flex}
.modal-panel{background:#fff;border-radius:16px;width:100%;max-width:820px;box-shadow:0 24px 60px rgba(11,18,32,.30)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--ink-100);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:1.05rem;font-weight:800;margin:0}
.modal-close{border:none;background:var(--ink-50);width:34px;height:34px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-500)}
.modal-body{padding:22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--ink-100);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;background:var(--ink-50);border-bottom-left-radius:16px;border-bottom-right-radius:16px}

.cv-info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.cv-info-cell{padding:10px 12px;background:var(--ink-50);border-radius:10px}
.cv-info-cell .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-500);font-weight:700;margin-bottom:4px}
.cv-info-cell .val{font-size:.92rem;color:var(--ink-900);font-weight:600;word-break:break-word}
.cv-info-cell .val a{color:var(--hc-primary);text-decoration:none}

.msgs{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;padding:8px;background:var(--ink-50);border-radius:10px;margin-bottom:18px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:.88rem;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--hc-primary);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#fff;color:var(--ink-900);border:1px solid var(--ink-100);border-bottom-left-radius:4px}
.msg .ts{font-size:.66rem;opacity:.7;margin-top:4px;display:block}

.rate-section{padding:16px;background:linear-gradient(135deg,rgba(255,180,0,.06),rgba(13,160,207,.04));border:1px solid var(--ink-100);border-radius:12px;margin-bottom:14px}
.rate-section h4{font-size:.85rem;font-weight:800;margin:0 0 10px;color:var(--ink-900)}
.rate-stars{display:flex;gap:6px;margin-bottom:10px}
.rate-stars .star-btn{font-size:1.6rem;color:var(--ink-300);background:none;border:none;cursor:pointer;padding:0;line-height:1;transition:.15s}
.rate-stars .star-btn.on{color:#FFB400;transform:scale(1.1)}
.rate-stars .star-btn:hover{color:#FFB400}
.rate-section textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--ink-100);border-radius:8px;font:inherit;font-size:.85rem;resize:vertical;background:#fff}

.btn-primary{background:var(--hc-primary);color:#fff;border:none;padding:9px 16px;border-radius:9px;font-weight:700;font-size:.85rem;cursor:pointer}
.btn-primary:hover{background:var(--hc-primary-dark)}
.btn-ghost{background:#fff;color:var(--ink-700);border:1px solid var(--ink-200);padding:9px 14px;border-radius:9px;font-weight:600;font-size:.85rem;cursor:pointer}
.btn-ghost:hover{background:var(--ink-50)}
.btn-danger{background:#fff;color:#d92d20;border:1px solid rgba(217,45,32,.30);padding:9px 14px;border-radius:9px;font-weight:600;font-size:.85rem;cursor:pointer}
.btn-danger:hover{background:rgba(217,45,32,.06)}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-400);background:#fff;border:1px dashed var(--ink-200);border-radius:14px}
.empty-state svg{width:48px;height:48px;color:var(--ink-300);margin-bottom:10px}
.toast-stack{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:2000;pointer-events:none}
.toast{background:#fff;border:1px solid var(--ink-100);border-radius:10px;padding:11px 14px;box-shadow:0 8px 24px rgba(11,18,32,.16);font-size:.86rem;font-weight:600;color:var(--ink-900);pointer-events:auto;min-width:240px}
.toast.ok{border-left:3px solid #00aa50}
.toast.err{border-left:3px solid #d92d20}

@media (max-width: 768px) {
  .cv-card{grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:8px}
  .cv-meta-cell{grid-column:2/-1;text-align:left}
  .cv-card > :last-child{display:none}
}
</style>
</head>
<body>
<div class="admin-overlay"></div>
<div class="admin-shell">
  <aside class="admin-sidebar"></aside>
  <main class="admin-main">
    <header class="admin-topbar"></header>
    <div class="admin-content">
      <div class="breadcrumb">
        <a href="index.html">Dashboard</a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
        <strong>Conversations chatbot</strong>
      </div>

      <div class="page-head">
        <div>
          <h1>Conversations chatbot IA</h1>
          <p class="page-subtitle">Lire les échanges, noter la qualité, améliorer le prompt système.</p>
        </div>
      </div>

      <!-- Stats -->
      <div class="cv-stats" id="cvStats">
        <div class="stat-pill is-active" data-filter="all">
          <div class="lbl">Total</div>
          <div class="val" id="statTotal">—</div>
        </div>
        <div class="stat-pill leads" data-filter="leads">
          <div class="lbl">Leads captés</div>
          <div class="val" id="statLeads">—</div>
        </div>
        <div class="stat-pill urgences" data-filter="urgence">
          <div class="lbl">Urgences</div>
          <div class="val" id="statUrg">—</div>
        </div>
        <div class="stat-pill" data-filter="rated">
          <div class="lbl">Notes admin</div>
          <div class="val" id="statRated">—</div>
        </div>
        <div class="stat-pill" data-filter="tokens">
          <div class="lbl">Tokens consommés</div>
          <div class="val" id="statTokens">—</div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="cv-toolbar">
        <div class="toolbar-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="cvSearch" placeholder="Rechercher (email, téléphone, mot-clé, métier)…">
        </div>
        <select id="cvFilterMetier">
          <option value="">Tous métiers</option>
          <option value="plomberie">Plomberie</option>
          <option value="chauffage">Chauffage</option>
          <option value="electricite">Électricité</option>
          <option value="serrurerie">Serrurerie</option>
          <option value="vitrerie">Vitrerie</option>
          <option value="renovation">Rénovation</option>
        </select>
        <select id="cvFilterStatus">
          <option value="">Tous statuts</option>
          <option value="open">En cours</option>
          <option value="closed">Fermées</option>
          <option value="escalated">Escaladées</option>
        </select>
        <button class="btn-ghost" onclick="loadConversations()">↻ Rafraîchir</button>
      </div>

      <!-- Liste -->
      <div id="cvList">
        <div class="empty-state">Chargement…</div>
      </div>
    </div>
  </main>
</div>

<!-- Modal détail -->
<div class="modal-backdrop" id="cvModal">
  <div class="modal-panel">
    <div class="modal-head">
      <h2 id="cvModalTitle">Conversation</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="cvModalBody">
      <!-- Rempli en JS -->
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" onclick="closeModal()">Fermer</button>
      <button class="btn-primary" onclick="saveRating()">Enregistrer la note</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/admin-config.js"></script>
<script src="assets/admin-shell.js"></script>
<script>
let allConversations = [];
let currentFilter = 'all';
let currentConv = null;
let currentRating = 0;

function toast(msg, type) {
  type = type || 'ok';
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.getElementById('toastStack').appendChild(t);
  setTimeout(function(){ t.remove(); }, 3500);
}

function fmtDate(iso) {
  if (!iso) return '—';
  try {
    var d = new Date(iso);
    return d.toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' });
  } catch (e) { return iso; }
}

function ago(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  var diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'à l\'instant';
  if (diff < 3600) return Math.floor(diff/60) + ' min';
  if (diff < 86400) return Math.floor(diff/3600) + ' h';
  return Math.floor(diff/86400) + ' j';
}

async function loadConversations() {
  document.getElementById('cvList').innerHTML = '<div class="empty-state">Chargement…</div>';
  try {
    const { data, error } = await window.sb
      .from('chat_conversations')
      .select('*')
      .order('updated_at', { ascending: false })
      .limit(500);
    if (error) throw error;
    allConversations = data || [];
    renderStats();
    renderList();
  } catch (e) {
    document.getElementById('cvList').innerHTML = '<div class="empty-state">Erreur : ' + e.message + '</div>';
    toast('Erreur chargement : ' + e.message, 'err');
  }
}

function renderStats() {
  document.getElementById('statTotal').textContent = allConversations.length;
  document.getElementById('statLeads').textContent = allConversations.filter(c => c.lead_captured).length;
  document.getElementById('statUrg').textContent  = allConversations.filter(c => c.topic === 'urgence').length;
  document.getElementById('statRated').textContent = allConversations.filter(c => c.rating).length;
  var tk = allConversations.reduce((s, c) => s + (c.total_tokens || 0), 0);
  document.getElementById('statTokens').textContent = tk.toLocaleString('fr-FR');
}

function renderList() {
  var q = document.getElementById('cvSearch').value.toLowerCase().trim();
  var fMetier = document.getElementById('cvFilterMetier').value;
  var fStatus = document.getElementById('cvFilterStatus').value;

  var rows = allConversations.filter(function(c){
    if (currentFilter === 'leads' && !c.lead_captured) return false;
    if (currentFilter === 'urgence' && c.topic !== 'urgence') return false;
    if (currentFilter === 'rated' && !c.rating) return false;
    if (fMetier && c.metier !== fMetier) return false;
    if (fStatus && c.status !== fStatus) return false;
    if (q) {
      var hay = [c.user_email, c.user_phone, c.user_name, c.topic, c.metier, JSON.stringify(c.messages||[])].join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  if (!rows.length) {
    document.getElementById('cvList').innerHTML = '<div class="empty-state">Aucune conversation pour ces critères.</div>';
    return;
  }

  var html = rows.map(function(c){
    var msgs = c.messages || [];
    var lastMsg = msgs[msgs.length - 1];
    var preview = lastMsg ? (lastMsg.content || '').slice(0, 90) : '';
    var who = c.user_name || c.user_email || c.user_phone || ('Session ' + (c.session_id||'').slice(0,8));
    var classes = ['cv-card'];
    if (c.lead_captured) classes.push('is-lead');
    if (c.topic === 'urgence') classes.push('is-urgent');
    var rating = c.rating ? ('<div class="cv-rating">' + [1,2,3,4,5].map(function(i){return '<span class="star '+(i<=c.rating?'on':'')+'">★</span>';}).join('') + '</div>') : '';

    return '<div class="' + classes.join(' ') + '" onclick="openConv(\'' + c.id + '\')">' +
      '<span class="cv-status ' + (c.status||'open') + '">' + (c.status||'open') + '</span>' +
      '<div class="cv-body">' +
        '<h3>' + escapeHtml(who) + ' — ' + escapeHtml(preview) + '</h3>' +
        '<div class="meta">' +
          (c.metier ? '<span class="chip metier">' + c.metier + '</span>' : '') +
          (c.topic ? '<span class="chip topic">' + c.topic + '</span>' : '') +
          '<span>' + (msgs.length) + ' message' + (msgs.length>1?'s':'') + '</span>' +
          (c.lead_captured ? '<span style="color:#00aa50;font-weight:700">✓ Lead</span>' : '') +
          (c.total_tokens ? '<span style="color:var(--ink-400)">' + c.total_tokens + ' tokens</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="cv-meta-cell">' + ago(c.updated_at) + '<br><span class="when">' + fmtDate(c.updated_at) + '</span></div>' +
      rating +
    '</div>';
  }).join('');

  document.getElementById('cvList').innerHTML = html;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function openConv(id) {
  currentConv = allConversations.find(c => c.id === id);
  if (!currentConv) return;
  currentRating = currentConv.rating || 0;

  var msgs = currentConv.messages || [];
  var msgsHtml = msgs.map(function(m){
    return '<div class="msg ' + m.role + '">' + escapeHtml(m.content) + (m.ts ? '<span class="ts">' + fmtDate(m.ts) + '</span>' : '') + '</div>';
  }).join('');

  var info = '<div class="cv-info-grid">' +
    '<div class="cv-info-cell"><div class="lbl">Démarré</div><div class="val">' + fmtDate(currentConv.created_at) + '</div></div>' +
    '<div class="cv-info-cell"><div class="lbl">Dernier message</div><div class="val">' + fmtDate(currentConv.updated_at) + '</div></div>' +
    '<div class="cv-info-cell"><div class="lbl">Statut</div><div class="val">' + (currentConv.status || 'open') + '</div></div>' +
    '<div class="cv-info-cell"><div class="lbl">Métier détecté</div><div class="val">' + (currentConv.metier || '—') + '</div></div>' +
    '<div class="cv-info-cell"><div class="lbl">Topic</div><div class="val">' + (currentConv.topic || '—') + '</div></div>' +
    '<div class="cv-info-cell"><div class="lbl">Nom</div><div class="val">' + escapeHtml(currentConv.user_name || '—') + '</div></div>' +
    '<div class="cv-info-cell"><div class="lbl">Email</div><div class="val">' + (currentConv.user_email ? '<a href="mailto:'+currentConv.user_email+'">'+currentConv.user_email+'</a>' : '—') + '</div></div>' +
    '<div class="cv-info-cell"><div class="lbl">Téléphone</div><div class="val">' + (currentConv.user_phone ? '<a href="tel:'+currentConv.user_phone+'">'+currentConv.user_phone+'</a>' : '—') + '</div></div>' +
    '<div class="cv-info-cell"><div class="lbl">Page d\'origine</div><div class="val">' + escapeHtml(currentConv.page_url || '—') + '</div></div>' +
    '<div class="cv-info-cell"><div class="lbl">Tokens cumulés</div><div class="val">' + (currentConv.total_tokens || 0) + '</div></div>' +
  '</div>';

  var stars = [1,2,3,4,5].map(function(i){
    return '<button class="star-btn ' + (i<=currentRating?'on':'') + '" data-rate="' + i + '" onclick="setRating(' + i + ')">★</button>';
  }).join('');

  var rateBlock = '<div class="rate-section">' +
    '<h4>📝 Évaluer la qualité de cette conversation</h4>' +
    '<div class="rate-stars" id="rateStars">' + stars + '</div>' +
    '<textarea id="rateNotes" placeholder="Commentaires pour améliorer le prompt système (ex: l\'IA aurait dû proposer le 03 66 10 01 34 plus tôt, formule trop chère mal présentée…)">' + escapeHtml(currentConv.rating_notes || '') + '</textarea>' +
  '</div>';

  document.getElementById('cvModalTitle').textContent = 'Conversation avec ' + (currentConv.user_name || currentConv.user_email || currentConv.user_phone || 'visiteur anonyme');
  document.getElementById('cvModalBody').innerHTML = info + rateBlock + '<h4 style="margin:14px 0 8px;font-size:.85rem;font-weight:800">Échange complet (' + msgs.length + ' messages)</h4><div class="msgs">' + msgsHtml + '</div>';
  document.getElementById('cvModal').classList.add('is-open');

  // Scroll en bas des messages
  setTimeout(function(){
    var box = document.querySelector('#cvModalBody .msgs');
    if (box) box.scrollTop = box.scrollHeight;
  }, 50);
}

function setRating(n) {
  currentRating = n;
  document.querySelectorAll('#rateStars .star-btn').forEach(function(b){
    var v = parseInt(b.dataset.rate);
    b.classList.toggle('on', v <= n);
  });
}

async function saveRating() {
  if (!currentConv) return;
  var notes = document.getElementById('rateNotes').value.trim();
  try {
    const { error } = await window.sb
      .from('chat_conversations')
      .update({ rating: currentRating || null, rating_notes: notes || null })
      .eq('id', currentConv.id);
    if (error) throw error;
    currentConv.rating = currentRating;
    currentConv.rating_notes = notes;
    toast('Note enregistrée ✓');
    closeModal();
    renderList();
  } catch (e) {
    toast('Erreur : ' + e.message, 'err');
  }
}

function closeModal() {
  document.getElementById('cvModal').classList.remove('is-open');
  currentConv = null;
  currentRating = 0;
}

// Filtres stats pills
document.querySelectorAll('#cvStats .stat-pill').forEach(function(el){
  el.addEventListener('click', function(){
    document.querySelectorAll('#cvStats .stat-pill').forEach(function(p){p.classList.remove('is-active');});
    el.classList.add('is-active');
    currentFilter = el.dataset.filter;
    renderList();
  });
});

// Filtres search/select
document.getElementById('cvSearch').addEventListener('input', renderList);
document.getElementById('cvFilterMetier').addEventListener('change', renderList);
document.getElementById('cvFilterStatus').addEventListener('change', renderList);

// Modal close on backdrop click
document.getElementById('cvModal').addEventListener('click', function(e){
  if (e.target === this) closeModal();
});

// Initial load
loadConversations();

// Auto-refresh toutes les 60s
setInterval(loadConversations, 60000);
</script>
</body>
</html>
