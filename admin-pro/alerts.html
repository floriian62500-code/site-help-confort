<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Alertes &amp; Monitoring · Back-Office HELP Confort</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
.alert-card{display:flex;align-items:flex-start;gap:12px;padding:14px;background:#fff;border:1px solid var(--ink-100);border-radius:12px;margin-bottom:8px;border-left-width:4px}
.alert-card.crit{border-left-color:#d92d20;background:rgba(217,45,32,.02)}
.alert-card.warn{border-left-color:#FFB400;background:rgba(255,184,0,.02)}
.alert-card.info{border-left-color:#0DA0CF}
.alert-card.ok{border-left-color:#00aa50}
.alert-card svg.icon{width:22px;height:22px;flex-shrink:0}
.alert-card.crit svg.icon{color:#d92d20}
.alert-card.warn svg.icon{color:#FFB400}
.alert-card.info svg.icon{color:#0DA0CF}
.alert-card.ok svg.icon{color:#00aa50}
.alert-card .body{flex:1;min-width:0}
.alert-card strong{display:block;font-size:.94rem;color:var(--ink-900);margin-bottom:2px}
.alert-card span{font-size:.82rem;color:var(--ink-500);line-height:1.5}
.alert-card .body a{color:var(--hc-primary);font-weight:600;text-decoration:none}
.health-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.health-tile{background:#fff;border:1px solid var(--ink-100);border-radius:12px;padding:14px}
.health-tile .lbl{font-size:.74rem;color:var(--ink-500);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.health-tile .val{font-size:1.4rem;font-weight:800;color:var(--ink-900)}
.health-tile .meta{font-size:.74rem;color:var(--ink-400);margin-top:2px}
.health-tile.ok .val{color:#007033}
.health-tile.warn .val{color:#7a4c00}
.health-tile.err .val{color:#d92d20}
</style>
<link rel="manifest" href="/admin-pro/manifest.webmanifest"><meta name="theme-color" content="#0DA0CF"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="HC Admin"><link rel="apple-touch-icon" href="/logo-officiel.jpg">
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("/admin-pro/sw.js").catch(()=>{});});}</script>
</head>
<body>
<script src="assets/hc-admin-auth.js?v=20260603"></script>
<div class="admin-overlay"></div>
<div class="admin-shell">
  <aside class="admin-sidebar"></aside>
  <main class="admin-main">
    <header class="admin-topbar"></header>
    <div class="admin-content">
      <div class="breadcrumb">
        <a href="index.html">Dashboard</a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
        <strong>Alertes &amp; Monitoring</strong>
      </div>
      <div class="admin-page-head">
        <div><h1>Alertes &amp; Monitoring</h1><p>Santé du système, tokens expirants, chantiers incomplets.</p></div>
      </div>

      <div class="health-grid" id="healthGrid"></div>

      <h3 style="font-size:.92rem;font-weight:700;margin:24px 0 12px;color:var(--ink-900)">Alertes actives</h3>
      <div id="alertsList"></div>
    </div>
  </main>
</div>

<script src="assets/supabase.js"></script>
<script src="assets/admin.js"></script>
<script src="assets/layout.js"></script>
<script>
(async function(){
  await HCSupabase.init();
  const session = await HCAdmin.requireAuth();
  if (!session) return;
  await HCLayout.mount('alerts', 'Alertes & Monitoring');

  const c = await HCSupabase.init();
  const safe = (p) => p.then(r => r).catch(e => { console.warn('[admin] fetch err:', e && e.message); return { data: [], error: e }; });

  // Charger données pour calcul des alertes — multi-sources
  const D30 = new Date(Date.now() - 30*86400000);
  const [reals, settings, leads, contracts, reviews] = await Promise.all([
    safe(c.from('realisations').select('id,title,status,image_before,image_after,created_at').limit(500)),
    safe(c.from('app_settings').select('*')),
    safe(c.from('leads').select('id,status,created_at,priority').gte('created_at', D30.toISOString())),
    safe(c.from('contracts').select('id,imported_to_crm_at,monthly_amount,created_at').is('imported_to_crm_at', null)),
    safe(c.from('reviews').select('id,source,rating,status,published_at').eq('source','google').order('created_at',{ascending:false}).limit(20))
  ]);
  const all = reals.data || [];
  const leadsList = leads.data || [];
  const toImportCt = contracts.data || [];
  const unanswered = (reviews.data || []).filter(r => !r.published_at && Number(r.rating) >= 1);
  const byKey = {};
  (settings.data || []).forEach(s => byKey[s.key] = s.value || {});

  // Health tiles
  const tiles = [
    { lbl:'Supabase', val:'Connecté', cls:'ok', meta:'Auth + DB + Storage' },
    { lbl:'Réalisations', val:all.length, cls:'ok', meta: all.length + ' chantiers en base' },
    { lbl:'Clé IA Claude', val: byKey.anthropic?.api_key ? 'Configurée' : 'Manquante', cls: byKey.anthropic?.api_key ? 'ok' : 'warn', meta: byKey.anthropic?.api_key ? 'Génération active' : 'Génération désactivée' },
    { lbl:'Canaux sociaux', val: ['meta','linkedin','gbp'].filter(k => byKey[k] && Object.keys(byKey[k]).length).length + '/3', cls: 'warn', meta:'à connecter' }
  ];
  document.getElementById('healthGrid').innerHTML = tiles.map(t => `
    <div class="health-tile ${t.cls}">
      <div class="lbl">${t.lbl}</div>
      <div class="val">${t.val}</div>
      <div class="meta">${t.meta}</div>
    </div>
  `).join('');

  // Alertes
  const alerts = [];

  // 🔥 PRIORITÉ MAX : Souscriptions à importer dans CRM
  if (toImportCt.length) {
    const mrr = toImportCt.reduce((s,x) => s + Number(x.monthly_amount||0), 0);
    alerts.push({
      cls:'warn', icon:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
      title: `📥 ${toImportCt.length} souscription${toImportCt.length>1?'s':''} à importer dans Apogée${mrr>0?' · '+mrr.toFixed(0)+' € CA récurrent attendu':''}`,
      body: `Importe-les dans le CRM pour démarrer le suivi commercial. <a href="contracts.html?filter=to_import">Ouvrir l'inbox →</a>`
    });
  }

  // 🔥 Leads urgents nouveaux
  const urgentLeads = leadsList.filter(l => l.priority === 'urgente' && l.status === 'nouveau');
  if (urgentLeads.length) {
    alerts.push({
      cls:'warn', icon:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
      title: `🔥 ${urgentLeads.length} lead${urgentLeads.length>1?'s':''} URGENT${urgentLeads.length>1?'S':''} non traité${urgentLeads.length>1?'s':''}`,
      body: `Rappelle le client en priorité. <a href="leads.html?filter=nouveau">Voir les urgences →</a>`
    });
  }

  // Leads nouveaux non urgents
  const newLeads = leadsList.filter(l => l.status === 'nouveau' && l.priority !== 'urgente');
  if (newLeads.length) alerts.push({
    cls:'info', icon:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    title: `${newLeads.length} lead${newLeads.length>1?'s':''} à qualifier`,
    body: `Recontacte tes prospects pour les faire avancer. <a href="leads.html?filter=nouveau">Qualifier maintenant →</a>`
  });

  // Avis non répondus
  if (unanswered.length) alerts.push({
    cls:'warn', icon:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    title: `${unanswered.length} avis Google à répondre`,
    body: `Booste ta réputation locale en répondant rapidement. <a href="reviews.html">Répondre →</a>`
  });

  const draftsNoPhoto = all.filter(r => r.status === 'brouillon' && !r.image_before && !r.image_after);
  if (draftsNoPhoto.length) alerts.push({
    cls:'warn', icon:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
    title: draftsNoPhoto.length + ' brouillon' + (draftsNoPhoto.length>1?'s':'') + ' sans photo',
    body: 'Ajoutez au moins une photo avant de publier — c\'est le facteur n°1 de conversion. <a href="realisations.html?filter=brouillon">Ouvrir les brouillons →</a>'
  });
  const validations = all.filter(r => r.status === 'validation').length;
  if (validations) alerts.push({
    cls:'info', icon:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
    title: validations + ' chantier' + (validations>1?'s':'') + ' à valider',
    body: 'En attente de votre validation avant publication. <a href="publications.html">Aller à la pile →</a>'
  });
  if (!byKey.anthropic?.api_key) alerts.push({
    cls:'warn', icon:'<path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>',
    title: 'Génération IA non activée',
    body: 'Configurez votre clé Anthropic pour générer titres et descriptions automatiquement. <a href="settings.html#section-anthropic">Configurer →</a>'
  });
  if (!byKey.company?.raison_sociale) alerts.push({
    cls:'info', icon:'<path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/>',
    title: 'Informations société à compléter',
    body: 'Améliore le SEO et les balises meta du site. <a href="settings.html#section-company">Compléter →</a>'
  });

  if (alerts.length === 0) {
    alerts.push({
      cls:'ok', icon:'<polyline points="20 6 9 17 4 12"/>',
      title:'Aucune alerte — tout est à jour ✓',
      body:'Votre système est en bonne santé.'
    });
  }
  document.getElementById('alertsList').innerHTML = alerts.map(a => `
    <div class="alert-card ${a.cls}">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${a.icon}</svg>
      <div class="body"><strong>${a.title}</strong><span>${a.body}</span></div>
    </div>
  `).join('');
})();
</script>
</body>
</html>
