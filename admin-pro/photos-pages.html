// ═══ Resize image avant upload (max 1600px, qualité 88%) ═══
async function resizeImage(file, maxDim = 1600, quality = 0.88) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = () => reject(new Error('Image illisible'));
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        const r = Math.min(maxDim / w, maxDim / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob((blob) => {
        if (!blob) reject(new Error('Compression échouée')); else resolve(blob);
      }, 'image/jpeg', quality);
    };
    img.src = URL.createObjectURL(file);
  });
}

async function uploadSlot(slotKey, file) {
  try {
    const filename = slotKey + '.jpg';
    const blob = await resizeImage(file);
    const { error } = await sb.storage.from(BUCKET).upload(filename, blob, {
      cacheControl: '60', upsert: true, contentType: 'image/jpeg'
    });
    if (error) throw error;
    toast('✓ Photo enregistrée — visible sur le site dans 1 min');
    return STORAGE_BASE + filename + '?t=' + Date.now();
  } catch (e) {
    alert('Erreur upload : ' + e.message);
    return null;
  }
}

async function deleteSlot(slotKey) {
  if (!confirm('Supprimer cette photo ?')) return false;
  const filename = slotKey + '.jpg';
  const { error } = await sb.storage.from(BUCKET).remove([filename]);
  if (error) { alert('Erreur : ' + error.message); return false; }
  toast('Photo supprimée');
  return true;
}

async function listExisting() {
  // Liste les objets dans toutes les sous-folders du bucket
  const { data, error } = await sb.storage.from(BUCKET).list('', { limit: 500 });
  if (error) return new Set();
  const set = new Set();
  // Browser le dossier racine + sous-dossiers
  for (const item of (data || [])) {
    if (item.id) set.add(item.name.replace(/\.jpg$/, ''));
    if (!item.id) {  // c'est un dossier
      const { data: sub } = await sb.storage.from(BUCKET).list(item.name, { limit: 200 });
      for (const f of (sub || [])) {
        if (f.id) set.add(item.name + '/' + f.name.replace(/\.jpg$/, ''));
      }
    }
  }
  return set;
}

}

// ═══ Seed : import des photos déjà présentes sur le site (localFallback) ═══
// 2026-06-01 — AUTO-RUN au load : Florian n'a plus à cliquer, ça s'auto-déclenche.
//             Skip silencieux pour les photos déjà uploadées.
async function seedExistingPhotos(silent) {
  const seedBtn = document.getElementById('pgSeedBtn');
  const report = document.getElementById('pgSeedReport');
  const candidates = [];
  PHOTO_SLOTS.forEach(group => {
    group.slots.forEach(s => {
      if (s.localFallback) candidates.push(s);
    });
  });
  if (!candidates.length) {
    if (!silent) alert('Aucune photo locale référencée à importer.');
    return;
  }
  // En mode silent (auto-run), on filtre celles déjà uploadées
  let toUpload = candidates;
  if (silent) {
    const existing = await listExisting();
    toUpload = candidates.filter(c => !existing.has(c.key));
    if (!toUpload.length) return;  // rien à faire
  } else {
    if (!confirm('Importer ' + candidates.length + ' photo(s) locale(s) vers Supabase ?\n(Les emplacements déjà uploadés seront écrasés.)')) return;
  }
  if (seedBtn) {
    seedBtn.disabled = true;
    seedBtn.textContent = silent ? '⏳ Auto-import en cours…' : '⏳ Import en cours…';
  }
  if (report && !silent) {
    report.style.display = 'block';
    report.innerHTML = '<strong>Import en cours…</strong>';
  }
  const results = [];
  for (const slot of toUpload) {
    try {
      const resp = await fetch(slot.localFallback);
      if (!resp.ok) { results.push({ slot: slot.key, ok: false, err: 'HTTP ' + resp.status }); continue; }
      const blob = await resp.blob();
      // GARDE-FOU 2026-06-01 : skip images suspectes (trop petites = SVG/icon/placeholder cassé)
      if (blob.size < 20000) {
        results.push({ slot: slot.key, ok: false, err: 'Image trop petite (' + blob.size + ' octets — probablement placeholder cassé)' });
        continue;
      }
      // Skip si le content-type n'est pas une vraie image
      if (!/^image\/(jpe?g|png|webp|avif)$/i.test(blob.type)) {
        results.push({ slot: slot.key, ok: false, err: 'Type non supporté : ' + blob.type });
        continue;
      }
      const filename = slot.key + '.jpg';
      const { error } = await sb.storage.from(BUCKET).upload(filename, blob, {
        cacheControl: '60', upsert: true, contentType: blob.type || 'image/jpeg'
      });
      if (error) { results.push({ slot: slot.key, ok: false, err: error.message }); continue; }
      results.push({ slot: slot.key, ok: true });
    } catch (e) {
      results.push({ slot: slot.key, ok: false, err: e.message });
    }
  }
  const ok = results.filter(r => r.ok).length;
  const ko = results.filter(r => !r.ok);
  if (report) {
    report.style.display = 'block';
    if (silent && ok > 0) {
      report.style.background = '#ECFDF5';
      report.style.borderColor = '#10B981';
      report.innerHTML = '<strong>✓ Auto-import : ' + ok + ' photo(s) du site uploadées dans Supabase</strong>' +
        (ko.length ? '<ul style="margin:6px 0 0;padding-left:18px;font-size:.84rem;color:#7F1D1D">' + ko.map(r => '<li>' + r.slot + ' — ' + r.err + '</li>').join('') + '</ul>' : '');
      setTimeout(() => { report.style.display = 'none'; }, 8000);
    } else if (!silent) {
      report.innerHTML = '<strong>✓ Import terminé : ' + ok + ' / ' + results.length + ' photo(s)</strong>' +
        (ko.length ? '<ul style="margin:6px 0 0;padding-left:18px">' + ko.map(r => '<li>' + r.slot + ' — ' + r.err + '</li>').join('') + '</ul>' : '');
    }
  }
  if (seedBtn) {
    seedBtn.disabled = false;
    seedBtn.textContent = '🚀 Re-importer les photos du site';
  }
  render();
}
document.getElementById('pgSeedBtn').addEventListener('click', function(){ seedExistingPhotos(false); });

    'pmr/douche-italienne.jpg','pmr/barre-appui.jpg','pmr/salle-de-bain.jpg',
    'travaux/parquet.jpg','travaux/salle-de-bain.jpg'
  ];
  let removed = 0;
  for (const path of KILL_LIST) {
    try {
      const { error } = await sb.storage.from(BUCKET).remove([path]);
      if (!error) removed++;
    } catch(_){}
  }
  if (removed > 0) {
    console.log('[cleanup] ' + removed + ' photo(s) auto-importée(s) supprimée(s) du bucket');
    render();
  }
}
// Lance le cleanup une fois au chargement (skip silencieux si rien à supprimer)
setTimeout(cleanupGenericImports, 800);
