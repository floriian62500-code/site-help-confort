<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Photos pages métier · Back-Office HELP Confort</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
  .pg-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap }
  .pg-intro { font-size: .94rem; color: var(--ink-500); margin-bottom: 24px; padding: 14px 18px; background: rgba(13,160,207,.06); border-radius: 10px; border-left: 4px solid var(--hc-primary); line-height: 1.55 }
  .pg-page-group { margin-bottom: 36px }
  .pg-page-title { font-size: 1.05rem; font-weight: 800; color: var(--ink-900); margin: 0 0 4px; display: flex; align-items: center; gap: 8px }
  .pg-page-meta { font-size: .82rem; color: var(--ink-500); margin: 0 0 14px }
  .pg-page-meta a { color: var(--hc-primary); font-weight: 600; text-decoration: none }
  .pg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px }
  .pg-card { background: #fff; border: 1px solid var(--ink-100); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; transition: all .15s }
  .pg-card:hover { box-shadow: 0 8px 24px rgba(10,20,40,.08); transform: translateY(-2px) }
  .pg-thumb { position: relative; aspect-ratio: 4/3; background: linear-gradient(135deg, #F0F4F7, #E5EDF3); overflow: hidden; cursor: pointer }
  .pg-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
  .pg-thumb-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: #94a3b8; font-size: .82rem; text-align: center; padding: 12px }
  .pg-thumb-empty svg { width: 36px; height: 36px; opacity: .5 }
  .pg-thumb-overlay { position: absolute; inset: 0; background: rgba(10,20,40,.55); opacity: 0; transition: opacity .2s; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: .9rem; gap: 6px }
  .pg-card:hover .pg-thumb-overlay { opacity: 1 }
  .pg-body { padding: 14px }
  .pg-body h3 { font-size: .94rem; font-weight: 700; color: var(--ink-900); margin: 0 0 4px }
  .pg-body p { font-size: .82rem; color: var(--ink-500); margin: 0 0 10px; line-height: 1.4 }
  .pg-actions { display: flex; gap: 8px }
  .pg-btn { flex: 1; padding: 8px 12px; border-radius: 8px; font: inherit; font-size: .82rem; font-weight: 700; cursor: pointer; border: 1px solid var(--ink-100); background: #fff; color: var(--ink-900); transition: all .15s; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px }
  .pg-btn:hover { border-color: var(--hc-primary); color: var(--hc-primary) }
  .pg-btn.primary { background: var(--hc-primary); color: #fff; border-color: var(--hc-primary) }
  .pg-btn.primary:hover { background: var(--hc-primary-dark); color: #fff }
  .pg-toast { position: fixed; bottom: 24px; right: 24px; background: #0A1428; color: #fff; padding: 14px 20px; border-radius: 12px; font-weight: 600; box-shadow: 0 18px 40px rgba(0,0,0,.30); z-index: 9999; display: none; align-items: center; gap: 12px; border-left: 4px solid #1aa260 }
  .pg-toast.show { display: flex }
</style>
</head>
<body>
<div id="layout-mount"></div>
<script src="assets/layout.js?v=20260530"></script>
<script>renderLayout({ active: 'photos-pages', module: 'comm' });</script>

<main style="max-width:1400px;margin:0 auto;padding:24px clamp(16px,4vw,40px) 80px">

  <div class="pg-head">
    <h1 style="font-size:1.6rem;font-weight:800;margin:0">📸 Photos des pages métier</h1>
    <span id="pgStatus" style="font-size:.84rem;color:var(--ink-500)"></span>
  </div>

  <div class="pg-intro">
    <strong>Gérez ici les photos affichées sur vos pages métier publiques</strong> (volets, plomberie, etc.) — les prestations BDD sont sur la page <a href="services.html" style="color:var(--hc-primary);font-weight:700">Prestations &amp; tarifs</a>. Toute photo uploadée ici est <strong>visible immédiatement sur le site</strong> (cache 60s max).
  </div>

  <div id="pgPagesList"></div>
</main>

<div class="pg-toast" id="pgToast"><span style="font-size:1.3rem">✓</span><span id="pgToastMsg"></span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://btcbjwqiivhpwoszomhg.supabase.co';
const SUPABASE_ANON = 'sb_publishable_Zyd4jmm3_qOcTjFdN8pnBw_sOybyyB2';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const BUCKET = 'site-photos';
const STORAGE_BASE = SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/';

// ═══ Mapping prédéfini des emplacements photo ═══
// Ajouter ici un nouveau slot quand on veut ouvrir un nouvel emplacement
const PHOTO_SLOTS = [
  {
    page: 'volets-saint-omer',
    pageLabel: '🪟 Page Volets — Saint-Omer',
    pageUrl: '/volets-saint-omer',
    slots: [
      { key: 'volets/volet-roulant', label: 'Volet roulant',  desc: 'Card "Volet roulant" — pose neuve / remplacement' },
      { key: 'volets/motorisation-somfy', label: 'Motorisation Somfy', desc: 'Card "Motorisation & modernisation"' }
    ]
  },
  {
    page: 'travaux-saint-omer',
    pageLabel: '🏠 Page Rénovation — Saint-Omer',
    pageUrl: '/travaux-saint-omer',
    slots: [
      { key: 'travaux/hero', label: 'Hero rénovation', desc: 'Image principale en haut de la page' },
      { key: 'travaux/enduit', label: 'Enduit intérieur', desc: 'Photo prestation enduit' },
      { key: 'travaux/peinture', label: 'Peinture intérieure', desc: 'Photo prestation peinture' }
    ]
  },
  {
    page: 'plombier-saint-omer',
    pageLabel: '🔧 Page Plomberie — Saint-Omer',
    pageUrl: '/plombier-saint-omer',
    slots: [
      { key: 'plomberie/hero', label: 'Hero plomberie', desc: 'Image principale page plombier' }
    ]
  },
  {
    page: 'chauffagiste-saint-omer',
    pageLabel: '🔥 Page Chauffage — Saint-Omer',
    pageUrl: '/chauffagiste-saint-omer',
    slots: [
      { key: 'chauffage/hero', label: 'Hero chauffage', desc: 'Image principale page chauffagiste' }
    ]
  },
  {
    page: 'electricien-saint-omer',
    pageLabel: '⚡ Page Électricité — Saint-Omer',
    pageUrl: '/electricien-saint-omer',
    slots: [
      { key: 'electricite/hero', label: 'Hero électricité', desc: 'Image principale page électricien' }
    ]
  },
  {
    page: 'serrurier-saint-omer',
    pageLabel: '🔐 Page Serrurerie — Saint-Omer',
    pageUrl: '/serrurier-saint-omer',
    slots: [
      { key: 'serrurerie/hero', label: 'Hero serrurerie', desc: 'Image principale page serrurier' }
    ]
  },
  {
    page: 'vitrier-saint-omer',
    pageLabel: '🪟 Page Vitrerie — Saint-Omer',
    pageUrl: '/vitrier-saint-omer',
    slots: [
      { key: 'vitrerie/hero', label: 'Hero vitrerie', desc: 'Image principale page vitrier' }
    ]
  }
];

function toast(msg) {
  const t = document.getElementById('pgToast');
  document.getElementById('pgToastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 5000);
}

// ═══ Resize image avant upload (max 1600px, qualité 88%) ═══
async function resizeImage(file, maxDim = 1600, quality = 0.88) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onerror = () => reject(new Error('Image illisible'));
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        const r = Math.min(maxDim / w, maxDim / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob((blob) => {
        if (!blob) reject(new Error('Compression échouée')); else resolve(blob);
      }, 'image/jpeg', quality);
    };
    img.src = URL.createObjectURL(file);
  });
}

async function uploadSlot(slotKey, file) {
  try {
    const filename = slotKey + '.jpg';
    const blob = await resizeImage(file);
    const { error } = await sb.storage.from(BUCKET).upload(filename, blob, {
      cacheControl: '60', upsert: true, contentType: 'image/jpeg'
    });
    if (error) throw error;
    toast('✓ Photo enregistrée — visible sur le site dans 1 min');
    return STORAGE_BASE + filename + '?t=' + Date.now();
  } catch (e) {
    alert('Erreur upload : ' + e.message);
    return null;
  }
}

async function deleteSlot(slotKey) {
  if (!confirm('Supprimer cette photo ?')) return false;
  const filename = slotKey + '.jpg';
  const { error } = await sb.storage.from(BUCKET).remove([filename]);
  if (error) { alert('Erreur : ' + error.message); return false; }
  toast('Photo supprimée');
  return true;
}

async function listExisting() {
  // Liste les objets dans toutes les sous-folders du bucket
  const { data, error } = await sb.storage.from(BUCKET).list('', { limit: 500 });
  if (error) return new Set();
  const set = new Set();
  // Browser le dossier racine + sous-dossiers
  for (const item of (data || [])) {
    if (item.id) set.add(item.name.replace(/\.jpg$/, ''));
    if (!item.id) {  // c'est un dossier
      const { data: sub } = await sb.storage.from(BUCKET).list(item.name, { limit: 200 });
      for (const f of (sub || [])) {
        if (f.id) set.add(item.name + '/' + f.name.replace(/\.jpg$/, ''));
      }
    }
  }
  return set;
}

function thumbnail(slotKey, exists) {
  if (exists) {
    return '<img src="' + STORAGE_BASE + slotKey + '.jpg?t=' + Date.now() + '" alt="">' +
           '<div class="pg-thumb-overlay">📷 Remplacer</div>';
  }
  return '<div class="pg-thumb-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Aucune photo<br><strong style="color:#0DA0CF">+ Cliquer pour uploader</strong></span></div>';
}

async function render() {
  document.getElementById('pgStatus').textContent = 'Chargement…';
  const existing = await listExisting();
  document.getElementById('pgStatus').textContent = existing.size + ' photo' + (existing.size > 1 ? 's' : '') + ' uploadée' + (existing.size > 1 ? 's' : '') + ' · ' + PHOTO_SLOTS.reduce((n, p) => n + p.slots.length, 0) + ' emplacements';

  const root = document.getElementById('pgPagesList');
  root.innerHTML = PHOTO_SLOTS.map(group => `
    <section class="pg-page-group">
      <h2 class="pg-page-title">${group.pageLabel}</h2>
      <p class="pg-page-meta"><a href="https://depan59-62.fr${group.pageUrl}" target="_blank" rel="noopener">Voir la page publique →</a></p>
      <div class="pg-grid">
        ${group.slots.map(s => `
          <article class="pg-card">
            <label class="pg-thumb" style="display:block;cursor:pointer">
              <input type="file" accept="image/*" data-slot="${s.key}" style="display:none">
              ${thumbnail(s.key, existing.has(s.key))}
            </label>
            <div class="pg-body">
              <h3>${s.label}</h3>
              <p>${s.desc}</p>
              <div class="pg-actions">
                <label class="pg-btn primary" style="cursor:pointer">
                  <input type="file" accept="image/*" data-slot="${s.key}" style="display:none">
                  📷 Uploader
                </label>
                ${existing.has(s.key) ? `<button class="pg-btn" data-action="delete" data-slot="${s.key}">🗑 Supprimer</button>` : ''}
              </div>
            </div>
          </article>
        `).join('')}
      </div>
    </section>
  `).join('');

  // Bind file inputs
  root.querySelectorAll('input[type="file"][data-slot]').forEach(inp => {
    inp.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const slot = e.target.dataset.slot;
      await uploadSlot(slot, file);
      render();
    });
  });
  // Bind delete buttons
  root.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const ok = await deleteSlot(e.target.dataset.slot);
      if (ok) render();
    });
  });
}

render();
</script>
</body>
</html>
