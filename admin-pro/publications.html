<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Publications · Back-Office HELP! Confort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
.pub-card{display:flex;align-items:center;gap:14px;padding:14px;background:#fff;border:1px solid var(--ink-100);border-radius:12px;margin-bottom:8px;transition:.15s}
.pub-card:hover{border-color:var(--ink-200);box-shadow:0 4px 12px rgba(11,18,32,.06)}
.pub-thumb{width:64px;height:64px;border-radius:10px;background:var(--ink-50);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink-300)}
.pub-thumb img{width:100%;height:100%;object-fit:cover}
.pub-info{flex:1;min-width:0}
.pub-info h3{font-size:.94rem;font-weight:700;color:var(--ink-900);margin:0 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pub-info-meta{font-size:.78rem;color:var(--ink-500);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pub-info-meta .tag{padding:2px 7px;border-radius:5px;background:rgba(13,160,207,.10);color:var(--hc-primary);font-weight:700}
.pub-actions{display:flex;gap:6px}
.pub-actions .btn{padding:6px 12px;font-size:.82rem}
.empty{text-align:center;padding:48px 20px;background:#fff;border:1px dashed var(--ink-200);border-radius:14px;color:var(--ink-500)}
.empty svg{width:42px;height:42px;color:var(--ink-300);margin-bottom:10px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-head h3{font-size:.92rem;font-weight:700;color:var(--ink-900);margin:0;display:flex;align-items:center;gap:8px}
.section-head .count-pill{padding:2px 9px;border-radius:999px;background:var(--ink-50);font-size:.74rem;font-weight:700;color:var(--ink-500)}
.toast-stack{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:2000;pointer-events:none}
.toast{background:#fff;border:1px solid var(--ink-100);border-radius:10px;padding:11px 14px;box-shadow:0 8px 24px rgba(11,18,32,.16);display:flex;align-items:center;gap:10px;font-size:.86rem;font-weight:600;color:var(--ink-900);pointer-events:auto;min-width:240px}
.toast.ok{border-left:3px solid #00aa50}
.toast.err{border-left:3px solid #d92d20}
.toast svg{width:16px;height:16px;flex-shrink:0}
</style>
</head>
<body>
<div class="admin-overlay"></div>
<div class="admin-shell">
  <aside class="admin-sidebar"></aside>
  <main class="admin-main">
    <header class="admin-topbar"></header>
    <div class="admin-content">
      <div class="breadcrumb">
        <a href="index.html">Dashboard</a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        <strong>Publications</strong>
      </div>
      <div class="admin-page-head">
        <div>
          <h1>Publications</h1>
          <p>Pile de validation des chantiers + journal des publications réalisées.</p>
        </div>
      </div>

      <!-- À VALIDER -->
      <div class="section-head" style="margin-top:18px">
        <h3>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
          En attente de validation
        </h3>
        <span class="count-pill" id="countValidation">—</span>
      </div>
      <div id="listValidation"></div>

      <!-- BROUILLONS -->
      <div class="section-head" style="margin-top:28px">
        <h3>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Brouillons
        </h3>
        <span class="count-pill" id="countDraft">—</span>
      </div>
      <div id="listDraft"></div>

      <!-- PUBLIÉS RÉCENTS -->
      <div class="section-head" style="margin-top:28px">
        <h3>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>
          Publiés récemment
        </h3>
        <span class="count-pill" id="countPublished">—</span>
      </div>
      <div id="listPublished"></div>
    </div>
  </main>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="assets/supabase.js"></script>
<script src="assets/admin.js"></script>
<script src="assets/layout.js"></script>
<script>
function toast(msg,type='ok',d=2600){
  const stack=document.getElementById('toastStack');
  const t=document.createElement('div'); t.className='toast '+type;
  t.innerHTML=(type==='ok'?'<svg viewBox="0 0 24 24" fill="none" stroke="#00aa50" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="#d92d20" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/></svg>')+'<span>'+msg+'</span>';
  stack.appendChild(t); setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),200)},d);
}

(async function(){
  await HCSupabase.init();
  const session = await HCAdmin.requireAuth();
  if (!session) return;
  await HCLayout.mount('publications', 'Publications');

  const c = await HCSupabase.init();
  const METIER_LABELS = { plomberie:'Plomberie',chauffage:'Chauffage',electricite:'Électricité',serrurerie:'Serrurerie',vitrerie:'Vitrerie',renovation:'Rénovation',menuiserie:'Menuiserie',volets:'Volets',pmr:'Adaptation PMR',multiservice:'Multi-services' };

  async function load(){
    const { data, error } = await c.from('realisations').select('id,title,status,metier,ville,image_before,image_after,created_at,published_at').order('created_at',{ascending:false});
    if (error) { toast('Erreur : '+error.message,'err'); return; }
    const all = data || [];
    render('listValidation', all.filter(r=>r.status==='validation'), 'validation');
    render('listDraft',      all.filter(r=>r.status==='brouillon'),  'brouillon');
    render('listPublished',  all.filter(r=>r.status==='publie').slice(0,10), 'publie');
    document.getElementById('countValidation').textContent = all.filter(r=>r.status==='validation').length;
    document.getElementById('countDraft').textContent      = all.filter(r=>r.status==='brouillon').length;
    document.getElementById('countPublished').textContent  = all.filter(r=>r.status==='publie').length;
  }

  function render(elId, items, status){
    const el = document.getElementById(elId);
    if (!items.length){
      el.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="20 6 9 17 4 12"/></svg><div>${status==='validation'?'Aucune publication en attente — tout est traité ✓':status==='brouillon'?'Aucun brouillon en cours':'Aucun chantier publié'}</div></div>`;
      return;
    }
    el.innerHTML = items.map(r => {
      const img = r.image_after || r.image_before;
      const m = METIER_LABELS[r.metier] || r.metier;
      const when = new Date(r.published_at || r.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
      let actions = '';
      if (status === 'brouillon' || status === 'validation'){
        actions += `<button class="btn btn-primary" data-act="publish" data-id="${r.id}">Publier</button>`;
        if (status === 'brouillon') actions += `<button class="btn" data-act="validate" data-id="${r.id}">Mettre à valider</button>`;
      }
      actions += `<a class="btn" href="realisations.html#${r.id}">Éditer</a>`;
      return `
        <div class="pub-card" data-id="${r.id}">
          <div class="pub-thumb">${img ? `<img src="${img}" alt="" loading="lazy">` : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>'}</div>
          <div class="pub-info">
            <h3>${escapeHtml(r.title)}</h3>
            <div class="pub-info-meta">
              <span class="tag">${m}</span>
              <span>📍 ${escapeHtml(r.ville)}</span>
              <span>· ${when}</span>
            </div>
          </div>
          <div class="pub-actions">${actions}</div>
        </div>
      `;
    }).join('');
    el.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const act = btn.dataset.act;
        const newStatus = act === 'publish' ? 'publie' : 'validation';
        btn.disabled = true; btn.textContent = '…';
        const update = { status: newStatus, updated_at: new Date().toISOString() };
        if (newStatus === 'publie') update.published_at = new Date().toISOString();
        const { error } = await c.from('realisations').update(update).eq('id', id);
        if (error) toast('Erreur : '+error.message,'err',3500);
        else { toast('Statut mis à jour'); await load(); }
      });
    });
  }

  function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  await load();
})();
</script>
</body>
</html>
