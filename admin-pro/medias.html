<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Médiathèque · Back-Office HELP Confort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
.med-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px;padding:12px;background:#fff;border:1px solid var(--ink-100);border-radius:14px;box-shadow:0 1px 2px rgba(11,18,32,.04)}
.med-toolbar .toolbar-search{flex:1 1 240px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--ink-50);border:1px solid var(--ink-100);border-radius:10px}
.med-toolbar .toolbar-search input{flex:1;border:none;background:transparent;outline:none;font:inherit;color:var(--ink-900);font-size:.88rem}
.med-toolbar .toolbar-search svg{width:16px;height:16px;color:var(--ink-400)}
.med-toolbar select{padding:8px 32px 8px 12px;border:1px solid var(--ink-100);border-radius:10px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667085' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>") right 10px center/14px no-repeat;font:inherit;font-size:.86rem;color:var(--ink-900);appearance:none;cursor:pointer;font-weight:500}
.med-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.med-card{position:relative;background:#fff;border:1px solid var(--ink-100);border-radius:12px;overflow:hidden;aspect-ratio:1;cursor:pointer;transition:.18s;box-shadow:0 1px 2px rgba(11,18,32,.04)}
.med-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(11,18,32,.08)}
.med-card img{width:100%;height:100%;object-fit:cover;display:block}
.med-card .overlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(11,18,32,.7) 0%, transparent 50%);opacity:0;transition:.18s;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff;font-size:.74rem;font-weight:600}
.med-card:hover .overlay{opacity:1}
.med-card .folder-tag{position:absolute;top:6px;left:6px;padding:2px 7px;border-radius:6px;background:rgba(11,18,32,.78);color:#fff;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;backdrop-filter:blur(6px)}
.med-empty{padding:40px;text-align:center;color:var(--ink-400);background:#fff;border:1px solid var(--ink-100);border-radius:14px}
.med-empty svg{width:48px;height:48px;margin-bottom:10px;opacity:.4}
.med-stats{display:flex;gap:16px;margin-bottom:18px;font-size:.84rem;color:var(--ink-500);flex-wrap:wrap}
.med-stats strong{color:var(--ink-900);font-weight:700}
.lightbox{position:fixed;inset:0;background:rgba(11,18,32,.92);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:90vh;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.lightbox .lb-info{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);padding:8px 14px;border-radius:8px;font-size:.84rem;font-weight:600;color:var(--ink-900);max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<link rel="manifest" href="/admin-pro/manifest.webmanifest"><meta name="theme-color" content="#0DA0CF"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="HC Admin"><link rel="apple-touch-icon" href="/logo-officiel.jpg">
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("/admin-pro/sw.js").catch(()=>{});});}</script>
</head>
<body>
<script src="assets/hc-admin-auth.js?v=20260603"></script>
<div class="admin-overlay"></div>
<div class="admin-shell">
  <aside class="admin-sidebar"></aside>
  <main class="admin-main">
    <header class="admin-topbar"></header>
    <div class="admin-content">
      <div class="breadcrumb">
        <a href="index.html">Dashboard</a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        <strong>Médiathèque</strong>
      </div>
      <div class="admin-page-head">
        <div>
          <h1>Médiathèque</h1>
          <p>Toutes les photos uploadées dans le bucket Supabase Storage.</p>
        </div>
      </div>

      <div class="med-stats" id="medStats">Chargement…</div>

      <div class="med-toolbar">
        <div class="toolbar-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="medSearch" placeholder="Rechercher par nom…">
        </div>
        <select id="medFolder">
          <option value="">Tous dossiers</option>
          <option value="before">Photos avant</option>
          <option value="after">Photos après</option>
        </select>
      </div>

      <div id="medGrid"></div>
    </div>
  </main>
</div>

<div class="lightbox" id="medLightbox">
  <img id="lbImg" alt="">
  <div class="lb-info" id="lbInfo"></div>
</div>

<script src="assets/supabase.js"></script>
<script src="assets/admin.js"></script>
<script src="assets/layout.js"></script>
<script>
(async function() {
  await HCSupabase.init();
  const session = await HCAdmin.requireAuth();
  if (!session) return;
  await HCLayout.mount('medias', 'Médiathèque');

  const c = await HCSupabase.init();
  const BUCKET = 'realisations'; // HC-FIX 2026-05-21 : bucket Supabase sans accent
  let allFiles = [];

  async function loadFiles() {
    const grid = document.getElementById('medGrid');
    grid.innerHTML = '<div class="med-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><div>Chargement des médias…</div></div>';

    const all = [];
    for (const folder of ['before', 'after']) {
      const { data, error } = await c.storage.from(BUCKET).list(folder, {
        limit: 200, sortBy: { column: 'created_at', order: 'desc' }
      });
      if (error) { console.warn('Folder ' + folder + ' :', error); continue; }
      (data || []).forEach(f => {
        if (f.name && !(f.id||'').startsWith('.')) {
          const { data: pub } = c.storage.from(BUCKET).getPublicUrl(folder + '/' + f.name);
          all.push({
            folder, name: f.name, path: folder + '/' + f.name,
            url: pub.publicUrl, size: f.metadata?.size || 0,
            created: f.created_at
          });
        }
      });
    }
    allFiles = all;
    const totalSize = all.reduce((s,f)=>s+(f.size||0),0);
    const nBefore = all.filter(f=>f.folder==='before').length;
    const nAfter = all.filter(f=>f.folder==='after').length;
    document.getElementById('medStats').innerHTML =
      `<span><strong>${all.length}</strong> média${all.length>1?'s':''}</span>` +
      `<span><strong>${nBefore}</strong> photo${nBefore>1?'s':''} avant</span>` +
      `<span><strong>${nAfter}</strong> photo${nAfter>1?'s':''} après</span>` +
      `<span><strong>${formatBytes(totalSize)}</strong> au total</span>`;
    render();
  }

  function render() {
    const q = document.getElementById('medSearch').value.toLowerCase().trim();
    const f = document.getElementById('medFolder').value;
    const filtered = allFiles.filter(file => {
      if (f && file.folder !== f) return false;
      if (q && !file.name.toLowerCase().includes(q)) return false;
      return true;
    });
    const grid = document.getElementById('medGrid');
    if (!filtered.length) {
      grid.innerHTML = allFiles.length
        ? '<div class="hc-empty"><div class="hc-empty-icon">🔍</div><h3>Aucun résultat</h3><p>Modifie tes filtres pour voir d\'autres médias.</p></div>'
        : '<div class="hc-empty"><div class="hc-empty-icon">📸</div><h3>Médiathèque vide</h3><p>Tes photos chantier alimentent la médiathèque automatiquement. Crée ton premier chantier pour démarrer.</p><a href="realisations.html?action=new" class="btn btn-primary" style="margin-top:6px;display:inline-block">+ Créer un chantier</a></div>';
      return;
    }
    grid.innerHTML = '<div class="med-grid">' + filtered.map(f => `
      <div class="med-card" data-url="${f.url}" data-name="${f.name}" data-folder="${f.folder}">
        <span class="folder-tag">${f.folder === 'before' ? 'Avant' : 'Après'}</span>
        <img src="${f.url}" alt="${f.name}" loading="lazy">
        <div class="overlay">${formatBytes(f.size)}<br>${new Date(f.created).toLocaleDateString('fr-FR')}</div>
      </div>
    `).join('') + '</div>';
    grid.querySelectorAll('.med-card').forEach(card => {
      card.addEventListener('click', () => {
        document.getElementById('lbImg').src = card.dataset.url;
        document.getElementById('lbInfo').textContent = card.dataset.name + ' · ' + (card.dataset.folder === 'before' ? 'Avant' : 'Après');
        document.getElementById('medLightbox').classList.add('open');
      });
    });
  }

  function formatBytes(b) {
    if (!b) return '0 ko';
    if (b < 1024) return b + ' o';
    if (b < 1048576) return (b/1024).toFixed(1) + ' ko';
    return (b/1048576).toFixed(2) + ' Mo';
  }

  document.getElementById('medSearch').addEventListener('input', render);
  document.getElementById('medFolder').addEventListener('change', render);
  document.getElementById('medLightbox').addEventListener('click', () => document.getElementById('medLightbox').classList.remove('open'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('medLightbox').classList.remove('open'); });

  await loadFiles();
})();
</script>
</body>
</html>
