<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Avis clients · Back-Office HELP! Confort</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
.rv-card{background:#fff;border:1px solid var(--ink-100);border-radius:14px;padding:22px;margin-bottom:14px}
.rv-card h3{font-size:1rem;font-weight:800;color:var(--ink-900);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.rv-empty{text-align:center;padding:50px 20px;color:var(--ink-500);background:#fff;border:1px dashed var(--ink-200);border-radius:14px}
.rv-empty svg{width:48px;height:48px;color:var(--ink-300);margin-bottom:12px}
.rv-source{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;background:rgba(13,160,207,.10);color:var(--hc-primary);font-size:.72rem;font-weight:700}
</style>
</head>
<body>
<div class="admin-overlay"></div>
<div class="admin-shell">
  <aside class="admin-sidebar"></aside>
  <main class="admin-main">
    <header class="admin-topbar"></header>
    <div class="admin-content">
      <div class="breadcrumb">
        <a href="index.html">Dashboard</a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>
        <strong>Avis clients</strong>
      </div>
      <div class="admin-page-head">
        <div><h1>Avis clients</h1><p>Synchronisation des avis Google &amp; Trustville (Phase D).</p></div>
      </div>

      <div id="rvContent"></div>
    </div>
  </main>
</div>

<script src="assets/supabase.js"></script>
<script src="assets/admin.js"></script>
<script src="assets/layout.js"></script>
<script>
(async function(){
  await HCSupabase.init();
  const session = await HCAdmin.requireAuth();
  if (!session) return;
  await HCLayout.mount('reviews', 'Avis clients');

  const c = await HCSupabase.init();
  const { data: settings } = await c.from('app_settings').select('value').eq('key','gbp').single();
  const gbpReady = !!(settings?.value?.access_token);

  const el = document.getElementById('rvContent');
  if (!gbpReady) {
    el.innerHTML = `
      <div class="rv-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <h3 style="margin:0 0 6px;color:var(--ink-900)">Avis Google non synchronisés</h3>
        <p style="margin:0 0 16px;max-width:520px;margin-inline:auto">Pour afficher vos avis Google ici (et y répondre depuis le back-office), connectez Google Business Profile dans Paramètres.</p>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <a href="../guides/gbp.md" target="_blank" class="btn">📖 Guide GBP (30 min)</a>
          <a href="settings.html#section-gbp" class="btn btn-primary">Configurer →</a>
        </div>
      </div>
      <div class="rv-card" style="margin-top:20px">
        <h3>En attendant la sync</h3>
        <p style="font-size:.88rem;color:var(--ink-500);line-height:1.6">Vous pouvez :</p>
        <ul style="font-size:.88rem;color:var(--ink-500);line-height:1.7;padding-left:20px;margin:0">
          <li>Voir vos avis sur <a href="https://business.google.com/" target="_blank" style="color:var(--hc-primary);font-weight:600">Google Business Profile</a></li>
          <li>Voir les avis Facebook sur votre <a href="https://www.facebook.com/depanaudo/reviews" target="_blank" style="color:var(--hc-primary);font-weight:600">page @depanaudo</a></li>
          <li>Vos témoignages sont déjà affichés sur le site public dans la section <a href="../#avis" target="_blank" style="color:var(--hc-primary);font-weight:600">Avis clients</a></li>
        </ul>
      </div>
    `;
  } else {
    el.innerHTML = `
      <div class="rv-card">
        <h3>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0DA0CF" stroke-width="2.4"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          GBP connecté
        </h3>
        <p style="font-size:.88rem;color:var(--ink-500);line-height:1.6">La sync des avis sera implémentée dans une prochaine vague — Edge Function <code>sync-reviews</code> qui interrogera l'API GBP toutes les heures.</p>
      </div>
    `;
  }
})();
</script>
</body>
</html>
