<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css">
<style>
.rv-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.rv-stat{background:#fff;border:1px solid var(--ink-100);border-radius:12px;padding:14px}
.rv-stat .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-500);font-weight:700;margin-bottom:4px}
.rv-stat .val{font-size:1.5rem;font-weight:800;color:var(--ink-900);line-height:1}
.rv-stat .meta{font-size:.74rem;color:var(--ink-400);margin-top:4px}
.stars{display:inline-flex;gap:1px}
.stars svg{width:14px;height:14px;color:#FFB400}
.rv-card{background:#fff;border:1px solid var(--ink-100);border-radius:12px;padding:16px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:flex-start}
.rv-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0DA0CF,#0a7fa8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;overflow:hidden}
.rv-avatar img{width:100%;height:100%;object-fit:cover}
.rv-body h3{font-size:.94rem;font-weight:700;color:var(--ink-900);margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rv-body .meta{font-size:.78rem;color:var(--ink-500);margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rv-body .comment{font-size:.88rem;color:var(--ink-700);line-height:1.5;margin-bottom:8px;white-space:pre-wrap}
.rv-reply{margin-top:10px;padding:10px 12px;background:rgba(13,160,207,.05);border-left:3px solid var(--hc-primary);border-radius:6px;font-size:.84rem;color:var(--ink-700)}
.rv-reply strong{font-size:.74rem;color:var(--hc-primary);font-weight:800;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px}
.rv-actions{display:flex;flex-direction:column;gap:6px}
.rv-actions .btn{padding:6px 10px;font-size:.78rem;white-space:nowrap}
.rv-source-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;font-size:.7rem;font-weight:700}
.rv-source-pill.google{background:rgba(66,133,244,.10);color:#1a73e8}
.rv-source-pill.facebook{background:rgba(24,119,242,.10);color:#1877F2}
.rv-priority{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;font-size:.68rem;font-weight:800;text-transform:uppercase}
.rv-priority.urgente{background:rgba(217,45,32,.12);color:#a51919}
.rv-priority.haute{background:rgba(255,184,0,.16);color:#7a4c00}
.rv-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding:10px;background:#fff;border:1px solid var(--ink-100);border-radius:12px}
.rv-toolbar select{padding:7px 28px 7px 10px;border:1px solid var(--ink-100);border-radius:9px;font:inherit;font-size:.82rem;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667085' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>") right 8px center/12px no-repeat;appearance:none;cursor:pointer;font-weight:500}
.modal-backdrop{position:fixed;inset:0;background:rgba(11,18,32,.50);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto}
.modal-backdrop.is-open{display:flex}
.modal-panel{background:#fff;border-radius:16px;width:100%;max-width:600px;box-shadow:0 24px 60px rgba(11,18,32,.30)}
.modal-head,.modal-foot{padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.modal-head{border-bottom:1px solid var(--ink-100)}
.modal-head h2{font-size:1.02rem;font-weight:800;margin:0}
.modal-foot{border-top:1px solid var(--ink-100);background:var(--ink-50);justify-content:flex-end;gap:8px;border-radius:0 0 16px 16px}
.modal-body{padding:20px}
.toast-stack{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:2000;pointer-events:none}
.toast{background:#fff;border:1px solid var(--ink-100);border-radius:10px;padding:11px 14px;box-shadow:0 8px 24px rgba(11,18,32,.16);font-size:.86rem;font-weight:600;color:var(--ink-900);pointer-events:auto;min-width:240px}
.toast.ok{border-left:3px solid #00aa50}
.toast.err{border-left:3px solid #d92d20}
@media(max-width:760px){
  .rv-card{grid-template-columns:auto 1fr}
  .rv-actions{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
}
</style>

<script>
function toast(msg,type='ok',d=2400){
  const stack=document.getElementById('toastStack');
  const t=document.createElement('div'); t.className='toast '+type;
  t.textContent=msg;
  stack.appendChild(t); setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),200)},d);
}

let _all = [];
let _currentReply = null;

(async function(){
  await HCSupabase.init();
  const session = await HCAdmin.requireAuth();
  if (!session) return;
  await HCLayout.mount('reviews', 'Avis clients');

  const c = await HCSupabase.init();

  async function load(){
    const { data, error } = await c.from('reviews').select('*').order('posted_at',{ascending:false});
    if (error) {
      if (error.code === '42P01') toast('Table reviews absente — exécutez setup_reviews.sql','err',6000);
      else toast('Erreur : '+error.message,'err');
      return;
    }
    _all = data || [];
    renderStats();
    renderList();
  }

  function renderStats(){
    const n = _all.length;
    const ratings = _all.map(r => r.rating);
    const avg = n ? (ratings.reduce((a,b)=>a+b,0)/n).toFixed(2) : '—';
    const newCount = _all.filter(r => r.status === 'new').length;
    const negCount = _all.filter(r => r.rating <= 2).length;
    const replied = _all.filter(r => r.status === 'replied').length;
    const replyRate = n ? Math.round(replied/n*100) : 0;

    document.getElementById('rvStats').innerHTML = `
      <div class="rv-stat"><div class="lbl">Note moyenne</div><div class="val">${avg}<span style="font-size:.9rem;color:var(--ink-400);font-weight:600">/5</span></div><div class="meta">${n} avis</div></div>
      <div class="rv-stat"><div class="lbl">À répondre</div><div class="val" style="color:${newCount?'#d92d20':'var(--ink-900)'}">${newCount}</div><div class="meta">${newCount?'nécessitent attention':'tout est traité ✓'}</div></div>
      <div class="rv-stat"><div class="lbl">Avis négatifs</div><div class="val" style="color:${negCount?'#7a4c00':'var(--ink-900)'}">${negCount}</div><div class="meta">≤ 2 étoiles</div></div>
      <div class="rv-stat"><div class="lbl">Taux de réponse</div><div class="val">${replyRate}<span style="font-size:.9rem;color:var(--ink-400);font-weight:600">%</span></div><div class="meta">${replied}/${n}</div></div>
    `;
  }

  function stars(rating){
    let html = '<span class="stars">';
    for (let i=1; i<=5; i++) {
      html += i <= rating
        ? '<svg viewBox="0 0 24 24" fill="#FFB400"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="#e5e7eb"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
    }
    return html + '</span>';
  }

  function renderList(){
    const sFilter = document.getElementById('filterStatus').value;
    const rFilter = document.getElementById('filterRating').value;
    const srcFilter = document.getElementById('filterSource').value;
    const agFilter = document.getElementById('filterAgence').value;

    const filtered = _all.filter(rv => {
      if (sFilter && rv.status !== sFilter) return false;
      if (rFilter && Math.floor(rv.rating) !== parseInt(rFilter,10)) return false;
      if (srcFilter && rv.source !== srcFilter) return false;
      if (agFilter && rv.agence !== agFilter) return false;
      return true;
    });

    const list = document.getElementById('rvList');
    if (!filtered.length) {
      const m = _all.length
        ? { ic:'🔍', h:'Aucun résultat', p:'Modifie tes filtres (statut, étoiles, source, agence).' }
        : { ic:'⭐', h:'Aucun avis synchronisé', p:'Clique « Synchroniser » en haut à droite pour récupérer tes avis Google des 2 fiches.' };
      list.innerHTML = `<div class="hc-empty"><div class="hc-empty-icon">${m.ic}</div><h3>${m.h}</h3><p>${m.p}</p></div>`;
      return;
    }

    list.innerHTML = filtered.map(rv => {
      const initial = (rv.author_name || 'A')[0].toUpperCase();
      const when = timeAgo(rv.posted_at);
      const priority = rv.priority !== 'normale' ? `<span class="rv-priority ${rv.priority}">${rv.priority === 'urgente' ? '🔥 Urgent' : '⚠ À traiter'}</span>` : '';
      const srcIcon = rv.source === 'google' ? '<svg width="10" height="10" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/></svg>' : '<svg width="10" height="10" viewBox="0 0 24 24" fill="#1877F2"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"/></svg>';
      const agenceLabel = rv.agence === 'depan-dk' ? "Dépan'DK" : "Dépan'Audo";

      return `
        <div class="rv-card" data-id="${rv.id}">
          <div class="rv-avatar">${rv.author_photo_url ? `<img src="${rv.author_photo_url}" alt="">` : initial}</div>
          <div class="rv-body">
            <h3>
              ${escapeHtml(rv.author_name)}
              ${stars(rv.rating)}
              ${priority}
            </h3>
            <div class="meta">
              <span class="rv-source-pill ${rv.source}">${srcIcon} ${rv.source}</span>
              <span>📍 ${agenceLabel}</span>
              <span>${when}</span>
            </div>
            ${rv.comment ? `<div class="comment">${escapeHtml(rv.comment)}</div>` : '<div class="comment" style="font-style:italic;color:var(--ink-400)">Note seule, sans commentaire</div>'}
            ${rv.reply_text ? `<div class="rv-reply"><strong>Votre réponse</strong>${escapeHtml(rv.reply_text)}</div>` : ''}
          </div>
          <div class="rv-actions">
            ${rv.source === 'facebook'
              ? `<a class="btn btn-primary" href="${rv.source_url || 'https://business.facebook.com/latest/reviews'}" target="_blank" rel="noopener noreferrer" title="L'API Facebook ne permet plus de répondre aux avis depuis 2021 — utilise Meta Business Suite"><svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14" style="vertical-align:-2px;margin-right:4px"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"/></svg>Répondre sur Facebook</a>`
              : (rv.reply_text
                ? `<button class="btn" data-edit="${rv.id}">Modifier la réponse</button>`
                : `<button class="btn btn-primary" data-reply="${rv.id}">Répondre</button>`)
            }
            ${rv.source_url && rv.source !== 'facebook' ? `<a class="btn" href="${rv.source_url}" target="_blank" rel="noopener noreferrer">Voir source</a>` : ''}
          </div>
        </div>
      `;
    }).join('');

    list.querySelectorAll('[data-reply],[data-edit]').forEach(b => {
      b.addEventListener('click', () => openReply(b.dataset.reply || b.dataset.edit));
    });
  }

  function openReply(id){
    const rv = _all.find(x => x.id === id);
    if (!rv) return;
    _currentReply = rv;
    document.getElementById('replyBody').innerHTML = `
      <div style="padding:10px 12px;background:var(--ink-50);border-radius:10px;margin-bottom:14px">
        <div style="font-size:.78rem;color:var(--ink-500);margin-bottom:4px">${escapeHtml(rv.author_name)} · ${stars(rv.rating).replace(/width="14"/g,'width="11"').replace(/height="14"/g,'height="11"')}</div>
        <div style="font-size:.88rem;color:var(--ink-700);line-height:1.5">${escapeHtml(rv.comment || '(note seule)')}</div>
      </div>
      <label style="font-size:.78rem;font-weight:700;color:var(--ink-700);display:block;margin-bottom:6px">Votre réponse</label>
      <textarea id="replyText" rows="5" placeholder="Bonjour ${escapeHtml(rv.author_name)}, merci pour votre retour…" style="width:100%;padding:10px 12px;border:1px solid var(--ink-100);border-radius:10px;font:inherit;font-size:.88rem;line-height:1.5;resize:vertical">${escapeHtml(rv.reply_text || '')}</textarea>
      <div style="font-size:.74rem;color:var(--ink-400);margin-top:6px">⚠️ La réponse sera publiée sur ${rv.source === 'google' ? 'Google Business Profile' : 'Facebook'}.</div>
    `;
    document.getElementById('replyModal').classList.add('is-open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => document.getElementById('replyText').focus(), 100);
  }

  function closeReply(){
    document.getElementById('replyModal').classList.remove('is-open');
    document.body.style.overflow = '';
  }

  // Ajout manuel
  document.getElementById('btnAddManual').addEventListener('click', () => {
    document.getElementById('m_date').value = new Date().toISOString().slice(0,10);
    document.getElementById('manualModal').classList.add('is-open');
  });
  document.getElementById('manualClose').addEventListener('click', () => document.getElementById('manualModal').classList.remove('is-open'));
  document.getElementById('m_cancel').addEventListener('click', () => document.getElementById('manualModal').classList.remove('is-open'));
  document.getElementById('manualModal').addEventListener('click', e => { if (e.target.id === 'manualModal') document.getElementById('manualModal').classList.remove('is-open'); });

  document.getElementById('m_save').addEventListener('click', async () => {
    const author = document.getElementById('m_author').value.trim();
    if (!author) { toast('Le nom de l\'auteur est requis', 'err'); return; }
    const rating = parseInt(document.getElementById('m_rating').value, 10);
    const source = document.getElementById('m_source').value;
    const agence = document.getElementById('m_agence').value;
    const comment = document.getElementById('m_comment').value.trim();
    const dateStr = document.getElementById('m_date').value;
    if (!dateStr) { toast('Date requise', 'err'); return; }
    const url = document.getElementById('m_url').value.trim();

    const btn = document.getElementById('m_save');
    btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Enregistrement…';
    try {
      const payload = {
        source,
        source_id: 'manual-' + Date.now(),
        source_url: url || null,
        agence,
        author_name: author,
        rating,
        comment: comment || null,
        posted_at: new Date(dateStr + 'T12:00:00').toISOString(),
        status: 'new'
      };
      const { error } = await c.from('reviews').insert(payload);
      if (error) throw error;
      toast('Avis ajouté');
      document.getElementById('manualModal').classList.remove('is-open');
      // Reset
      ['m_author','m_comment','m_url'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('m_rating').value = '5';
      document.getElementById('m_source').value = 'trustville';
      await load();
    } catch (e) {
      toast('Erreur : ' + (e.message || e), 'err', 4500);
    } finally {
      btn.disabled = false; btn.textContent = orig;
    }
  });

  // Export CSV
  document.getElementById('btnExport').addEventListener('click', () => {
    const headers = ['Date','Auteur','Note','Source','Agence','Statut','Commentaire','Réponse'];
    const rows = (_all || []).map(r => [
      r.created_at ? new Date(r.created_at).toLocaleDateString('fr-FR') : '',
      r.author || '',
      r.rating || '',
      r.source || '',
      r.agence || '',
      r.status || '',
      (r.comment || '').replace(/[\r\n]+/g,' / '),
      (r.reply || '').replace(/[\r\n]+/g,' / ')
    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([new Uint8Array([0xEF,0xBB,0xBF]), csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'avis-help-confort-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
  });

  // Sync
  // 🩺 Bouton diagnostic : appelle gbp-diagnostic et affiche une checklist clean
  document.getElementById('btnDiagGBP').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    const orig = btn.innerHTML;
    btn.innerHTML = 'Diagnostic en cours…';
    const report = document.getElementById('syncReport');
    try {
      const { data: { session } } = await c.auth.getSession();
      const r = await fetch('https://btcbjwqiivhpwoszomhg.supabase.co/functions/v1/gbp-diagnostic', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + session.access_token, 'content-type': 'application/json' },
        body: '{}'
      });
      const d = await r.json();
      const checks = d.checks || {};
      const ok = (k) => checks[k] ? '<span style="color:#007033;font-weight:700">✓</span>' : '<span style="color:#9F1239;font-weight:700">✗</span>';
      const labels = {
        creds: 'Credentials OAuth (Client ID + Secret + Refresh Token)',
        access_token: 'Access Token valide',
        refresh: 'Renouvellement Access Token (refresh)',
        account: 'Compte GBP accessible',
        loc_st_omer: 'Fiche Saint-Omer lisible',
        loc_dk: 'Fiche Dunkerque lisible',
        reviews: 'Flux d\'avis récupérable'
      };
      const lines = ['<strong style="color:' + (d.success ? '#007033' : '#9F1239') + '">' + (d.success ? '✓ Connexion GBP OK — tout est configuré' : '⚠ Diagnostic Google Business Profile') + '</strong>'];
      lines.push('<ul style="margin:8px 0 0;padding-left:0;list-style:none;font-size:.84rem;line-height:1.7">');
      for (const k of Object.keys(labels)) {
        lines.push('<li>' + ok(k) + ' ' + labels[k] + '</li>');
      }
      lines.push('</ul>');
      if (d.error) {
        lines.push('<div style="margin-top:10px;padding:8px 10px;background:#FEF2F2;border-left:3px solid #E11D48;border-radius:6px;font-size:.82rem;color:#9F1239"><strong>Erreur :</strong> ' + d.error + '</div>');
      }
      if (!d.success) {
        lines.push('<div style="margin-top:10px;font-size:.82rem"><a href="wizard-google.html" class="btn btn-primary" style="display:inline-block;padding:8px 16px;text-decoration:none;border-radius:8px">→ Reconfigurer Google Business Profile</a> <a href="settings.html#section-gbp" class="btn" style="display:inline-block;padding:8px 16px;text-decoration:none;border-radius:8px;margin-left:4px">Paramètres GBP</a></div>');
      }
      report.innerHTML = lines.join('');
      report.style.display = 'block';
    } catch (err) {
      report.innerHTML = '<strong style="color:#9F1239">❌ Erreur diagnostic</strong><br>' + (err.message || err) + '<br><small>L\'edge function <code>gbp-diagnostic</code> est-elle déployée ?</small>';
      report.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.innerHTML = orig;
    }
  });

  document.getElementById('btnSync').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    const orig = btn.innerHTML;
    btn.innerHTML = 'Synchronisation…';
    const report = document.getElementById('syncReport');
    try {
      const { data: { session } } = await c.auth.getSession();
      const r = await fetch('https://btcbjwqiivhpwoszomhg.supabase.co/functions/v1/sync-reviews', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + session.access_token, 'content-type': 'application/json' },
        body: '{}'
      });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || 'Erreur');
      const g = d.results.google;
      const so = g.byLocation?.['depan-audo'];
      const dk = g.byLocation?.['depan-dk'];
      // 🔍 Détection token expiré dans les erreurs — alerte explicite
      var allErrors = [].concat(so?.errors||[], dk?.errors||[], g.errors||[]).join(' ');
      var tokenExpired = /invalid_grant|token has been expired|token expired|revoked|unauthorized/i.test(allErrors);
      if (tokenExpired) {
        report.innerHTML =
          '<div style="padding:14px 18px;background:#FEE2E2;border-left:4px solid #DC2626;border-radius:10px;margin-bottom:12px">' +
          '<strong style="color:#991B1B;font-size:1rem">🔴 Token Google Business expiré — Re-autorisation requise</strong>' +
          '<p style="margin:6px 0 12px;color:#7F1D1D;font-size:.88rem;line-height:1.5">' +
          'Le refresh token Google a été révoqué (compte Google déconnecté ou app retirée des autorisations). ' +
          'Aucun nouvel avis ne sera synchronisé tant que tu ne re-fais pas la connexion. <strong>2 minutes max</strong>.</p>' +
          '<a href="wizard-google.html" style="display:inline-flex;align-items:center;gap:8px;padding:11px 22px;background:#DC2626;color:#fff;text-decoration:none;border-radius:10px;font-weight:800;box-shadow:0 4px 12px rgba(220,38,38,.30)">→ Reconnecter Google Business maintenant</a>' +
          '<a href="settings.html#section-gbp" style="margin-left:8px;display:inline-flex;align-items:center;gap:6px;padding:11px 16px;background:#fff;color:#7F1D1D;border:1px solid #DC2626;text-decoration:none;border-radius:10px;font-weight:600">Paramètres GBP</a>' +
          '</div>';
        report.style.display = 'block';
        return;
      }
      const lines = [
        '<strong style="color:#007033">✓ Synchronisation terminée</strong>',
        '<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:6px">'
        + (so ? `<span><strong>Saint-Omer :</strong> ${so.synced}/${so.fetched} avis ${so.errors.length ? '<span style="color:#9F1239">(' + so.errors.length + ' erreur(s))</span>' : ''}</span>` : '')
        + (dk ? `<span><strong>Dunkerque :</strong> ${dk.synced}/${dk.fetched} avis ${dk.errors.length ? '<span style="color:#9F1239">(' + dk.errors.length + ' erreur(s))</span>' : ''}</span>` : '')
        + (d.results.facebook?.aggregate ? `<span><strong>Facebook :</strong> ${d.results.facebook.aggregate.rating}/5 (${d.results.facebook.aggregate.count} avis)</span>` : '')
        + '</div>'
      ];
      if (g.errors?.length) {
        lines.push('<div style="margin-top:8px;color:#9F1239;font-size:.82em"><strong>Erreurs :</strong><br>' + g.errors.map(e => '· ' + e).join('<br>') + '</div>');
      }
      report.innerHTML = lines.join('');
      report.style.display = 'block';
      toast(`✓ ${g.synced} avis Google synchronisés`);
      _renderLastSync(d.synced_at);
      await load();
    } catch (err) {
      report.innerHTML = '<strong style="color:#9F1239">❌ Erreur de synchronisation</strong><br><span style="font-size:.82em;color:var(--ink-500)">' + (err.message || err) + '</span><br><span style="font-size:.78em;color:var(--ink-400);margin-top:4px;display:inline-block">Vérifie la connexion dans <a href="settings.html#section-gbp">Paramètres → Google Business Profile</a> ou ré-ouvre <a href="wizard-google.html">l\'assistant</a>.</span>';
      report.style.display = 'block';
      toast('Erreur sync : ' + err.message, 'err', 4500);
    } finally {
      btn.disabled = false;
      btn.innerHTML = orig;
    }
  });

  function _renderLastSync(iso) {
    const el = document.getElementById('lastSyncInfo');
    if (!iso || !el) return;
    const dt = new Date(iso);
    const diff = Math.round((Date.now() - dt.getTime()) / 60000);
    const human = diff < 1 ? "à l'instant"
      : diff < 60 ? "il y a " + diff + " min"
      : diff < 1440 ? "il y a " + Math.round(diff / 60) + " h"
      : dt.toLocaleDateString('fr-FR');
    el.textContent = '· Dernière sync ' + human;
    el.style.display = 'inline';
  }

  // Charge la date de dernière sync depuis app_settings
  (async () => {
    try {
      const { data } = await c.from('app_settings').select('value').eq('key', 'gbp').single();
      if (data?.value?.last_synced_at) _renderLastSync(data.value.last_synced_at);
    } catch (_) {}
  })();

  // Reply send
  document.getElementById('btnReplySend').addEventListener('click', async () => {
    const text = document.getElementById('replyText').value.trim();
    if (!text || !_currentReply) return;
    if (_currentReply.source !== 'google') {
      toast('Pour Facebook, répondez directement sur la page FB.', 'err', 4000);
      return;
    }
    try {
      const { data: { session } } = await c.auth.getSession();
      const r = await fetch('https://btcbjwqiivhpwoszomhg.supabase.co/functions/v1/reply-review', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + session.access_token, 'content-type': 'application/json' },
        body: JSON.stringify({ reviewId: _currentReply.id, replyText: text })
      });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || 'Erreur');
      toast('Réponse publiée ✓');
      closeReply();
      await load();
    } catch (err) {
      // 2026-06-01 — Fallback si token GBP expiré : copie réponse + ouvre Google
      const isTokenIssue = /invalid_grant|token|expired|revoked|unauthorized|401|403/i.test(err.message || '');
      if (isTokenIssue) {
        try { await navigator.clipboard.writeText(text); } catch(_){}
        const target = _currentReply.source_url || 'https://business.google.com/reviews';
        if (confirm('⚠️ Token Google expiré.\n\nLa réponse a été COPIÉE dans le presse-papier ✓\n\nOK = ouvrir Google Business pour coller la réponse manuellement.\nAnnuler = juste fermer.')) {
          window.open(target, '_blank', 'noopener');
        }
        // Sauve quand même la réponse en BDD pour ne pas la perdre
        await sb.from('reviews').update({ reply_text: text, reply_posted_at: new Date().toISOString(), reply_by: 'manual' }).eq('id', _currentReply.id);
        closeReply();
        await load();
      } else {
        toast('Erreur : ' + err.message, 'err', 4500);
      }
    }
  });

  // Reply suggérer IA — appelle l'Edge Function dédiée suggest-reply
  document.getElementById('btnReplyAI').addEventListener('click', async () => {
    if (!_currentReply) return;
    const btn = document.getElementById('btnReplyAI');
    btn.disabled = true;
    const origHtml = btn.innerHTML;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="animation:spin 1s linear infinite"><circle cx="12" cy="12" r="9" opacity=".3"/><path d="M12 3a9 9 0 0 1 9 9"/></svg> Réflexion…';
    try {
      const { data: { session } } = await c.auth.getSession();
      const r = await fetch('https://btcbjwqiivhpwoszomhg.supabase.co/functions/v1/suggest-reply', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + session.access_token, 'content-type': 'application/json' },
        body: JSON.stringify({ reviewId: _currentReply.id })
      });
      const d = await r.json();
      if (d.success && d.suggestion) {
        document.getElementById('replyText').value = d.suggestion;
        toast(`Suggestion générée (${d.rating}★) — relisez avant publication`);
      } else {
        toast('Suggestion impossible : ' + (d.error || 'erreur inconnue'), 'err', 5000);
      }
    } catch (e) {
      toast('Edge function indisponible — rédigez manuellement', 'err', 4500);
    } finally {
      btn.disabled = false;
      btn.innerHTML = origHtml;
    }
  });

  document.getElementById('replyClose').addEventListener('click', closeReply);
  document.getElementById('btnReplyCancel').addEventListener('click', closeReply);
  document.getElementById('replyModal').addEventListener('click', e => { if (e.target.id === 'replyModal') closeReply(); });
  ['filterStatus','filterRating','filterSource','filterAgence'].forEach(id => {
    document.getElementById(id).addEventListener('change', renderList);
  });

  function timeAgo(d){
    const ms = Date.now() - new Date(d).getTime();
    const min = Math.floor(ms / 60000);
    if (min < 60) return 'il y a ' + min + ' min';
    const h = Math.floor(min / 60);
    if (h < 24) return 'il y a ' + h + ' h';
    const day = Math.floor(h / 24);
    if (day < 30) return 'il y a ' + day + ' j';
    return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
  }
  function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

  await load();
})();
</script>
</body>
</html>
