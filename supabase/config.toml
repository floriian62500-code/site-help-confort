project_id = "btcbjwqiivhpwoszomhg"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://depan59-62.fr"
additional_redirect_urls = [
  "https://www.depan59-62.fr",
  "https://remarkable-dragon-364e2b.netlify.app",
  "http://localhost:3000"
]
jwt_expiry = 3600
enable_signup = false  # Pas d'inscription publique (admin uniquement)

[auth.email]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
inspector_port = 8083

# ─── Edge Functions publiques (callable depuis le site sans JWT) ────────────
# verify_jwt = false permet les appels anonymes depuis les pages publiques
[functions.notify-subscription]
verify_jwt = false

# notify-order : fonction prévue mais pas encore implémentée (voir TODO)
# [functions.notify-order]
# verify_jwt = false

# generate-post-from-prompt : appelable depuis l'admin (anon JWT suffit, RLS protège la lecture des settings)
[functions.generate-post-from-prompt]
verify_jwt = false
